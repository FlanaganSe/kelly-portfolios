note: >-
  The measured gap is +2.20 points a year on a range of [+0.05, +4.57] against 2.83, so
  the estimate sits under the smallest effect the design could see. This is the detection
  question and not the holding period: the same portfolio would separate from its control in an
  investor's own account in 12.2 years. The verdict was predicted as unresolved in the frozen
  specification before the run.
