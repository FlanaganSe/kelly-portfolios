  anchor: 5-how-many-candidates-a-long-only-optimiser-actually-holds
note: >-
  Experiment 017, run under a frozen specification with a committed artifact. The twelve
  candidate edges are a STATED ladder rather than twelve measured funds: 3.0% a year down to
  nothing, each charged 40 basis points, each drifting 6%, correlated at the 0.435 measured on
  this one portfolio. The optimisation is exact and reproducible; the inputs are assumptions, so
  the answer is a property of that ladder and not of markets. The optimum is still two with
  every cost set to zero and still two at 100 basis points, so dilution rather than cost
  produces it.
