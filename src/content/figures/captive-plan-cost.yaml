note: >-
  Range across the 15%, 18.8% and 23.8% rates, comparing a wholly captive plan with a fully
  self-directed one. The menu starts to bind once less than 55% of your sheltered money is in
  accounts you control. It also makes a pro-rata comparison unbuildable, so any study measuring
  against one overstates its own result.
