note: >-
  Measured on the earlier eight-fund proposal: five active positions, because three of its eight
  tickers are the benchmark. The seven funds published now also carry five active positions, but
  two of them are different funds, so this count describes the shape of the problem rather than
  today's holdings. It prices those five at optimal weights and equal edges, so it is an upper
  bound on anything a portfolio actually realises.
