note: >-
  Never measured. It was the 2012-2025 era's own geometric mean less a 1.50% fee, then restated
  onto a basis where the same history reads 4.17%, with the fee charged again by the consuming
  model. Its own 95% interval was [−2.67, +11.00]. Deleted, not replaced. Correcting it moved
  the recommended trend weight to 25% and the modelled chance of abandonment to 17.2%.
