note: >-
  Fitting each engine to the stock market plus a separate term for the market's down months, over
  137 to 1,194 months, with error bars that allow for calm clustering with calm. Among the seven
  engines other than betting-against-beta, the strongest bend is 1.37 times the noise around it.
  Betting-against-beta's bend is 3.49 times the noise, and it bends the wrong way.
