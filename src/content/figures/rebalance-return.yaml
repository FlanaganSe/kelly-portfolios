note: >-
  The portfolio's own policy, an annual review acting when a holding is a quarter off target,
  over 427 months to May 2026. The test could only have seen a gap of about 1.8% a year
  or wider, so this is too small to read either way and is not a measurement of zero. Rebalance
  to control how much risk you hold, and expect nothing else from it.
