note: >-
  Our subtraction of the issuer's own standardised NAV return, +19.07% a year, from the
  benchmark the issuer itself prints beside it, the S&P 500 at +20.78%. Read from
  returnstackedetfs.com on 2026-08-23, as of 2026-07-31, and re-read independently the same day.
  It is issuer evidence, not a repository measurement. Two cautions the source page states in
  full: the window is 2.9 years, and the benchmark holds one asset and borrows nothing, so the
  figure answers whether the second leg covered its own cost and not whether the fund was a good
  idea at a given level of risk. Standardised returns update
  monthly; re-read before publication.
