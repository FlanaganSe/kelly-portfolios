note: >-
  Four defects at once: a truncated range dropping the distributed reading (−18 basis points), a
  rebalancing hurdle avoided booked as a saving (−14 basis points), lot selection and never selling both
  booked when they are mutually exclusive (−2.8 basis points), and 94.7% of the top figure resting on one
  holding's undistributed CFC accrual. The conditional +19 to +49 is reported and never added.
  aggregate() now raises on a cross-benchmark sum.
