note: >-
  A correction record rather than a second measurement: it exists so the corrections page can
  show the withdrawn figure beside the one that replaced it, and placement-value is the
  standing fact a page should cite. Four defects at once: a truncated range dropping the
  distributed reading (−0.18%), a rebalancing hurdle avoided booked as a saving (−0.14%), lot
  selection and never selling both booked when they are mutually exclusive (−0.028%), and 94.7% of the top figure resting on one holding's undistributed CFC
  accrual. The conditional +0.19% to +0.49% is reported and never added. aggregate() now raises on a
  cross-benchmark sum.
