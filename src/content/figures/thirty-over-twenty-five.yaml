note: >-
  The only whole-portfolio comparison in either tournament that clears the smallest gap its own
  test could see, and the closest thing to a measurement of the trend weight that exists. It is
  not a clean one. The arms are 016e's `recommended_vs_original`: RSST 25 / VTI 24 / VTV 15 /
  VXUS 16 / AVDV 10 / IDMO 5 / AVES 5 against RSST 30 / VTI 20 / AVLV 15 / DFIV 10 / VEA 10 /
  IDMO 5 / IEMG 5 / AVES 5, so the pair differs in four holdings as well as in five points of
  trend, and no arm anywhere holds the recommended seven funds at 30%. Two reasons to read the
  gap as the trend weight rather than the holdings: the two sets of stock funds, stripped of trend and of
  borrowing, scored +0.7996 and +0.79 pp/yr against the same borrowing-free control on the same
  panel; and the gap is negative for the 25% arm in all seven declared sub-periods, -0.19 to
  -0.94. It is a statement about borrowing rather than about how the thing is built: the two
  portfolios differ by 5.4 points of exposure, and over a stretch where US stocks paid 9.83% a
  year above cash, more exposure wins. 016e's own open question 4 asks for the pair that would
  settle it, matched at the same gross exposure, and it has not been run.
