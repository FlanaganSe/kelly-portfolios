note: >-
  Against 0.0182% to 0.0294% for every other S&P 500 tracker audited. SPY is a trust that is
  barred from lending its holdings at all, and it holds dividends in a non-interest-bearing
  account until it pays them out. Read from 110 annual filings to the SEC covering 25 funds and
  eight fiscal years. SPY also has the tightest spread on the fund list, and a spread is paid once
  where a fee is paid every year.
