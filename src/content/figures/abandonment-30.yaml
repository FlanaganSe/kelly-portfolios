label: Chance a holder of the 30% version gives up on it within thirty years, at the middle guess for what trend pays
value: 17%
unit: of simulated thirty-year histories
status: exploratory
asOf: '2026-08-22'
source:
  label: The trend weight under acknowledged ignorance
  docPath: docs/research/trend-weight-under-uncertainty.md
note: >-
  Giving up means selling after the holding falls 20% behind the market. The threshold is an
  assumption; nobody has measured when real investors sell. The same figure for the 25% version
  is 11%.
