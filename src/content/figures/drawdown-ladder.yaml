note: >-
  Stocks bought at a cyclically adjusted price-earnings ratio above 30 ran a median real loss of
  51.8% over the next fifteen years against 36.7% from cheaper entries, on fewer than one
  independent fifteen-year stretch. Only the ratio of the two is carried onto the ladder, which
  is measured in nominal terms on the full record, and the trend is held at its published
  share of the stock exposure. The published 30% sits off the bottom of the ladder; the
  research pages put the worst loss it implies near −70%, and nobody has supplied a number.
