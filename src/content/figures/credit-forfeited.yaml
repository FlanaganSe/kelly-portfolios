note: >-
  Derived for this seven-fund construction from the funds' own filed creditable foreign tax. The
  repository's figure for the eight-fund original is 8.81 basis points a year. Section 408(e)(1) exempts an
  IRA from tax, so a sheltered account has no US tax for section 901 to credit against.
