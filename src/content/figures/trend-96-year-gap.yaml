note: >-
  An average yearly gap after fund costs, on a simple four-market trend rule built from the data
  that existed, because no trend fund did. The gain runs between half a point and 3.6 points a
  year by decade through the 2000s, then 0.6 in the 2010s and 0.3 in the 2020s; measured only from
  2009 it is 0.4 and cannot be told from zero. Worst fall 82.8% against 83.7% for stocks alone.
