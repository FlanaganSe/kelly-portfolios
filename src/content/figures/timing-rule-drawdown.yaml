note: >-
  The one claim on that page that clears the smallest gap its own test could see. A mechanical
  property of cutting off the worst outcomes rather than a reward for taking risk, which is why
  it survives when the average return does not. Repeats in developed markets outside the US, in
  emerging markets and in 1871-1926.
