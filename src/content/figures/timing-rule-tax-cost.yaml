note: >-
  In a Roth the rule trails buy-and-hold by 1.04 pp/yr; in a top-bracket taxable account with a
  basis step-up, by 2.96. The 1.92 difference is the tax the rule itself creates, two and a half
  times the entire pre-tax gap.
