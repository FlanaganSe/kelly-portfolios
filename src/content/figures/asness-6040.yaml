note: >-
  From Cliff Asness, "Should Hedge Funds Hedge?: Why Some Alts Should Have a Beta of 1.0", AQR,
  2025-03-28, the paper in which he endorses return stacking by name and credits Corey Hoffstein
  for it. Verified against the paper itself on 2026-08-23, not against a summary. It is an
  outside corroboration of this repository's funding algebra and is not a repository
  measurement. It is also not a backtest. The table is an openly hypothetical exercise on stated
  assumptions about what markets will pay (stocks at 6.0% excess return and 15% volatility, bonds
  at 2.1% and 7%, alternatives at 3.0% and 10%), with no sample period, no named index and no
  fund behind it. Read it beside the Return Stacked rows, which are a record and disagree.
