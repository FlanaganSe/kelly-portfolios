note: >-
  The timing line of everything measured here, booked against the average investor, shown beside
  the other two benchmarks and never added to them. It measures a different thing from Morningstar's
  published gap, which describes a population: over the ten years to 2025 the average dollar
  earned 8.7% a year against 9.9% for the funds it sat in, about 1.2 points. Morningstar
  disclaims the individual reading, because for every buyer there is a seller. What one
  investor can bank is smaller and swamped by its own 1.5% of drift: for a lump
  sum held throughout, the gap is zero by construction, and across 20,000 simulated ten-year
  paths with level monthly contributions it has a mean of 0.15 points and a standard deviation
  of 2.60.
