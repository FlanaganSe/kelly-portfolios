note: >-
  An inversion of the page's own closed form, now tabulated on it: at zero correlation the
  requirement is (z_P / z_1) squared with z_1 = 0.12566, which is 104.01 at 90%, 171.34 at 95%
  and 342.73 at 99%. The requirement at 90% is 104.01 bets, so the hundred and fifth is the one
  that clears it.
