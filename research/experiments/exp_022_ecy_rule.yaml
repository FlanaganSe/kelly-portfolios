    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_CSV.zip
    manifest: data-manifests/french_us_ff3_monthly.json
    construction: Mkt-RF plus RF, deflated by the Shiller CPI; the averaged-price hostile test only

hostile_tests:
  - Lag the signal one month; re-run the study's own alignment as a sensitivity so the cost of availability is visible.
  - Compare against the arm's own mean weight, not only against 80/20 or 100/0, so that de-risking cannot masquerade as timing.
  - Run the rule on French month-end real returns; a sign flip there is falsifier clause (d).
  - Report the 1980-2000 era, the one with the wrong sign, beside the full-window mean.
  - Holm across the six arms; report the deflated Sharpe at the effective trial count and say the family is a lower bound.
  - Report the minimum detectable effect and years to distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Recompute the Stambaugh bias for this signal's one-month predictive slope and print it beside the result.
  - Report the annual-band clock beside the monthly clock with its turnover, because the investor would run the former.
  - Report the TIPS-spliced signal's reading today beside the Shiller reading, because the two disagree by about a point.

reporting_requirements:
  - The freeze note, including that k = 0.4 was selected on this data and that the workbook is revised, with every table.
  - The MDE, the control and the window named beside every gap, in the same row; never a figure combining two controls.
  - Gross, 3 bp and 10 bp columns, never collapsed.
  - Maximum drawdown, months under water, every crisis episode with the entry weight, the rolling-window share ahead with its independent-window count, and turnover under both clocks, labelled descriptive.
  - The Holm-adjusted p-values and the deflated Sharpe with both trial counts.
  - The Stambaugh table for the signal.
  - Today's reading, percentile and prescribed weight under both signals, with the all-equity scaling.
  - The regret table for the 85/15 position against 100% equity at the four stated premia.
  - The construction implication as arithmetic on the published vector.
  - The sha256 of every source file read.

notes: >
  Exploratory in the strongest sense: the primary sensitivity was chosen on
  this data by the study this run registers, and the specification records
  that. Retain `unresolved` wherever the instrument cannot separate the rule
  from its control. No rule, sleeve or portfolio is promoted by this
  specification; what it can do is replace an unregistered +49.5 bp with a
  registered figure that carries its floor, its lag, its family and its
  crisis record.
