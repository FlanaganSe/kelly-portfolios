# Frozen before any result is examined. Editing any field changes the
# specification hash and therefore creates a new hypothesis in the ledger.
experiment_family: exp_001_factor_decay
title: Factor persistence and decay across frozen eras
entry_point: exp_001_factor_decay
run_kind: exploratory
evidence_class: public-series-evaluation
consumes_final_holdout: false
seed: 20260811

hypothesis: >
  Each of HML, UMD, RMW and CMA, as distributed in the Ken French data library,
  retains a positive arithmetic premium in its post-publication era that is
  economically meaningful gross of costs, and stable enough across the frozen
  eras to justify building and testing an investable implementation. This is a
  hypothesis about the published long-short research series only. It is not a
  hypothesis that any of these factors is investable, and no result from this
  experiment can establish that.

mechanism: >
  Two competing mechanisms are both consistent with a positive pre-publication
  premium, and this experiment cannot separate them. (1) Compensated risk or a
  persistent behavioural friction, which should survive publication roughly
  intact. (2) In-sample selection plus subsequent arbitrage, which McLean and
  Pontiff (2016) find lowers returns out of sample and again after publication,
  with the largest decay in liquid, large-capitalisation, low-idiosyncratic-risk
  stocks. Harvey, Liu and Zhu (2016) put the mean return of a genuinely true
  factor at about 0.55% per month in-sample and gross, so decay is expected even
  under mechanism (1) and a smaller post-publication premium is not by itself
  evidence for mechanism (2).

falsifier: >
  The hypothesis is rejected for a factor when ANY of the following holds in the
  frozen eras. (a) The point estimate of the annualised premium over the full
  post-publication era is less than or equal to zero. (b) The upper end of the
  two-sided 90% block-bootstrap interval for the full post-publication annualised
  premium lies below the materiality threshold of 2.0 percentage points per year,
  i.e. the factor is economically negligible even under a favourable draw.
  (c) The full post-publication point estimate is below 25% of the original-sample
  point estimate AND the recent-era point estimate is less than or equal to zero,
  i.e. decay is both large and continuing. A one-sided 95% test failing to
  exclude a zero mean is explicitly NOT a falsifier: long-lived modest premia
  lack that power over the available sample, and treating the test as a survival
  criterion would reject economically useful premia for want of data. That case
  is recorded as `unresolved`.

universe:
  description: >
    Published long-short factor return series from the Ken French data library,
    US research portfolios, monthly frequency, as distributed at the vintage
    recorded in the data manifest. No individual securities, no funds.
  factors: [HML, UMD, RMW, CMA]
  reference_series: [Mkt-RF, SMB, RF]
  region: US
  frequency: monthly
  units_in_source: percent
  excluded:
    - Developed and Emerging factor files, which have shorter and differently
      constructed histories and are not combined with the US files here.
    - Any investable fund. Exposure and implementation are exp_002.

sample_policy:
  start: "1963-07"
  end: "2025-12"
  held_out: >
    Observations after 2025-12 are not read by this experiment under any
    circumstance. They are reserved as a genuinely post-specification window for
    a later confirmatory test of whatever this exploration proposes. This
    experiment is exploratory and does not consume the final holdout.
  embargo: >
    None required: eras are non-overlapping calendar windows and no forecast is
    made across an era boundary.
  eras:
    - name: hml_original_sample
      start: "1963-07"
      end: "1991-12"
      rationale: >
        Fama and French (1993) sample. The currently distributed file may apply
        modern methodology retroactively to this window, so this is not the
        authors' original series and a difference from their table is expected.
    - name: hml_first_post_publication
      start: "1994-01"
      end: "2003-12"
      rationale: >
        First decade genuinely after the 1993 publication. Predecessor evidence
        on book-to-market dates to at least Rosenberg, Reid and Lanstein (1985),
        so 1993 is a convention, not a clean discovery date.
    - name: hml_full_post_publication
      start: "1994-01"
      end: "2025-12"
      rationale: Full available post-publication window for HML.
    - name: hml_post_rosenberg_alternative
      start: "1986-01"
      end: "2025-12"
      rationale: >
        Predeclared alternative publication date for value. Rosenberg, Reid and
        Lanstein (1985) published the book-to-market result eight years before
        Fama and French (1993) defined HML as a factor, so the discovery date is
        genuinely ambiguous and the sensitivity is reported rather than resolved
        by choosing. Reported alongside the primary era, never substituted for it.
    - name: umd_original_sample
      start: "1965-01"
      end: "1989-12"
      rationale: >
        Jegadeesh and Titman (1993) sample. French's UMD series starts in 1927
        and is a different construction from theirs; the window is theirs, the
        data are not.
    - name: umd_first_post_publication
      start: "1994-01"
      end: "2003-12"
      rationale: >
        Momentum has two candidate publication dates, Jegadeesh and Titman (1993)
        and Carhart (1997), which is exactly the ambiguity the plan warns about.
        1993 is used and the 1997 alternative is a predeclared robustness era.
    - name: umd_full_post_publication
      start: "1994-01"
      end: "2025-12"
      rationale: Full available post-publication window for UMD.
    - name: umd_post_carhart_alternative
      start: "1998-01"
      end: "2025-12"
      rationale: >
        Predeclared alternative publication date. Reported alongside, never
        substituted for the primary era after seeing which looks better.
    - name: rmw_cma_original_sample
      start: "1963-07"
      end: "2013-12"
      rationale: >
        Fama and French (2015) sample. Novy-Marx (2013) is predecessor evidence
        for profitability, so RMW's effective discovery date is earlier and
        disputed.
    - name: rmw_cma_first_post_publication
      start: "2014-01"
      end: "2019-12"
      rationale: >
        Six years is a short window with low power. It is frozen anyway so that
        the recent era cannot be silently widened until a result appears.
    - name: rmw_cma_full_post_publication
      start: "2014-01"
      end: "2025-12"
      rationale: Full available post-publication window for RMW and CMA.
    - name: recent
      start: "2016-01"
      end: "2025-12"
      rationale: >
        A common recent decade for all four factors, spanning the post-2018 value
        drawdown and its partial reversal. It doubles as the predeclared
        alternative post-publication date for RMW and CMA: the primary boundary
        of 2014-01 is the first month outside the authors' own estimation sample
        and after the 2013 working paper circulated, whereas the Journal of
        Financial Economics issue is dated 2015, so 2016-01 is the first full
        calendar year after journal publication. Both are reported.
    - name: common_period
      start: "2014-01"
      end: "2025-12"
      rationale: >
        The only window in which all four factors are simultaneously
        post-publication. Cross-factor correlations and any joint statement must
        be computed here and nowhere else.

benchmark:
  null_hypothesis: zero arithmetic premium in the era
  reference_factor: Mkt-RF from the same file and vintage
  note: >
    A long-short factor series has no investable benchmark. Comparisons against
    the market factor are descriptive; the market factor is not a portfolio this
    experiment claims to hold.

primary_metric:
  name: annualised arithmetic mean premium, per factor per era
  definition: 12 * mean(monthly long-short return in decimal)
  units: percentage points per year
  uncertainty: >
    Two-sided 90% and 95% stationary block-bootstrap intervals, plus a one-sided
    95% lower bound. All three are reported; none is a survival criterion on its
    own.

secondary_metrics:
  - name: geometric contribution
    units: percentage points per year
    note: >
      Reported only where the series is interpretable as a wealth path. A
      long-short series financed at an unstated rate is not, and this is stated
      in the output rather than assumed away.
  - name: annualised volatility
    units: percentage points per year
  - name: Sharpe ratio with block-bootstrap interval
    units: ratio, annualised
  - name: maximum drawdown of the cumulative series
    units: percent
  - name: time under water
    units: months
  - name: worst rolling 12, 36 and 120 month returns
    units: percentage points per period
  - name: pairwise factor correlations, common period only
    units: correlation
  - name: HAC (Newey-West) standard error of the mean
    units: percentage points per year
  - name: effective sample size implied by autocorrelation
    units: months

cost_model:
  applied: false
  reason: >
    The French long-short series are gross of transaction costs, shorting costs,
    fund fees and taxes, and are not investable. Applying a cost model to them
    would manufacture a net figure for a portfolio nobody can hold.
  consequence: >
    Every number this experiment produces is a GROSS UPPER BOUND of unknown
    tightness. Novy-Marx and Velikov (2016) find haircuts of 17% for low-turnover
    and 144% for high-turnover value-weighted long-short strategies, so the
    ordering of factors can reverse net of costs. No net claim may be made from
    this experiment; that is exp_002.
  turnover_reference: >
    UMD is high-turnover and HML, RMW and CMA are annually rebalanced. The
    difference is recorded in the output so that a reader cannot compare their
    gross premia as if they were comparable.

rebalance_rule:
  source: as embedded in the Ken French construction, not chosen here
  hml_rmw_cma: annual rebalance at the end of June on prior fiscal-year accounting
  umd: monthly rebalance on 2-12 month prior returns
  note: >
    This experiment does not rebalance anything. The rule is recorded because it
    determines turnover, and therefore the size of the cost haircut that this
    experiment cannot apply.

inference:
  bootstrap: stationary block bootstrap (Politis and Romano)
  block_length_policy: >
    Mean block length frozen at 12 months for monthly data, with 6 and 24 months
    reported as predeclared neighbours. The length is NOT tuned on the statistic
    being tested. The corrected Politis-White automatic length (Politis and White
    2004 with the Patton, Politis and White 2009 correction) is additionally
    computed from each cell's own series and MUST be reported for every cell
    together with the interval it produces, at equal prominence to the frozen
    length. It is a diagnostic in the sense that it does not decide the falsifier,
    not in the sense that it may be omitted: a frozen length that disagrees
    materially with the data-driven one is a finding about the frozen length.
  multiple_testing_correction: >
    Benjamini-Hochberg FDR at 0.10 across the 4 factors x 5 primary eras = 20
    predeclared tests, reported alongside uncorrected values. The correction
    treats the 20 tests as if independent, which they are not: the eras nest and
    the factors share construction and holdings. The corrected values are
    therefore a lower bound on the true correction, and the ledger's distinct
    specification count is an upper bound on the number of trials. Neither
    resolves specification dependence.
  confidence_level: 0.95
  resamples: 10000
  notes: >
    Power is expected to be low. The output must report, for each factor and era,
    the premium detectable at 80% power given the realised volatility and sample
    length, so that a null result can be read as "cannot tell" rather than "no
    premium".

rejection_rule: >
  Per factor: mark `rejected` when any falsifier clause fires. Mark `unresolved`
  when no clause fires but the two-sided 90% interval for the full
  post-publication premium contains zero, which is the expected outcome for a
  modest surviving premium over this sample. Mark `exploratory` when no clause
  fires and the interval excludes zero; that permits an investable implementation
  to be TESTED in exp_002 and permits nothing else. No factor may be described as
  working, validated, or an edge on the basis of this experiment, and a
  conclusion drawn from the French long-short series alone is out of scope by
  construction.

parameters:
  materiality_threshold_annual_percent: 2.0
  rolling_windows_months: [12, 36, 60, 120]
  power_target: 0.80

  source_pin:
    policy: >
      Both files are pinned by the sha256 of their raw bytes AND by the sha256 of
      the derived table, and a mismatch ABORTS rather than producing a graded
      result. Ken French rebuilds the entire history from the current CRSP
      vintage on every rebuild, so a changed hash is a new vintage, not a corrupt
      download, and a premium computed from an unrecognised file looks exactly
      like a good one. The normalized hash additionally catches a parser change
      that leaves the downloaded bytes identical.
    series:
      - factor_columns: [HML, RMW, CMA]
        reference_columns: [Mkt-RF, SMB, RF]
        dataset_id: french_us_ff5
        table_id: monthly
        manifest_dataset_id: french_us_ff5_monthly
        committed_manifest: data-manifests/french_us_ff5_monthly.json
        source_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_CSV.zip
        expected_sha256_raw: cbc3724812132654fbbe8daae3c46e0f90e70008434f94a7986fe49f1db6ad3b
        expected_sha256_normalized: e1a9870b29d8302c68bc2e8daa902bf5f01039b6420c8e48eb21d9c781fca752
        expected_columns: ["Mkt-RF", "SMB", "HML", "RMW", "CMA", "RF"]
        expected_first_observation: "1963-07"
      - factor_columns: [UMD]
        reference_columns: []
        dataset_id: french_us_momentum
        table_id: monthly
        manifest_dataset_id: french_us_momentum_monthly
        committed_manifest: data-manifests/french_us_momentum_monthly.json
        source_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Momentum_Factor_CSV.zip
        expected_sha256_raw: f405ee2d47a5c75ce05025f789733d0599879361e9836a553504240b89159871
        expected_sha256_normalized: 488da69c6890bc86f1993b2ccf65cfdfa12b17011dd4d5cd5405c7869005b506
        expected_columns: ["Mom"]
        expected_first_observation: "1927-01"
        column_rename: >
          The file calls the series `Mom`. This experiment calls it UMD
          throughout. The rename is recorded here rather than assumed in code.

  publication_record:
    policy: >
      Every era boundary below is justified from the publication record, not
      chosen as a round number. A boundary is set at the first January that
      strictly follows the journal issue date, so that no month of a
      "post-publication" era can precede the printed result. Predecessor evidence
      is recorded because it means none of these dates is a clean discovery date.
    HML:
      defining_publication: >
        Fama and French (1993), "Common risk factors in the returns on stocks and
        bonds", Journal of Financial Economics 33(1), 3-56, February 1993 issue.
        This is where HML is defined as a factor.
      original_sample_reported_by_authors: "1963-07 to 1991-12"
      publication_year_used: 1993
      first_post_publication_boundary: "1994-01"
      boundary_justification: >
        The first January strictly after the February 1993 issue. 1993-01 to
        1993-12 is dropped rather than assigned to either side, because the
        result was in print for ten of those twelve months.
      predecessor_evidence:
        - >
          Basu (1977), Journal of Finance 32(3), 663-682 - price-earnings sorts.
        - >
          Rosenberg, Reid and Lanstein (1985), Journal of Portfolio Management
          11(3), 9-16 - book-to-market directly, eight years earlier.
        - >
          De Bondt and Thaler (1985), Journal of Finance 40(3), 793-805 -
          long-horizon overreaction, a competing explanation of the same spread.
        - >
          Fama and French (1992), Journal of Finance 47(2), 427-465, June 1992 -
          the cross-sectional result one year before the factor definition.
      alternative_date_tested: >
        1986-01, the first January after Rosenberg, Reid and Lanstein (1985), as
        era hml_post_rosenberg_alternative.
    UMD:
      defining_publication: >
        Jegadeesh and Titman (1993), "Returns to Buying Winners and Selling
        Losers", Journal of Finance 48(1), 65-91, March 1993 issue.
      original_sample_reported_by_authors: "1965-01 to 1989-12"
      publication_year_used: 1993
      first_post_publication_boundary: "1994-01"
      boundary_justification: The first January strictly after the March 1993 issue.
      predecessor_evidence:
        - >
          Carhart (1997), Journal of Finance 52(1), 57-82, March 1997, is not a
          predecessor but a successor; it is when momentum entered the standard
          factor model, which is arguably when it became widely traded.
      alternative_date_tested: >
        1998-01, the first January after Carhart (1997), as era
        umd_post_carhart_alternative.
      construction_caveat: >
        The window 1965-01 to 1989-12 is Jegadeesh and Titman's. The series is
        French's six-portfolio 30/70 UMD, which is a different construction from
        their decile 6-6 strategies. The window is theirs; the data are not.
    RMW:
      defining_publication: >
        Fama and French (2015), "A five-factor asset pricing model", Journal of
        Financial Economics 116(1), 1-22, April 2015 issue, whose sample ends
        2013-12. The working paper circulated from 2013.
      original_sample_reported_by_authors: "1963-07 to 2013-12"
      publication_year_used: 2015
      first_post_publication_boundary: "2014-01"
      boundary_justification: >
        2014-01 is the first month outside the authors' own estimation sample and
        follows the 2013 circulation of the working paper, so it is genuinely
        out-of-sample with respect to the discovery. It PRECEDES the April 2015
        journal issue, which is why the alternative below is also reported.
      predecessor_evidence:
        - >
          Novy-Marx (2013), Journal of Financial Economics 108(1), 1-28, April
          2013 - gross profitability, two years before RMW. Its own first January
          after publication is 2014-01, which coincides with the primary
          boundary; the two candidate discovery dates therefore agree for RMW.
      alternative_date_tested: >
        2016-01, the first January after the April 2015 journal issue, which is
        the era named `recent`.
    CMA:
      defining_publication: >
        Fama and French (2015), as for RMW.
      original_sample_reported_by_authors: "1963-07 to 2013-12"
      publication_year_used: 2015
      first_post_publication_boundary: "2014-01"
      boundary_justification: As for RMW.
      predecessor_evidence:
        - >
          Titman, Wei and Xie (2004), Journal of Financial and Quantitative
          Analysis 39(4), 677-700 - capital investment and the cross-section.
        - >
          Cooper, Gulen and Schill (2008), Journal of Finance 63(4), 1609-1651 -
          asset growth, seven years before CMA. Its first January after
          publication is 2009-01, so CMA's effective discovery date is the most
          disputed of the four and 2014-01 is the most generous of the candidates.
      alternative_date_tested: >
        2016-01, the era named `recent`. The 2009-01 asset-growth date is NOT
        tested as an era, because it would place the "post-publication" window
        inside the authors' own estimation sample, which would confound decay
        with in-sample fit rather than measure it. This is recorded as a known
        limitation rather than papered over.

  primary_grid:
    description: >
      The predeclared multiple-testing family: 4 factors x 5 era roles = 20 cells.
      Alternative-date eras (hml_post_rosenberg_alternative,
      umd_post_carhart_alternative) and hostile-test variants are OUTSIDE this
      family and are never counted as discoveries. Fixing the family before the
      run is what stops the correction from being applied to whichever subset
      survives.
    era_roles: [original_sample, first_post_publication, full_post_publication, recent, common_period]
    cells:
      HML:
        original_sample: hml_original_sample
        first_post_publication: hml_first_post_publication
        full_post_publication: hml_full_post_publication
        recent: recent
        common_period: common_period
      UMD:
        original_sample: umd_original_sample
        first_post_publication: umd_first_post_publication
        full_post_publication: umd_full_post_publication
        recent: recent
        common_period: common_period
      RMW:
        original_sample: rmw_cma_original_sample
        first_post_publication: rmw_cma_first_post_publication
        full_post_publication: rmw_cma_full_post_publication
        recent: recent
        common_period: common_period
      CMA:
        original_sample: rmw_cma_original_sample
        first_post_publication: rmw_cma_first_post_publication
        full_post_publication: rmw_cma_full_post_publication
        recent: recent
        common_period: common_period
    dependence_warning: >
      These 20 tests are strongly dependent. The five eras of a factor nest; RMW
      and CMA share every era; all four factors are long-short spreads built from
      overlapping holdings of the same universe. A Benjamini-Hochberg correction
      that treats them as independent is therefore a LOWER BOUND on the true
      correction, and is reported as such.

  second_moment_uncertainty:
    source: docs/research/fama-french-reproduction.md
    finding: >
      The Phase 1 ingestion gate came back UNRESOLVED, not PASS. All five monthly
      means, all five t-statistics and all ten cross-factor correlations
      reproduce Fama and French (2015) Table 4 within the predeclared tolerance.
      The standard deviations of HML and RMW do not, against two independently
      typeset vintages: variance ratios of 0.940 and 1.104, i.e. this repository's
      HML standard deviation is 3.03% below the printed 2.88 and its RMW standard
      deviation is 5.09% above the printed 2.14.
    consequence: >
      This is a SYSTEMATIC uncertainty in the denominator, not sampling error. It
      does not shrink with more data and it is not in any bootstrap interval. Any
      statistic in this experiment that divides by an HML or RMW volatility - the
      Sharpe ratio above all, and the minimum detectable effect, which is
      proportional to volatility - must carry this band ALONGSIDE its sampling
      interval, reported separately and never combined into one number. Where a
      conclusion would flip inside the band, the output must say so explicitly.
      Means, and therefore the primary metric, are unaffected.
    relative_band_on_volatility:
      HML: 0.0303
      RMW: 0.0509
      CMA: 0.0
      UMD: 0.0
      note: >
        CMA reproduced to 0.53% and the market factor to 0.14%, both inside the
        gate, so no band is carried for them. UMD is from a different file that
        was never gated against a printed table, so its band is unmeasured rather
        than zero, and that is stated in the output instead of a number.
    application_rule: >
      volatility in [sigma * (1 - u), sigma * (1 + u)] and therefore
      Sharpe in [S / (1 + u), S / (1 - u)], applied symmetrically because the
      direction of the error is unknown: the printed vintage is not established
      to be more correct than the current one, only different.

  cost_illustration:
    applied_to_results: false
    purpose: >
      NOT a haircut and NOT a net return. The cost model is reported as a
      SEPARATE column showing the order of magnitude of the implementation gap
      for a tradable strategy of comparable turnover, so that the gross premia
      below cannot be read as achievable. The French series themselves have no
      turnover, no holdings and no tradable form, so no net figure for them
      exists to be computed.
    rule: portfolio_edge.core.costs.TurnoverCostModel
    formula: cost_bp_per_month = k * one_sided_monthly_turnover_percent
    k_optimistic: 1.0
    k_pessimistic: 1.7
    k_source: >
      Novy-Marx and Velikov (2016), value-weighted decile long-short, 1963-2012.
      k runs 1.57-1.71 across their three turnover tiers; 1.0 is the conservative
      floor for patient execution in liquid names.
    one_sided_monthly_turnover_percent:
      HML: {optimistic: 1.2, pessimistic: 7.2, tier: low, basis: annual June rebalance}
      RMW: {optimistic: 1.2, pessimistic: 7.2, tier: low, basis: annual June rebalance}
      CMA: {optimistic: 1.2, pessimistic: 7.2, tier: low, basis: annual June rebalance}
      UMD: {optimistic: 27.5, pessimistic: 91.5, tier: mid-to-high, basis: monthly rebalance on 2-12 month prior return}
    turnover_source: >
      The published tier ranges are low 1.2-7.2%, mid 14-35%, high 90-94% one-sided
      per month. UMD's optimistic figure is the mid-tier implied mean of 27.5% and
      its pessimistic figure the high-tier implied mean of 91.5%, because French's
      six-portfolio 30/70 momentum construction turns over less than a decile
      long-short but is unambiguously in the high-turnover family. These are
      ASSUMPTIONS declared before the run, not measurements: turnover cannot be
      recovered from a return series.
    published_outcome_to_keep_in_view: >
      Novy-Marx and Velikov find a 17% haircut in the low-turnover tier and 144%
      in the high-turnover tier, where four of six strategies had strictly
      negative net returns. The ordering of factors by gross premium is therefore
      not the ordering by net premium, and this experiment cannot establish the
      latter.

  power:
    definition: >
      The minimum detectable effect is the smallest true annualised premium that
      a test of the given size would reject the null for with probability
      power_target, given the era's realised volatility and length:
      MDE_monthly = (z_{1-alpha} + z_{power}) * sigma / sqrt(T), annualised by 12.
    alpha_one_sided: 0.05
    alpha_two_sided: 0.05
    reported_for_every_cell: true
    also_report:
      - realised power to detect the materiality threshold of 2.0 percentage
        points per year in that cell
      - realised power to detect 0.55% per month gross, Harvey, Liu and Zhu's
        (2016) structural estimate of the mean return of a genuinely true factor,
        which is 6.6 percentage points per year
      - the same MDE recomputed from the HAC standard error rather than
        sigma / sqrt(T), because monthly factor returns are autocorrelated and
        the closed form understates the required effect when they are
    purpose: >
      So that a cell failing to exclude zero can be read as "this window cannot
      tell" rather than "there is no premium". This is the single most important
      statistical output of the experiment and it is required for every cell,
      including the cells that do reject.

  annualisation:
    mean: multiply monthly arithmetic mean by 12
    volatility: multiply monthly standard deviation by sqrt(12)
    note: >
      sqrt(12) scaling assumes serial independence, which monthly factor returns
      violate. The HAC standard error is reported precisely because this
      assumption is wrong, and the two must be shown side by side.
  risk_free_treatment: >
    Long-short factor returns are already excess returns by construction. RF is
    NOT subtracted a second time. This is recorded because subtracting it twice
    is a plausible and invisible error.
  missing_data_policy: >
    A month missing from any required series drops that month from every factor
    in the same statistic, and the count of dropped months is reported. Series
    are never forward-filled.

data_sources:
  - id: french_us_ff5_monthly
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_CSV.zip
  - id: french_us_momentum_monthly
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Momentum_Factor_CSV.zip

hostile_tests:
  - Drop the best month in each era and re-report.
  - Drop the best calendar year in each era and re-report.
  - Re-run on the 6 and 24 month bootstrap block lengths without retuning.
  - Re-run UMD on the alternative Carhart 1997 publication date, and HML on the
    alternative Rosenberg, Reid and Lanstein 1985 date.
  - Shift every era boundary by plus and minus 24 months.
  - Recompute with equal-weighted rather than value-weighted source portfolios
    where the library distributes both, since Hou, Xue and Zhang (2020) show the
    choice moves replication rates by more than 20 percentage points.
  - Report the same statistics on a synthetic random walk of matched volatility,
    to show what the procedure produces from noise.

reporting_requirements:
  - Source file URL, SHA-256 and retrieval time for every series used.
  - Number of monthly observations per factor per era.
  - Both uncorrected and FDR-corrected inference.
  - The detectable-premium-at-80%-power figure for every cell.
  - An explicit statement that all figures are gross and not investable.
  - The bootstrap block length used for every cell, both the frozen 12 months and
    the corrected Politis-White automatic length computed from that cell's series.
  - The Phase 1 systematic volatility band for HML and RMW, reported separately
    from the sampling interval on every Sharpe ratio, with an explicit statement
    of any conclusion that changes inside it.
  - The illustrative cost column, in its own column, never subtracted from a
    reported premium.
  - A closed status from the result taxonomy for every factor. The word "works"
    may not appear.

notes: >
  A before-and-after comparison across a publication date is descriptive and
  confounds publication with changing composition, valuation regimes, crowding
  and chance. This specification does not claim to identify a publication effect.
  It asks only whether a premium is still there, how large it might be, and how
  uncertain that answer is.
