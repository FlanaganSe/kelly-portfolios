experiment_family: exp_035_funded_crash_hedges
title: Small fully funded crash hedge portfolios with stock and duration controls
entry_point: exp_035_funded_crash_hedges
run_kind: exploratory
evidence_class: policy-simulation
consumes_final_holdout: false
seed: 2026090535
hypothesis: A fixed five percent TAIL or CAOS allocation can change whole-portfolio log growth and downside
  relative to its actual funding asset and cheap defensive controls.
mechanism: Purchased convexity, collateral duration and variable equity participation act jointly through
  net fund NAV returns. Their portfolio contribution is not standalone option-premium bleed.
falsifier: Signed paired outcomes disclose when a hedge worsens growth or downside on the declared window.
  No result selects an optimal weight or establishes a universal rejection.
universe: Named current ETF share classes in SEC N-PORT Item B.5; current surviving TAIL and CAOS, broad
  equities, cautious funds and BIL/IEF controls.
sample_policy:
  start: 2020-02
  end: 2026-03
  held_out: None; overlapping historical data and surviving funds selected after earlier work.
  embargo: No predictive fitting.
  eras:
  - name: tail_long
    start: 2020-02
    end: 2026-03
    rationale: First available TAIL NPORT month; others covered.
  - name: current_etfs
    start: 2023-04
    end: 2026-03
    rationale: First full CAOS ETF month, excludes predecessor.
  - name: cautious
    start: 2023-10
    end: 2026-03
    rationale: First full RSST month.
benchmark: Per design unchanged capital weights; secondary same funding change into BIL and 90/10 IEF/BIL.
  Duration mix is approximate, not historically matched; CAOS capital weights are not equity beta.
primary_metric: Annualised paired log-growth difference in percentage points per year.
secondary_metrics:
- CAGR and arithmetic return, percentage points per year
- Month-end maximum drawdown including initial wealth, percent
- Relative terminal wealth and annualised tracking error
- Realised rolling twelve-month underperformance fraction and worst wealth ratio
- Initial and annual execution cost and realised turnover
cost_model: 'Filed NAV returns already incorporate internal management and trading costs; no expense ratio,
  turnover haircut or fitted alpha is subtracted again. Investor execution is 5 bp roundtrip baseline
  and 25 bp sensitivity, half on each dollar bought or sold. Initial cash purchase and annual rebalancing
  pay costs. Trades solve q + c sum(abs(q target - drifted_weights)) = 1 exactly; initial q=1/(1+c). Sheltered/no
  investor tax; no terminal liquidation. No bid/ask source is estimated.

  '
rebalance_rule: Initial purchase before first monthly return; reset fixed targets every 12 or 3 months
  relative to window start. Fund managers monetise options internally. No investor crash timing, leverage,
  terminal sale or tax. Rebalancing is scheduled at monthly NAV boundaries, not a verified exchange fill.
inference:
  bootstrap: stationary-block on whole joint fund rows, rerun every execution path
  block_length_policy: Fixed mean block length 6 months, not tuned.
  multiple_testing_correction: None; descriptive exploratory family, no promoted winner.
  confidence_level: 0.95
  resamples: 2000
  notes: Paired joint-row bootstrap reruns drift and costs. Exploratory intervals are not forward probabilities;
    no significance-gated allocation or MDE investment rule.
rejection_rule: Always exploratory. No weight search, selection or promotion.
