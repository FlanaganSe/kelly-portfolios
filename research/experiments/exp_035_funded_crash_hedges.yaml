hostile_tests:
- Five times baseline execution costs.
- Quarterly versus annual scheduled resets.
- Unchanged, bill and approximate duration controls; no beta attribution from capital weights.
- Report missing and partial named episodes as unavailable, never complete crisis results.
- No missing-month fill or window adjustment after outcomes.
reporting_requirements:
- Commit full result.json with source URLs, byte hashes, retrieval timestamps, fund IDs and monthly paths.
- Report paired log outcomes with intervals, wealth, downside and realised underperformance separately
  by window.
- Report episode coverage and only calculate complete episodes from continuing portfolio paths.
- State monthly NAV execution approximation, omitted taxes, predecessor exclusion and approximate duration
  controls.
notes: Frozen after coverage-only acquisition; no returns, rankings or analytical portfolio outcomes inspected.
  NPORT TAIL starts2020-02, CAOS starts2023-01 but its current ETF first full month is2023-04. Longer
  TAIL issuer rounded wealth history exists but is not spliced. This is the longest common NPORT window,
  not inception history.
