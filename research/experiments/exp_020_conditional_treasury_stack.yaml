hostile_tests:
  - Charge the switching cost and the wrapper costs inside the rule and sweep the switching cost 0-25 bp and the Treasury basis 0-50 bp; a sign that does not survive the band is not a result.
  - Score the complement of the bond bull market as a first-class window with its own floor, and report the inside-bull window beside it so that no conditional result is quoted without its complement.
  - Report the bond excess return and the forward realised correlation in on-months and off-months, so that a positive gap can be attributed to carry or to correlation and a null to the signal's failure to predict.
  - Report 1977-81 and 2022 as era gaps and as episodes with the fraction of months the rule was on, because the freeze note predicts one is avoided and the other is not.
  - Report the effective number of trials across the four arms and the deflated Sharpe ratio of the primary arm's paired difference, beside the Benjamini-Hochberg treatment.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Report the regret table for the conditioned stack, the unconditional stack and holding neither on one grid, and name the state of the world each needs.
  - Report the leverage-matched control levered month by month to the arm's own gross notional, not to a constant.

reporting_requirements:
  - The freeze note with every table, including that wrappers are assumed exposure vectors and that the bond leg is a ~20-year bond whose history contains the 1981-2020 bull market.
  - The MDE, the HAC interval and the control named beside every gap, in the same row; never a figure combining two controls.
  - Fraction on, switch count and spell lengths for every conditioned arm, on every reported window.
  - The eight episodes for every arm with the fraction of episode months on.
  - The on-month and off-month bond excess return and forward correlation for every arm.
  - The effective trial count and the deflated Sharpe ratio of the primary arm.
  - The regret table across the declared grid, labelled arithmetic.
  - The trend-book volatility scalar and the sha256 of every source file read.
  - A one-paragraph statement that no pre-2003 TIPS series exists in the panel and none was built.

notes: >
  Exploratory in the strongest sense: the arms were selected after exp_018's
  artifact was read, and the specification records that. This experiment can
  rank constructions on public series and cannot rank funds. Retain
  `unresolved` wherever the instrument cannot separate an arm from its
  control; read the episode, drawdown and regret tables as descriptions of one
  history and as arithmetic on stated inputs, which is what they are. No
  sleeve, fund or portfolio is promoted by this specification.
