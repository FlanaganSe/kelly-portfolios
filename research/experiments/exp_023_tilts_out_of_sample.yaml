    tilts_overlap_french:
      role: basis check, French, same estimand
      window: overlap_with_016e
      basis: french
      scaling: unscaled
      aves: emerging_value
      note: >
        Mapped legs only, so that the difference from `tilts_overlap_vme` is
        the basis and nothing else. The unmapped legs and the regional residual
        are priced separately in the diagnostics.
    tilts_overlap_french_complete:
      role: basis check, French, every leg 016e carries
      window: overlap_with_016e
      basis: french
      scaling: unscaled
      aves: emerging_value
      complete: true
      note: >
        Every factor leg AND the regional market residual, so that this arm's
        arithmetic gap can be set beside 016e's +0.7996 log-growth gap with only
        the estimand between them.
    tilts_full_vme:
      role: full window, VME
      window: full_vme_window
      basis: vme
      scaling: unscaled
      aves: developed_value
    tilts_full_vme_dropped:
      role: full window, VME, AVES dropped
