hostile_tests:
  - Report the i.i.d., HAC and block-bootstrap floors beside every gap, and mark any gap below its i.i.d. floor unresolved rather than positive.
  - Report both halves of the primary window; a sign that flips between them fires clause (d).
  - Remove the best month and, separately, the worst month from the primary window and report the gap again.
  - Perturb every mapped loading by +/-0.15 and report the range; a sign change fires clause (d).
  - Run the bridged loadings beside the unscaled ones on every window, so that the loading translation cannot be chosen after the fact.
  - Run AVES dropped beside AVES approximated on every window that can carry both.
  - Price the unmapped size, profitability and investment legs on the French basis over the overlap window and state the direction of the bias they introduce.
  - Price the regional residual on the French basis over the overlap window.
  - Reproduce 016e's +0.7996 on the French basis to within the variance-drag difference, or report the failure as a defect in this file.
  - Repeat the bootstrap at mean block lengths 6 and 24.
  - Report the implied t of the primary against the Harvey-Liu-Zhu hurdle of 3.
  - Report each leg on its own longest pre-1990-11 window so that the 1972 history the primary window cannot use is not discarded.

reporting_requirements:
  - The freeze note, including that the loadings are French loadings applied to VME factors and that the primary window is 112 months.
  - The three floors beside every gap, in the same row.
  - The window beside every gap; arms on different windows are never in one column.
  - The leg attribution table for the primary arm and the full-window arm.
  - The sha256 of every source file and the observed first and last observation of every VME column read.
  - A statement that nothing was read from the VME asset-allocation legs.

notes: >
  The out-of-sample window is short and the loadings on it are borrowed from
  another basis. That is the state of the evidence, not a defect of the design:
  no longer pre-1990 series for developed value exists in this repository, and
  fitting anything on the out-of-sample window would spend it. The most likely
  outcome is a positive point estimate inside its own floor, which would be
  weak evidence for the sign and no evidence about the size; a negative point
  estimate would be the finding that changes the tilt weights, and it is the
  outcome this file is built to be able to see.
