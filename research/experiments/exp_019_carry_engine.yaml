hostile_tests:
  - Charge financing to every levered control on the same terms as the arms.
  - Sweep the equity-futures basis 62-231 bp and report whether the ordering against the reference arm survives.
  - Charge 1 and 2 pp/yr on every unit of carry notional and report every carry arm's gap again.
  - Deliver the carry leg at 0.681 of a unit with the fee unchanged and report every carry arm's gap again.
  - Move the carry series one month and report whether the paired gaps survive losing same-month alignment.
  - Report the carry-trend, carry-equity and trend-equity correlations on the full sample and on the worst decile of equity months, on every panel, and by era.
  - Report every crisis episode of both types, including the five deflationary episodes in which carry is expected to hurt.
  - Report the post-2009 and post-publication eras so that no full-window result is quoted without the era the paper could not have fitted.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Report the sum-rule residual so that "adds as a sum" is checked rather than assumed.
  - Report the ex-ante volatility-matched control beside the ex-post one.

reporting_requirements:
  - The freeze note with every table, including that wrappers are assumed exposure vectors and the carry leg is a gross vendor reconstruction.
  - The MDE and the control named beside every gap, in the same row; never a figure combining two controls.
  - Gross, equity, trend, carry and cash notional beside every arm.
  - Both volatility scalars and the sha256 of every source file read.
  - The correlation tables, full sample and worst decile, and the per-asset-class carry component table, labelled descriptive.
  - Maximum drawdown, months under water, worst-decile offset, both episode-type means, the flat-decade gap and the terminal-wealth ratio for every arm, labelled descriptive.
  - The sum-rule residual on every scored panel.
  - A statement that the composite holds three asset classes before 1974-02.

notes: >
  Exploratory in the strongest sense: the arms were selected after every earlier
  result was read, and the specification records that. This experiment can rank
  constructions on public series and cannot rank funds. The carry leg is the
  vendor's gross reconstruction and the haircut panels are the only cost
  evidence. Retain `unresolved` wherever the instrument cannot separate an arm
  from its control, and read the correlation, drawdown and crisis tables as
  descriptions of one history. No sleeve, fund or portfolio is promoted by this
  specification.
