hostile_tests:
  - Assert Experiment 002's two screening regexes byte-for-byte, and Experiment 009's specification, universe and product facts by sha256, before anything is fetched.
  - Reproduce Experiment 009's frozen basis to ZERO difference in every shortfall, every tracking difference, every fitted weight and every status, and abandon the run if it does not.
  - Assert the frozen first month of filed coverage for every declared basis constituent against the filings actually retrieved, so coverage is part of the design rather than a discovery.
  - Run three placebo bases, each matched on column count to one expressive basis, with NO new region-by-style cell, and report how many verdicts each moves BESIDE its partner rather than after it. If the placebos move as many as their partners, say so as the headline: clause (c) would then tell us nothing about the ex-US shelf.
  - Report per fund per basis how many columns the basis actually contained for that fund, and name every fund whose basis was reduced by the coverage rule.
  - Recompute GWX's and RODM's clause (c) on windows trimmed to 2019-08 so the whole basis is available, labelled a second-variable diagnostic and never a verdict.
  - Report the number of non-zero fitted weights per basis, so a corner solution is not read as the basis being used.
  - Record which funds are degenerate under each basis, since a fund excluded from its own basis is measuring a style return rather than an implementation cost.
  - Report the fee-premium term separately from the tracking-difference term, so a mechanical few-basis-point shift from a dearer basis is not read as a fund result.
  - Report MDE at 80% power beside every alpha, unchanged from Experiment 009, and state again that alpha is not a promotion criterion and that the median ex-US MDE is 3.23 pp/yr.
  - Name the regional panel beside every loading, since grading these funds on the US panel would move 16 of 25 across the bar.
  - State whether any emerging product can reach `exploratory` under any basis, and whether that is decidable by a basis at all.

reporting_requirements:
  - Whether the frozen basis reproduced Experiment 009 exactly, stated before any other number.
  - The decomposition table for every fund whose clause (c) fired, shortfall under every basis and the difference from the frozen basis.
  - The same aggregate for all 25 audited funds.
  - How many of the 25 statuses change under each basis, named individually.
  - The placebo movements beside their column-count-matched expressive partners, never after them.
  - Whether GWX survives, with the coverage diagnostic beside the basis result.
  - Whether any emerging product reaches `exploratory`, and which clause decides it.
  - Whether the twelve products that already reached `exploratory` survive the harder bases.
  - An explicit statement of which direction a richer basis cuts.
  - The panel every loading was estimated on.

notes: >
  Nothing here may be promoted. Decision record 0002 caps all fund-level work at
  `exploratory` until a source with a documented total-return and corporate-action
  contract is licensed, and no change of comparator affects that. This experiment
  cannot make a product better or worse; it can only say how much of a published
  number was a property of the thing it was compared against.
