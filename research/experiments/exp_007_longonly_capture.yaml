hostile_tests:
  - Reconstruct HML from the six portfolios and report the residual against the
    published column. A failure here voids the whole experiment and is clause
    (0) of the rejection rule, not a tolerance to widen.
  - Reconstruct SMB from the same six and check it against the THREE-factor
    file, and separately against the FIVE-factor file, and report that the
    latter does not reconcile and why. A reader who assumed one SMB would draw
    a false conclusion.
  - Reconstruct the momentum spread from the prior-return sorts and report that
    residual too, so that the value result is not the only one whose arithmetic
    was checked.
  - Check that the long-leg capture and the short-leg share sum to one against
    the size-neutral benchmark. They must, by construction; if they do not, the
    benchmark is not what this specification says it is.
  - Compute the capture fraction under all five predeclared definitions and
    report the spread. The spread is the falsifier's clause (1) and must be
    reported even when it is small.
  - Recompute the 5x5 corner with the smallest size quintile dropped entirely.
  - Report the firm-count and capitalisation shares of the cells the corner
    lives in, and state whether it is implementable at retail.
  - Run the identical procedure on developed-ex-US and emerging files, which
    share no security with the US file.
  - Run the identical procedure on the momentum sorts, whose reconstitution is
    monthly rather than annual.
  - Run the identical ratio machinery on a zero-mean Gaussian pair with the
    matched covariance of the real numerator and denominator, to show what this
    machinery produces from noise and how unstable the ratio becomes when the
    denominator has no signal.
  - Re-run on the 6 and 24 month bootstrap block lengths without retuning, and
    report the corrected Politis-White automatic length.
  - Report the capture fraction in the `recent` era, where Experiment 001
    measured US HML at -0.44 pp/yr, so that a reader can see directly what a
    near-zero denominator does to a ratio.

reporting_requirements:
  - Source file URL, SHA-256 and retrieval time for every file.
  - The HML, SMB and momentum reconstruction residuals, in decimal per month,
    against the printed precision of the source files.
  - THE CAPTURE FRACTION, with its interval, under every definition computed,
    in the conclusion and not in a footnote. It is the deliverable of this
    experiment and burying it is a reporting failure.
  - The definitional spread, and an explicit statement of whether clause (1)
    fired.
  - The capture fraction over the primary full sample and over the full
    post-publication era separately, never averaged.
  - The count of bootstrap resamples in which the denominator was near zero or
    changed sign, for every ratio, and the UNSTABLE mark where it exceeded 1%.
  - The small-value corner's premium over the market, annualised volatility,
    maximum drawdown, time under water, and its HAC loadings on Mkt-RF, SMB and
    HML with standard errors.
  - The firm-count and capitalisation shares of the 5x5 cells, and a plain
    statement of whether the corner is implementable at retail.
  - Whether the small-value result depends on the smallest size quintile,
    answered by the recomputation that drops it.
  - The regional ex-US and emerging figures, with an explicit statement that
    the Developed file was not used because it includes the United States.
  - The cost column, separately from the gross column, with each component
    marked measured or assumed.
  - What this implies for `premium x delivered loading - cost`, with the
    capture fraction inserted as the middle term and the arithmetic shown.
  - An explicit statement that these portfolios are research portfolios and not
    products, and that every figure is gross.
  - A closed status from the result taxonomy, and for `unresolved` an explicit
    statement of exactly what would fire.

notes: >
  The question this experiment answers has been open in this repository since
  the edge decomposition first budgeted a factor line. That budget multiplies a
  gross long-short premium by an ASSUMED 0.40 long-only capture, and the
  framework page records four separate times that no source read there
  establishes the number. It is computable from data this repository already
  had: French publishes the long-only portfolios the factor is a difference of,
  and the 25-portfolio file has been parsed and fixtured here since Phase 1.
  What was missing was not data but the observation that the long leg of a
  published spread is itself a published series.
  The honest expectation, stated before the run, is that the answer will be a
  range rather than a number, and that the range will be wide enough that the
  question "what is the capture fraction" turns out to be less well posed than
  the question "capture of what, against what". If so, the finding is about the
  edge budget's use of a scalar, and it is a finding that makes the budget
  harder to defend rather than easier.
