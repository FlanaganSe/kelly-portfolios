      Every file is pinned by the sha256 of its raw bytes AND by the sha256 of
      the derived table, and a mismatch ABORTS rather than producing a graded
      result. Ken French rebuilds the entire history from the current source
      vintage on every rebuild, so a changed hash is a new vintage, not a
      corrupt download.
