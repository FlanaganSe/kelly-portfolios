  power:
    definition: >
      MDE_80 = 12 * (z_0.95 + z_0.80) * standard_error_of_the_monthly_mean,
      identical to exp_001 and exp_005, so the figures are directly comparable
      to their grids. Reported from the conventional standard error and from
      the HAC standard error, side by side.
    alpha_one_sided: 0.05
    reported_for_every_spread: true
    note: >
      Power is reported for the SPREADS, in percentage points per year. It is
      not reported for the capture fractions, because the null there is 0.40
      rather than zero and a minimum detectable effect against a non-zero null
      of a ratio with a shared denominator would be a misleading statistic. The
      interval is the honest summary for the ratios and it is what the
      falsifier reads.

