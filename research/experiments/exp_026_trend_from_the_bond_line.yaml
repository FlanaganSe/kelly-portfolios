hostile_tests:
  - Reproduce 025's `ladder40` on both panels to 0.005 pp/yr of mean and log growth and 0.05 pp of worst fall, and 016f's rec30-against-rec25 log gap to 0.005 pp/yr, before scoring any candidate arm; a pair that moves is a defect in this file.
  - Charge financing to every levered control on the same terms as the arms, and scale sub-unity controls with bills rather than leaving the remainder idle.
  - Sweep the equity-futures basis 62-231 bp on every arm, the Treasury basis 0-50 bp on the RSBT-like arms and the gold basis 0-60 bp on the GDE-like arms, and report whether each arm's sign against `cautious` survives.
  - Report every primary comparison on every declared sub-window with its own HAC interval and floor, so a full-window sign cannot be quoted without the windows that made it; post_2009 and after_bond_bull in particular.
  - Print the drawdown table on the full panel AND on from_1934, from_1946, from_1968_05 and from_1990_11 for every arm beside `cautious`, with the difference, so a shallower fall cannot be claimed on the window that flatters it.
  - Report all nine episodes for every arm with `cautious`'s return beside the arm's, and read 1977-81 and 2022 Jan-Sep mechanically for freeze note 6 (a3).
  - Report the ten-year leg's, the trend book's and (where present) gold's excess return and correlation to equity in every era beside the gaps.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Price every arm at forward premia on one grid, with the delivered-loading row for the trend-fund arms and the 0.0 gold central, and print the break-even premium; a forward substitution applied to one leg and not the other is a thumb.
  - Apply freeze note 6 mechanically and print which clause each arm reached, so the decision reading cannot be re-argued from the tables.

reporting_requirements:
  - The freeze note with every table, including that the bond line is a nominal ten-year proxy for TIPS and that the wrappers are assumed exposure vectors.
  - The MDE and the control named beside every gap, in the same row; never a figure combining two controls.
  - The HAC interval and the block-bootstrap interval beside every full-window gap.
  - Gross, equity, trend, bond, gold and cash notional beside every arm.
  - The drawdown table per panel and per declared era with months under water and the difference against `cautious`, labelled descriptive.
  - Worst-decile offsets, both episode-type means, all nine episodes, the flat-decade gap and the contribution-weighted terminal-wealth ratio for every arm, labelled descriptive.
  - The three regret tables with their variance-drag constants and break-even premia.
  - The freeze-note-6 reading per arm with the sub-clause that decided it.
  - The trend-book volatility scalar beside 018's, the 016f specification hash read, the 025 reproduction figures, and the sha256 of every source file read.

notes: >
  Exploratory in the strongest sense: the arms were chosen after 018, 024, 025
  and the candidates note were read, and the specification records that. It
  can rank constructions on public series and cannot rank funds. Retain
  `unresolved` wherever the instrument cannot separate an arm from its
  control, read the drawdown and crisis tables as descriptions of one history,
  and read a `rejected` against the cheap control as the price of a drawdown
  constraint and not as a verdict on the reader who holds it. No sleeve, fund
  or portfolio is promoted by this specification; a draft decision 0015 it
  licenses is PROPOSED and the site owner decides.
  RUNNER: no module exists yet. Write
  `src/portfolio_edge/experiments/exp_026_trend_from_the_bond_line.py` by
  importing from exp_025 `read_pairs`-style readers, `drawdown_by_era`,
  `leverage_matched_targets`, `load_tournament_inputs`-style loading with the
  gold leg and three mappings added, from exp_024 `load_series`, `build_legs`,
  `read_arms`, `_compare`, `_describe`, `_apply_falsifier` and the table
  helpers, from exp_018 the LBMA gold leg, `simulate_arm`, `read_rates`,
  `read_episodes` and `_era_windows`; add the gold panel, the three financing
  bands, the three regret closed forms, the 025 reproduction check and the
  freeze-note-6 reading; register ENTRY_POINT
  `exp_026_trend_from_the_bond_line`, and run
  `uv run python -m portfolio_edge.experiments.exp_026_trend_from_the_bond_line --view-results`
  from `research/`.
