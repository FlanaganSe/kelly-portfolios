      note: 0.5108 equity, 0.150 trend, 0.490 bond, 0.090 gold, 1.2408 gross. Equity notional unchanged; the wrapper's 0.1 collateral comes off the bond line.
    gde20:
      role: candidate; A3, 20 points; gold panels only
      weights: {CORE: 0.17, GDE_LIKE: 0.20, RSST_LIKE: 0.15, TSY10: 0.48}
      note: 0.5108 equity, 0.150 trend, 0.480 bond, 0.180 gold, 1.3208 gross.
    gde30:
      role: candidate; A3, 30 points; gold panels only
      weights: {CORE: 0.08, GDE_LIKE: 0.30, RSST_LIKE: 0.15, TSY10: 0.47}
      note: 0.5108 equity, 0.150 trend, 0.470 bond, 0.270 gold, 1.4008 gross.

  arm_families:
    rsbt: [rsbt10, rsbt20, rsbt30]
    trendfund: [trendfund10, trendfund20, trendfund30]
    gde: [gde10, gde20, gde30]

  reference_arm: cautious
  controls: [reference, cheap, cheap60_40, leverage_matched]
  controls_in_estimates: [reference, cheap, cheap60_40, leverage_matched]
  cheap60_40_weights: {CORE: 0.60, TSY10: 0.40}
  contribution_per_month_of_starting_balance: 0.01
  tail_quantile: 0.10
  multiple_testing_q: 0.10
  bootstrap_block_months: 12
  hac_lags: automatic

  panels:
    primary:
      legs: [equity, treasury, tsy10, trend]
      start: null
      arms: [cautious, rsbt10, rsbt20, rsbt30, trendfund10, trendfund20, trendfund30]
      note: 1929-01..2025-05 expected, 1157 months; the trend arms' scored panel.
    primary_gold:
      legs: [equity, treasury, tsy10, trend, gold]
      start: "1968-05"
      arms: [cautious, rsbt10, rsbt20, rsbt30, trendfund10, trendfund20, trendfund30, gde10, gde20, gde30]
      note: 1968-05..2025-05 expected, 685 months; the gold arms' scored panel, with every trend arm re-run so all nine can be read on one window.

  drawdown_reporting:
    eras_for_drawdown_table: [full, from_1934, from_1946, from_1968_05, from_1990_11]
    deeper_than_reference_tolerance_pp: 2.0
    rule: >
      For each panel and era, print every arm's worst fall and months under
      water in one table beside `cautious`'s, and the difference arm minus
      reference. Freeze note 6 (a2) reads the full window, from_1934 and the
      tournament full window; it carries no status.

  crisis_episodes:
    deflationary_or_growth:
      - {name: crash_1929, start: "1929-09", end: "1932-06"}
      - {name: recession_1937, start: "1937-03", end: "1938-03"}
      - {name: dotcom_2000, start: "2000-09", end: "2002-09"}
      - {name: gfc_2008, start: "2007-11", end: "2009-02"}
      - {name: covid_2020, start: "2020-02", end: "2020-03"}
    inflation_or_rate:
      - {name: oil_1973, start: "1973-01", end: "1974-09"}
      - {name: inflation_1977, start: "1977-01", end: "1981-09"}
      - {name: rate_shock_2022, start: "2022-01", end: "2022-09"}
      - {name: calendar_2022, start: "2022-01", end: "2022-12"}
    decision_episodes: [inflation_1977, rate_shock_2022]
    note: >
      018's eight episodes, frozen there and copied unchanged, plus calendar
      2022 so the rate shock can be read both to the trough and to the year
      end. Freeze note 6 (a3) reads `decision_episodes` on the primary panel.

  financing_sensitivity:
    equity_basis_points: [62, 98, 130, 165, 200, 231]
    treasury_basis_points: [0, 15, 30, 50]
    gold_basis_points: [0, 15, 30, 45, 60]
    reporting: >
      Every arm's gap against `cautious` and against the cheap control at
      every point of every band that touches one of its legs, and whether the
      sign against `cautious` survives; clause (d) reads the union of the
      bands.

  tournament_panel:
    specification_path: experiments/exp_016f_matched_pairs.yaml
    expected_specification_hash: 68323191bca66ea857826bf29869a00fbed16028af2b104878b84c40c4497888
    abort_on_hash_change: true
    what: >
      016f's panel, basis mapping and cost model, loaded from its frozen file
      and checked against the hash its run `36f14b39...` recorded, with the
      ten-year leg added as 024 and 025 added it (`TSY10` mapped 1.000 to the
      Shiller/FRED GS10 par bond less French `RF` at 5 bp), the LBMA gold leg
      added as `gold` (spot excess of the panel's cash), and three wrappers
      mapped: `RSBT_LIKE` = 1.000 treasury + 1.000 trend at 112 bp,
      `TREND_FUND` = 1.000 trend at 85 bp, `GDE_LIKE` = 0.900 us_mkt + 0.900
      gold at 47 bp. Annual rebalancing, 016f's clock. The tilt book is 016f's
      `rec30` equity lines (VTI 19 / VTV 15 / VXUS 16 / AVDV 10 / IDMO 5 / AVES
      5) scaled whole to each arm's unlevered equity capital, so the tilt
      complex keeps its proportions; the GDE-like arms therefore shift the
      equity mix toward US large-cap as gold grows, which is what the fund does.
    gold_coverage: >
      The LBMA leg must cover every tournament month; a panel cut by the gold
      leg aborts, because a shortened panel would move the reproduction pair.
    reproduction:
      pair: rec30 against rec25, log-growth gap
      expected_pp_yr: 0.5101
      tolerance_pp_yr: 0.005
      note: 016f run `36f14b39...`, reproduced by 024 and 025; a shared pair that moves is a defect in this file.
      published_weights: {RSST: 0.30, VTI: 0.19, VTV: 0.15, VXUS: 0.16, AVDV: 0.10, IDMO: 0.05, AVES: 0.05}
      rec25_weights: {RSST: 0.25, VTI: 0.24, VTV: 0.15, VXUS: 0.16, AVDV: 0.10, IDMO: 0.05, AVES: 0.05}
    arms:
      cautious:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.50}
        note: The published fund weights exactly. 0.35 of tilt book plus 0.15 x 1.072 of wrapper equity = 0.5108 equity; 0.150 trend; 0.500 bond.
      rsbt10:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.40, RSBT_LIKE: 0.10}
        note: 0.5108 equity, 0.250 trend, 0.500 bond.
      rsbt20:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.30, RSBT_LIKE: 0.20}
        note: 0.5108 equity, 0.350 trend, 0.500 bond.
      rsbt30:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.20, RSBT_LIKE: 0.30}
        note: 0.5108 equity, 0.450 trend, 0.500 bond.
      trendfund10:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.40, TREND_FUND: 0.10}
        note: 0.5108 equity, 0.250 trend, 0.400 bond.
      trendfund20:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.30, TREND_FUND: 0.20}
        note: 0.5108 equity, 0.350 trend, 0.300 bond.
      trendfund30:
        weights: {RSST: 0.15, VTI: 0.095, VTV: 0.075, VXUS: 0.08, AVDV: 0.05, IDMO: 0.025, AVES: 0.025, TSY10: 0.20, TREND_FUND: 0.30}
        note: 0.5108 equity, 0.450 trend, 0.200 bond.
      gde10:
        weights: {RSST: 0.15, VTI: 0.07, VTV: 0.056, VXUS: 0.059, AVDV: 0.037, IDMO: 0.019, AVES: 0.019, TSY10: 0.49, GDE_LIKE: 0.10}
        note: Tilt book scaled to 0.26 plus 0.09 of wrapper equity plus 0.1608 = 0.5108 equity; 0.150 trend; 0.490 bond; 0.090 gold.
      gde20:
        weights: {RSST: 0.15, VTI: 0.047, VTV: 0.036, VXUS: 0.039, AVDV: 0.024, IDMO: 0.012, AVES: 0.012, TSY10: 0.48, GDE_LIKE: 0.20}
        note: Tilt book scaled to 0.17; 0.5108 equity; 0.480 bond; 0.180 gold.
      gde30:
        weights: {RSST: 0.15, VTI: 0.022, VTV: 0.017, VXUS: 0.018, AVDV: 0.011, IDMO: 0.006, AVES: 0.006, TSY10: 0.47, GDE_LIKE: 0.30}
        note: Tilt book scaled to 0.08; 0.5108 equity; 0.470 bond; 0.270 gold.
    reference_arm: cautious
    controls:
      cheap: {VTI: 0.65, VXUS: 0.35}
      cheap60_40: {VTI: 0.39, VXUS: 0.21, TSY10: 0.40}
      leverage_matched: the cheap control levered to each arm's gross notional at 016f's 62 bp basis, or scaled below one with bills
    eras: [flat_equity_decade, post_2009]
    weights_note: >
      Tournament weights are rounded to three places and must sum to one;
      rounding moves equity notional by under 0.004 and the artifact prints
      each arm's exact notional.

  reproduction_of_exp_025:
    what: >
      025's `ladder40` (CORE 0.348 / RSST_LIKE 0.149 / TSY10 0.503; tournament
      RSST 0.149 / VTI 0.096 / VTV 0.075 / VXUS 0.080 / AVDV 0.050 / IDMO 0.025
      / AVES 0.025 / TSY10 0.500) simulated on both panels before any
      candidate arm is scored, against the figures run `00c0b8b0...` recorded.
    primary_weights: {CORE: 0.348, RSST_LIKE: 0.149, TSY10: 0.503}
    primary_expected:
      arithmetic_mean_pp_yr: 8.8377
      growth_log_pp_yr: 8.3061
      max_drawdown_pct: -53.77
    tournament_weights: {RSST: 0.149, VTI: 0.096, VTV: 0.075, VXUS: 0.080, AVDV: 0.050, IDMO: 0.025, AVES: 0.025, TSY10: 0.500}
    tournament_expected:
      growth_log_pp_yr: 9.9168
      max_drawdown_pct: -18.08
    tolerance_pp_yr: 0.005
    tolerance_drawdown_pp: 0.05

  regret:
    what: >
      Each candidate's expected gap against `cautious` at forward premia,
      arithmetic on the capital-weight difference and no simulation. A1:
      `X x (t - 0.97 - f_T + 0.05)`, t the gross trend premium per unit of
      notional at 12.38% volatility, f_T the Treasury financing in pp. A2:
      `X x (lambda t - 0.85 + 0.05 - b)`, lambda the delivered trend loading
      (1.0 and 0.671), b the ten-year's excess over cash. A3: `X x (0.9 g -
      0.20 - 0.9 f_G + 0.9 x 0.03 + 0.1 x 0.05 - 0.1 b)`, g the gold excess
      over cash, f_G the gold financing. The log cell adds one constant per
      arm, half the difference of the arm's and the reference's realised
      variances on the arm's scored primary panel. A positive cell means the
      candidate wins. The break-even engine premium is printed beside each
