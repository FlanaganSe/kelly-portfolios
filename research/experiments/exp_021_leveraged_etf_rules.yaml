    construction: ltr less French monthly RF as the HFEA bond leg

hostile_tests:
  - Charge the fee, the spread and the trading cost inside every arm and inside the 1.3x control on the same terms; not charging the control is the error this test exists to catch.
  - Score every timed arm against a control at its own average exposure, so that beta it declined to carry is not credited as timing.
  - Re-run every scored gap at the 80 bp stress spread and mark any sign change unresolved.
  - Re-run every scored gap at lag 0 and on the price-proxy index, and report both beside the base case, so the alignment and the dividend bias can each be read.
  - Report the deflated Sharpe ratio on the ACTIVE return over the declared 28-rule grid, never on the rule's own Sharpe.
  - Report the after-tax path at two brackets and two disposals on the realised modern history.
  - Report every crisis episode including 1987-10 and 2020-03, which a monthly rule cannot resolve, with peak-to-trough inside the window.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Reconcile the daily 1x rule against the earlier monthly study's beta-matched gap and floor, and say whether daily resolution changed the reading.

reporting_requirements:
  - The freeze note with every table, including that funds are modelled exposures and that the signal index is the total-return index.
  - The floor and the control named beside every gap, in the same row; never a figure combining two controls or two windows.
  - CAGR, arithmetic mean, volatility, maximum drawdown, longest time under water, time in market and round trips a year for every arm on both windows, labelled descriptive.
  - Every crisis episode for every arm.
  - The deflation table with the effective trial count and the counts it was also read at.
  - The after-tax table with the tax cost of each rule stated as a difference of shortfalls.
  - The sha256 of every source file read and the spread, fee, cost and lag actually used.

notes: >
  Exploratory in the strongest sense: the constructions are the published
  retail rules, the daily file is new to the repository and the earlier
  monthly study was read before this file was written. This experiment can
  rank constructions on public series and cannot rank funds. Retain
  `unresolved` wherever the instrument cannot separate an arm from its
  control, and read the drawdown, whipsaw, episode and after-tax tables as
  descriptions of one history, which is what they are. No sleeve, fund, rule
  or portfolio is promoted by this specification.
