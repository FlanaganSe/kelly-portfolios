      their entire history in place on every update, so an unrecognised hash is a
      new vintage rather than a corrupt download, and a marginal figure computed
      from an unrecognised file looks exactly like a good one. FRED appends rather
      than rewrites, so its hashes are recorded and reported without aborting.
