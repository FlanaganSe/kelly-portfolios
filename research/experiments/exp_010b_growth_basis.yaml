hostile_tests:
  - >
    Report the calibration control on BOTH bases. Cash added to an equity core
    and funded from US equity MUST show a materially negative marginal GROWTH
    rate; if it does not, the machinery is wrong and no other figure may be read.
    Report its certainty equivalent beside that, and report the difference, which
    is the de-risking reward this metric change removes and the number that
    calibrated the change.
  - >
    Re-select the constrained optimal weight INSIDE every bootstrap replicate, and
    report that interval beside the naive one computed at the in-sample optimum.
    The gap between them is the selection effect, made visible.
  - Halve the weight cap from 0.20 to 0.10 and re-report every optimum.
  - Double every cost and fee assumption and re-report every marginal figure.
  - >
    Delay the sleeve by one month, which is the smallest delay a monthly series
    can express, and re-report every marginal figure.
  - >
    Remove the sleeve's single best calendar year and re-report, since a marginal
    figure driven by one year is a description of that year.
  - Split the sample into the two frozen halves and report both.
  - >
    Report all three funding legs for every sleeve and flag every sleeve whose
    marginal figure changes sign between them.
  - >
    Report the credit at both ends of the correlation's bootstrap interval, and
    the derivative of the credit per 0.10 of correlation.
  - >
    Re-run the whole family against the second base portfolio, the 60/40, and
    check that the pro-rata credit falls roughly in proportion to sigma_p^2 as the
    identity requires. A credit that does not scale that way indicates an error in
    the decomposition rather than a discovery.
  - >
    Perturb the frozen base weights to equal-weight across the three regions and
    report how far sigma_p and every credit move, to check the claim in
    parameters.base_weights.rationale that the split is not load-bearing.

reporting_requirements:
  - The evaluation disclosure above, printed with every table.
  - >
    The alpha term and the credit term separately for every sleeve, never their
    sum alone, since the entire purpose of this experiment is to show which of the
    two carries the result.
  - The funding leg named beside every marginal figure.
  - >
    The minimum detectable effect beside every marginal figure, and the figure
    expressed as a multiple of it.
  - The Holm-adjusted p-value and the declared family size beside every sleeve.
  - >
    The constrained optimal weight, the growth gain at it, and all three flatness
    statistics together. A weight reported without its flatness is incomplete.
  - >
    The word PROXY, and what the series is a proxy for, on every figure derived
    from the modelled long-duration sleeve.
  - >
    An explicit statement that gold was not tested and why, in the result itself
    and not only in this specification.
  - >
    The predeclared prediction and its scorecard, including any sleeve that
    contradicted it.
  - >
    A statement of how many sleeves were tested, because that number feeds the
    trial count of every later experiment in this repository. These sleeves are
    exp_010's sleeves and are counted ONCE across the two specifications, not
    twice.
  - >
    The deciding basis, named on every figure, together with the CRRA gamma = 3
    certainty equivalent and the de-risking component that separates the two. A
    figure published without its companion is not reportable.
  - >
    For every sleeve whose verdict differs from exp_010's, the pair of numbers
    that produced the difference. A metric change that silently moves a verdict is
    the failure this specification exists to make impossible.

notes: >
  Retain `unresolved` rather than `rejected` whenever the sample cannot answer the
  question, and `rejected` rather than `unresolved` whenever the frozen falsifier
  fires on a quantity the sample CAN measure. A negative diversification credit is
  a measurable fact about a sleeve's beta, not a power failure, so clause (b)
  rejects rather than leaving the matter open. That asymmetry is deliberate: the
  portfolio-level view was proposed as a possible rescue of sleeves the standalone
  chain dismissed, and if it instead makes them worse, that is a finding this
  repository should be able to state plainly.

  On reading this beside exp_010: the two are not independent evidence and must
  never be counted as two results. Where they agree, that is one result stated
  twice. Where they disagree, the disagreement is the finding, and its size is a
  measurement of how much of exp_010's certainty-equivalent figure was de-risking
  rather than value. exp_004 is the calibration in the other direction: its
  comparator is RISK-MATCHED, so the de-risking component is already removed from
  both sides before the difference is taken, and its two bases agree closely. A
  certainty equivalent measured against a risk-matched comparator and one measured
  against a portfolio the sleeve de-risks are not the same statistic, whatever they
  are both called.
