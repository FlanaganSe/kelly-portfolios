# Frozen before any result of THIS specification is examined, and honest about the
# fact that the DATA it reads has already been examined once.
#
# WHAT THIS IS. Experiment 010 re-judged on a different deciding metric. Not a new
# search: the same eleven monthly inputs, the same pinned vintages, the same base
# portfolios, the same twelve sleeves, the same costs, the same window, the same
# seed. Exactly one thing differs -- WHICH METRIC DECIDES -- and that change was
# made after exp_010's numbers were read. Recording that plainly is the point of
# this header. See parameters.rejudgement for what follows from it, and decision
# record 0008 for why the change was made.
#
# WHY IT IS A NEW SPECIFICATION AND NOT A RE-RUN. exp_010's falsifier reads, in
# its own frozen words, "its marginal certainty-equivalent gain ... is below the
# materiality threshold", and its primary metric names gamma = 3. Deciding it on
# the geometric growth rate is not an implementation of that text; it is a
# different text. Editing the committed file would destroy the one property that
# makes it evidence -- that it was written down before the result. exp_010 keeps
# its own hash, its own runs and its own recorded status, and this file supersedes
# it on the question of what the repository should believe.
#
# THIS IS A PUBLIC-SERIES EVALUATION, NOT AN INVESTABLE BACKTEST. Ken French's
# research portfolios and factor series are paper portfolios; AQR's trend series
# is a vendor series; the long-duration Treasury sleeve is a MODELLED PROXY. See
# evidence_class and parameters.evaluation_disclosure.
#
# WHY THIS EXPERIMENT EXISTS. Every sleeve this repository has judged except
# trend was judged by a STANDALONE chain -- premium x loading x capture - cost --
# which asks "does this asset beat the market on its own?" and sets the
# covariance term to zero by construction. The portfolio question is different:
# does adding weight w to an EXISTING portfolio raise its growth rate? To first
# order, funding weight w in sleeve i out of funding leg f inside portfolio p,
#
#     dg/dw|_{w=0} = (mu_i - mu_f) - (sigma_ip - sigma_fp)
#
# The first term is the standalone alpha the existing chain already measures. The
# second is a DIVERSIFICATION CREDIT the standalone chain omits. With f = p it
# collapses to the form this repository already uses for volatility harvesting,
# (mu_i - mu_p) + sigma_p^2 (1 - beta_ip). The credit can be POSITIVE or
# NEGATIVE: beta_ip > 1 makes it negative, which would make the portfolio view
# HARSHER than the standalone view rather than kinder. Which way it goes is the
# question, and it is not assumed here.
experiment_family: exp_010b_growth_basis
title: Experiment 010 re-judged on the geometric-growth basis, with the certainty equivalent reported beside it and deciding nothing
entry_point: exp_010_marginal_sleeve_value
run_kind: exploratory
evidence_class: public-series-evaluation
consumes_final_holdout: false
seed: 20260909

hypothesis: >
  For at least one candidate sleeve, adding a small long-only weight to a
  realistic base portfolio raises the portfolio's GEOMETRIC GROWTH RATE by a
  materially positive amount NET of costs, and the improvement survives a
  family-wise correction across every sleeve tested. The claim under test is
  MARGINAL portfolio value at a constrained optimal weight, never standalone
  significance and never the derivative at zero weight, which favours any
  low-beta asset by construction and overstates the case. This differs from
  exp_010's hypothesis in one word: growth rather than certainty equivalent. The
  certainty equivalent is still computed and still reported beside every figure;
  it is no longer permitted to decide one.

mechanism: >
  The proposed mechanism is the excess-growth identity. A portfolio's geometric
  growth rate is not the weighted average of its constituents' growth rates; the
  gap is 0.5 * (sum_i w_i sigma_i^2 - sigma_p^2), which is strictly positive
  whenever the constituents are less than perfectly correlated. An asset whose
  standalone arithmetic mean is BELOW the portfolio's can therefore still raise
  the portfolio's growth rate, provided its covariance with the portfolio is low
  enough. The mechanism is real algebra, not an empirical claim; what is
  empirical, and what this experiment measures, is whether the credit is large
  enough at REALISTIC correlations to change any verdict this repository has
  already reached. The prior recorded before any result -- see
  parameters.predeclared_prediction -- is that it is NOT, because
  beta_ip = rho_ip * sigma_i / sigma_p, and an equity sleeve's higher volatility
  typically more than offsets its correlation being below one.

falsifier: >
  Identical to exp_010's clause for clause, with every reading of "certainty
  equivalent" replaced by "geometric growth rate at gamma = 1". A sleeve's
  marginal portfolio value is REJECTED when ANY of: (a) its marginal GEOMETRIC
  GROWTH gain at the frozen reference weight, funded pro rata from the base
  portfolio, under the net-pessimistic cost column, is below the materiality
  threshold of 0.30 percentage points per year; (b) its diversification credit
  term 12*(sigma_fp - sigma_ip) at the declared funding leg is zero or negative,
  meaning the portfolio-level view supplies no credit the standalone chain
  omitted and the existing standalone dismissal stands unaltered; (c) the
  constrained optimal weight on the GROWTH surface under net-pessimistic costs is
  zero at the long-only boundary; or (d) the sleeve does not survive Holm
  family-wise error control at 0.05 across the declared family of ten sleeves, on
  the one-sided p-value that its marginal GROWTH is positive. The outcome is
  `unresolved`, NOT `rejected`, when no clause fires but any of: (u1) the
  two-sided 95% bootstrap interval on the marginal growth rate contains zero;
  (u2) the measured marginal growth rate is smaller in magnitude than the minimum
  detectable effect at 80% power, so the test could not have seen an effect of
  the size it reports; (u3) the sign of the marginal growth rate differs between
  the two frozen funding legs, because a result that depends on the funding
  convention is not a finding about the sleeve; (u4) the diversification credit
  evaluated at the two ends of the 95% bootstrap interval for the correlation
  spans zero; or (u5) the sleeve is a declared PROXY series, since a modelled
  series may never resolve anything. Clause (b) already read the gamma = 1 credit
  in exp_010 and is unchanged; that inconsistency between clause (b) and the rest
  of exp_010's falsifier is part of what this specification resolves.

universe:
  description: >
    One base portfolio built from three non-overlapping regional equity markets
    and cash, plus ten candidate sleeves and one calibration control. Every
    series is a published monthly return series. No security-level data, no
    prices, no futures contracts.
  base_portfolios:
    - id: global_equity_core
      role: primary
      description: >
        60% US / 30% developed ex-US / 10% emerging equity total return, monthly
        rebalanced to fixed weights. The weights are a frozen, round approximation
        of global equity market capitalisation and are NOT optimised; they are
        declared here so that no reader mistakes them for a result. The three
        regions are the non-overlapping Ken French files, so nothing is double
        counted. Equity total return is Mkt-RF + RF from the region's own file.
    - id: balanced_60_40
      role: secondary
      description: >
        60% global_equity_core / 40% cash (FRED TB3MS), monthly rebalanced. Cash,
        not bonds: decision record 0002 establishes that no free price source is
        research grade and no investable bond total-return history is available to
        this repository. This portfolio exists to show how the diversification
        credit scales with the base portfolio's own variance, since the credit is
        sigma_p^2 (1 - beta_ip) under pro-rata funding and must shrink when
        sigma_p falls.
  sleeves:
    - id: us_small_value
      kind: long-only
      series: Ken French US 6 Portfolios 2x3, value-weighted, SMALL HiBM
      funding_leg: us_equity
      funding_rationale: >
        A small-value tilt is funded out of the US equity allocation, which is what
        an investor holding a global core actually does. This is the sleeve the
        key sub-question is about: at a correlation near 0.9 to a global equity
        core and a higher volatility, its beta should EXCEED one and its credit
        should be negative.
      cost_tier: long_only_equity
    - id: dev_ex_us_small_value
      kind: long-only
      series: Ken French Developed ex-US 6 Portfolios 2x3, value-weighted, SMALL HiBM
      funding_leg: dev_ex_us_equity
      funding_rationale: funded out of the region it belongs to, as above
      cost_tier: long_only_equity
    - id: emerging_small_value
      kind: long-only
      series: Ken French Emerging Markets 6 Portfolios 2x3, value-weighted, SMALL HiBM
      funding_leg: emerging_equity
      funding_rationale: funded out of the region it belongs to, as above
      cost_tier: long_only_equity
    - id: dev_ex_us_equity
      kind: long-only
      series: Ken French Developed ex-US Mkt-RF + RF
      funding_leg: us_equity
      funding_rationale: >
        The classic "diversify away from the United States" trade is funded from
        the US allocation, not pro rata, because pro rata would partly fund the
        sleeve out of itself.
      cost_tier: long_only_equity
    - id: emerging_equity
      kind: long-only
      series: Ken French Emerging Mkt-RF + RF
      funding_leg: us_equity
      funding_rationale: as above
      cost_tier: long_only_equity
    - id: us_momentum_overlay
      kind: funded long-short overlay
      series: Ken French US Mom factor, plus cash to make it a funded position
      funding_leg: us_equity
      funding_rationale: >
        An overlay is carved out of the equity allocation: sell equity, hold cash
        and the self-financing long-short position against it. Funding it from
        cash instead is reported as the third leg.
      cost_tier: long_short_overlay
    - id: dev_ex_us_momentum_overlay
      kind: funded long-short overlay
      series: Ken French Developed ex-US WML factor, plus cash
      funding_leg: dev_ex_us_equity
      funding_rationale: as above
      cost_tier: long_short_overlay
    - id: emerging_momentum_overlay
      kind: funded long-short overlay
      series: Ken French Emerging WML factor, plus cash
      funding_leg: emerging_equity
      funding_rationale: as above
      cost_tier: long_short_overlay
    - id: us_momentum_long_only
      kind: long-only
      series: Ken French US 6 Portfolios ME x Prior 12-2, value-weighted, BIG HiPRIOR
      funding_leg: us_equity
      funding_rationale: >
        The large-cap winners portfolio is the closest public analogue of an
        investable long-only momentum tilt. It is registered separately from the
        long-short overlay because the two have different betas to an equity core
        and the whole question here is about beta.
      cost_tier: long_only_equity
    - id: trend_aqr
      kind: funded long-short overlay, vendor series
      series: AQR published monthly time-series momentum factor, plus cash
      funding_leg: us_equity
      funding_rationale: >
        The usual pitch is that trend is funded out of bonds. No investable bond
        total-return history exists here (decision record 0002), so the frozen
        funding leg is US equity and the bond form is not available. This is a
        limitation and is reported as one.
      cost_tier: long_short_overlay
      note: >
        Already evaluated standalone-in-a-portfolio by exp_004 against a
        risk-matched cash comparator. It is re-run here inside the SAME
        decomposition as every other sleeve so that its credit is comparable with
        theirs; this is not an independent replication of that experiment.
  proxy_sleeves:
    - id: long_duration_treasury_proxy
      kind: MODELLED PROXY, not investable, research_grade false
      proxy_for: >
        A long-duration Treasury sleeve -- the asset most likely to carry a beta
        near or below zero to an equity core, and therefore the asset most likely
        to earn a real diversification credit.
      construction: >
        Ten-year par-bond total return reconstructed from FRED GS10 by the
        standard duration-and-convexity approximation, identical in form to the
        robustness arm of exp_004: r_t = y_{t-1}/12 - D(y_{t-1}) (y_t - y_{t-1})
        + 0.5 C(y_{t-1}) (y_t - y_{t-1})^2.
      funding_leg: us_equity
      cost_tier: long_duration_proxy
      contract: >
        A modelled series has no total-return contract, no coupon reinvestment
        convention and no transaction costs. Falsifier clause (u5) forces this
        sleeve to `unresolved` whatever it measures. It is included because
        omitting the one asset class with a plausibly negative beta would bias the
        whole experiment toward the conclusion that no credit exists anywhere.
  calibration_control:
    - id: cash_control
      kind: null sleeve
      description: >
        Cash, added to the equity core and funded from US equity. Its marginal
        GROWTH RATE must be materially negative: it gives up the equity premium
        and earns a credit only equal to sigma_p^2 minus roughly zero covariance.
        If this control does not come out negative, the machinery is wrong and no
        other number in this experiment may be read. It is a control, not a
        hypothesis, and is excluded from the Holm family. Under exp_010 this check
        was read on the certainty equivalent, where the control came out POSITIVE
        at +0.166 pp/yr; that was not a defect in the machinery but a property of
        the metric, and it is the observation this specification exists to act on.
  excluded:
    - >
      GOLD. No research-grade gold price series is reachable from this repository.
      Decision record 0002 establishes that no free price source carries a
      documented total-return or corporate-action contract, and no gold series is
      registered in portfolio_edge.data.fred. Gold is the other asset with a
      plausibly low equity beta and it is NOT TESTED here. That is a gap in this
      experiment, reported as one, and not filled by reaching for a free feed.
    - >
      SEC Form N-PORT fund return series. Public filings begin in 2019, so the
      longest common history is about 78 months. At the realised monthly
      dispersion of a marginal sleeve return that is far short of the sample the
      minimum-detectable-effect arithmetic in parameters.power requires, and a
      sleeve tested on it could only ever come back `unresolved`. Adding it would
      spend a multiple-testing trial to buy nothing.
    - >
      Any long-short factor evaluated as if it were investable. The Ken French
      factor files are paper portfolios with no shorting cost, no borrow, no
      capacity limit and no rebalancing friction inside the factor.
    - >
      Any weight above the frozen cap, and any short weight. The long-only
      constraint is part of the question, not a simplification of it.

sample_policy:
  start: "1991-01"
  end: "2025-12"
  held_out: >
    Observations after 2025-12 are not read. Every input file reaches at least
    2026-05, so between five and seven months exist beyond the boundary and are
    clipped before any statistic is computed.
  embargo: >
    No estimator in this experiment uses a future observation: every weight is a
    frozen constant and every statistic is computed on the realised path. The
    constrained optimal weight IS chosen in sample, which is a selection effect
    rather than a look-ahead, and it is handled by re-selecting the weight inside
    every bootstrap replicate rather than by pretending it was not chosen.
  eras:
    - name: first_half
      start: "1991-01"
      end: "2008-12"
      rationale: >
        Eighteen whole calendar years ending with the global financial crisis.
        Split at a round boundary chosen before any result was seen, not at the
        point where any sleeve's performance changed.
    - name: second_half
      start: "2009-01"
      end: "2025-12"
      rationale: >
        Seventeen whole calendar years. Most of the candidate sleeves were
        published and widely marketed before this era began, so McLean and
        Pontiff (2016) predict decay here.
    - name: full_period
      start: "1991-01"
      end: "2025-12"
      rationale: >
        The full 35-year window, reported alongside the halves and never instead
        of them.

benchmark:
  primary: >
    The base portfolio itself, at zero sleeve weight, on the identical monthly
    grid and the identical cost column. The marginal metric is a PAIRED
    difference against this benchmark, which is why the bootstrap resamples the
    joint panel rather than the two series independently.
  rationale: >
    The benchmark choice decides the answer. Comparing a portfolio-plus-sleeve
    against cash, or against an unlevered index the sleeve is not funded from,
    flatters the sleeve. The only honest control for "what does adding this do" is
    the same portfolio without it, funded from a declared leg, at the same cost.
  secondary: >
    The same comparison under each of the three frozen funding legs, because the
    funding source determines which covariance enters the credit and can flip its
    sign.

primary_metric:
  name: marginal geometric growth rate at the frozen reference weight
  definition: >
    Annual geometric growth rate -- the CRRA certainty equivalent at gamma = 1,
    which is the geometric mean of the calendar-year gross returns minus one -- of
    the base portfolio with the sleeve at the frozen reference weight of 0.10,
    funded pro rata from the base portfolio, MINUS the same quantity for the base
    portfolio at zero sleeve weight, both computed from non-overlapping
    calendar-year gross returns over the same 35 years and both charged the same
    cost column.
  gamma: 1
  units: percentage points per year
  cost_basis: net-pessimistic
  reported_beside_it_and_deciding_nothing: >
    The CRRA gamma = 3 certainty equivalent, on every figure, together with the
    de-risking component that separates the two. Decision record 0008 requires the
    pair to travel together: reporting only the growth figure would hide how much
    risk a sleeve removes, which is the opposite error and equally bad.
  why_growth_and_not_the_certainty_equivalent: >
    Because the certainty equivalent, computed exactly over only 35 calendar-year
    returns, REWARDS DE-RISKING, and this experiment's own cash calibration control
    measures the reward. Cash funded out of the equity core supplies zero alpha and
    zero diversification credit by construction. Under exp_010 it nevertheless
    scored +0.166 pp/yr of certainty equivalent while LOSING 0.643 pp/yr of growth:
    a de-risking component of +0.810 pp/yr, against a materiality threshold of
    0.30. Any investor obtains that component free by holding less equity, so a
    sleeve that clears the bar on it has been paid for something it did not supply.
    Even the second-moment CRRA model at gamma = 3 says cash COSTS 0.148 pp/yr, so
    +0.376 of the +0.810 is a left-tail reward that no model in this repository
    predicts and only the exact utility over 35 observations produces.
  why_a_frozen_weight_and_not_the_optimum: >
    The optimum is chosen from the same sample it is evaluated on. A marginal
    figure reported at the in-sample optimum is a selected maximum and its naive
    interval is too narrow. The frozen reference weight carries the primary
    inference; the constrained optimum and its own interval, re-selected inside
    every bootstrap replicate, are reported beside it and never instead of it.
  uncertainty: >
    Paired stationary block bootstrap on the joint monthly panel, so the pairing
    between the portfolio with and without the sleeve is preserved. Resampling
    them independently would produce an interval for the difference of two
    unrelated portfolios, which is a much wider and entirely different statement.

secondary_metrics:
  - name: standalone alpha term, 12*(mu_i - mu_f)
    units: percentage points per year
  - name: diversification credit term, 12*(sigma_fp - sigma_ip)
    units: percentage points per year
  - name: exact first-order growth derivative, 12*E[(r_i - r_f)/(1 + r_p)]
    units: percentage points per year per unit weight
  - name: higher-moment residual, exact derivative minus the two-moment decomposition
    units: percentage points per year per unit weight
  - name: beta of the sleeve to the base portfolio
    units: beta
  - name: correlation of the sleeve to the base portfolio, with a bootstrap interval
    units: correlation
  - name: credit re-evaluated at both ends of the correlation interval
    units: percentage points per year
  - name: constrained optimal long-only weight
    units: fraction of portfolio value
  - name: geometric-growth gain at the constrained optimal weight
    units: percentage points per year
  - name: flatness of the growth surface near its peak
    units: fraction of portfolio value
  - name: marginal CRRA gamma = 3 certainty equivalent, reported beside every deciding figure
    units: percentage points per year
  - name: de-risking component, the certainty equivalent minus the growth rate
    units: percentage points per year
  - name: minimum detectable effect at 80% power
    units: percentage points per year
  - name: Holm-adjusted p-value across the declared family
    units: probability

cost_model:
  applied: yes
  reporting_columns: [gross, net-optimistic, net-pessimistic]
  default_reported_column: net-pessimistic
  gross_column_definition: >
    No investor-level fee and no portfolio trading cost. It is not an achievable
    outcome and exists only to size the gap to the net columns.
  source_series_basis: >
    Ken French research portfolios and factor series are gross of every cost and
    are paper portfolios. AQR states no fee, transaction-cost, slippage or
    financing basis anywhere in its archived workbook -- established as a finding
    by exp_004 -- so its series is also treated as gross. The fee tiers below are
    THIS REPOSITORY'S assumptions about the cost of an accessible implementation,
    not any provider's disclosure.
  spread_and_commission:
    net_optimistic:
      one_way_bps: 2.0
    net_pessimistic:
      one_way_bps: 8.0
    basis: >
      Charged on the portfolio-level trades that rebalance to the fixed base
      weights and that fund and maintain the sleeve, on the traded notional, every
      month. Costs alter the realised path before any statistic touches it; they
      are never a constant haircut applied afterwards. They are NOT charged on the
      trades inside a Ken French portfolio or inside the AQR sleeve, which are not
      observable. Identical to exp_003 and exp_004, so the columns are comparable.
  fee_tiers:
    long_only_equity:
      net_optimistic_management_fee_annual_percent: 0.15
      net_pessimistic_management_fee_annual_percent: 0.40
      performance_fee_percent_of_gains: 0.0
      assumption: >
        A broad or factor-tilted index fund at the cheap end, and a small-cap or
        emerging-market factor fund at the dear end. Both are observable fee
        levels for products of this shape.
    long_short_overlay:
      net_optimistic_management_fee_annual_percent: 0.65
      net_pessimistic_management_fee_annual_percent: 1.50
      performance_fee_percent_of_gains: 10.0
      performance_fee_basis: >
        Charged monthly on gains above a high-water mark, which is the standard
        contract and is strictly more favourable to the strategy than charging on
        every up month. The favourable convention is chosen deliberately: the
        conclusion must not depend on an unnecessarily harsh fee model. Identical
        to exp_004.
      assumption: >
        Typical accessible fee for a liquid alternative. It does NOT include the
        shorting cost, borrow, capacity limit or internal rebalancing friction
        that a real long-short implementation pays and that the Ken French files
        omit entirely, so it is an underestimate of unknown size.
    long_duration_proxy:
      net_optimistic_management_fee_annual_percent: 0.05
      net_pessimistic_management_fee_annual_percent: 0.15
      performance_fee_percent_of_gains: 0.0
      assumption: a Treasury index fund, at fee levels that are observable
    calibration_control:
      net_optimistic_management_fee_annual_percent: 0.0
      net_pessimistic_management_fee_annual_percent: 0.0
      performance_fee_percent_of_gains: 0.0
      assumption: cash pays no fund fee; the control must not be flattered or penalised

rebalance_rule:
  base_weights: frozen at 0.60 US / 0.30 developed ex-US / 0.10 emerging equity
  balanced_arm: frozen at 0.60 of the equity core and 0.40 cash
  sleeve_weight: >
    Frozen reference weight 0.10 for the primary metric; the constrained optimum
    is searched over [0, 0.20] and reported separately.
  funding: >
    The sleeve is funded from a declared leg. Three legs are reported for every
    sleeve: `pro_rata` from the whole base portfolio, `named_leg` as frozen per
    sleeve in universe.sleeves, and `cash`. The funding leg determines which
    covariance enters the credit and can flip its sign, so it is named beside
    every figure and never left implicit.
  frequency: monthly, rebalanced to the fixed targets at the end of each month
  execution_lag_months: 0
  execution_lag_hostile_test_months: 1
  drift: >
    The trade each month is the distance from the weights the previous month
    drifted to, so a portfolio whose targets never move still pays for the drift
    it corrects. The initial purchase is not charged: every comparison starts from
    the same cash and an identical entry cost cannot change a difference.

inference:
  bootstrap: stationary block bootstrap on the joint monthly panel of the base portfolio and the sleeve
  block_length_policy: >
    Mean block length frozen at 12 months, with 6 and 24 as predeclared
    neighbours, matching exp_004 so that the intervals are comparable. The block
    length is NOT selected from the data, because a data-selected block length is
    a tuned parameter that narrows an interval.
  multiple_testing_correction: >
    Holm family-wise error rate at 0.05 across the declared family of ten sleeves,
    on the one-sided p-value that the marginal GROWTH RATE is positive,
    computed at the frozen reference weight on the primary base portfolio under
    the primary funding leg and the net-pessimistic column. Holm is valid under
    arbitrary dependence, which is what is needed here because the sleeves share
    a base portfolio and overlapping data. The calibration control is excluded
    from the family: it is a machine check, not a hypothesis. The family of ten
    is a LOWER bound on the correction the whole search requires, because it
    counts neither the funding legs, the base portfolios, the cost columns, the
    eras, nor the eight experiments this repository has already run.
  confidence_level: 0.95
  resamples: 10000
  notes: >
    The marginal-value framing does not escape the power problem this repository
    keeps meeting; it changes its shape. A covariance estimated from 420 months is
    noisy, and the credit is a difference of two covariances. The minimum
    detectable effect at 80% power is reported beside every marginal figure, and a
    marginal figure smaller than its own minimum detectable effect is reported as
    `unresolved` rather than as evidence of anything.

rejection_rule: >
  Apply the falsifier clause by clause, per sleeve, in the order (a) to (d), then
  the `unresolved` triggers (u1) to (u5). Mark `rejected` when any of (a) to (d)
  fires. Mark `unresolved` when none fires but any of (u1) to (u5) does. Under no
  outcome may this specification produce a status above `exploratory`: every input
  is a public paper portfolio, a vendor series or a modelled proxy, the weights are
  evaluated in sample, and no walk-forward or shadow-live test is performed.
  `unresolved` and `rejected` are different findings and are never collapsed. The
  EXPERIMENT's status is the least favourable outcome across the family unless at
  least one sleeve clears every clause, in which case it is that sleeve's status.
  The ceiling of `exploratory` is inherited from exp_010 and is additionally
  binding here for a second reason: this specification re-judges data that has
  already been examined once, which is weaker evidence than a first look at it and
  never stronger.

parameters:
  evaluation_disclosure:
    is_investable_backtest: false
    is_independent_replication: false
    statement: >
      This experiment evaluates published research portfolios, one vendor series
      and one modelled proxy. Ken French's files are paper portfolios rebuilt from
      the current CRSP or Bloomberg vintage on every release and carry no trading
      cost, no capacity limit and no borrow. The AQR series is maintained by a
      firm that sells the strategy. The long-duration sleeve is modelled from a
      yield and is not a total-return history at all. No figure here is an
      achievable investor outcome, and no write-up may describe one as such.
    what_would_make_this_confirmatory: >
      Investable total-return histories with a documented corporate-action
      contract, a walk-forward weight-selection rule fitted only on data before
      each evaluation window, and a cost model calibrated to executed trades
      rather than assumed. None of the three exists in this repository today.
  predeclared_prediction:
    recorded_before_any_result: true
    statement: >
      Because beta_ip = rho_ip * sigma_i / sigma_p, an equity sleeve's higher
      volatility is expected to more than offset its correlation being below one.
      Worked example at plausible numbers: rho = 0.88, sigma_i = 20%, sigma_p =
      15% gives beta = 1.173 and a credit of 2.25% * (1 - 1.173) = -0.39
      percentage points per year. The prediction is therefore that every
      long-only equity sleeve -- small-value, regional equity, long-only momentum
      -- shows a beta at or above one to the equity core and a credit at or below
      zero, and that only trend and the long-duration proxy show a positive
      credit. This is recorded so that the result can CONTRADICT it. A
      contradiction is the more interesting outcome and must be reported at least
      as loudly as a confirmation.
    how_it_is_scored: >
      Per sleeve, record predicted sign of the credit, realised sign, and whether
      the realised credit's correlation-sensitivity band excludes the predicted
      sign. Report the tally.
  sample_start_rationale: >
    1991-01 is the first January on or after the latest first observation among
    the eleven monthly inputs. Developed ex-US momentum begins 1990-11, which is
    the binding constraint; a momentum factor needs twelve months of prior returns
    before it can be formed, so the regional momentum files start later than the
    five-factor files. The window is exactly 35 whole calendar years = 420 months,
    which is required because the growth rate is computed from
    non-overlapping calendar-year gross returns and a partial year cannot be
    silently dropped.
  materiality_threshold_annual_percent: 0.30
  materiality_rationale: >
    The same threshold exp_004 and exp_010 froze, unchanged, so that the only
    difference between this experiment and exp_010 is the metric the threshold is
    applied to. It is a threshold on the NET marginal GEOMETRIC GROWTH RATE, not on
    a gross premium and not on a certainty equivalent.
  decision_gamma: 1
  decision_gamma_rationale: >
    The risk aversion whose metric decides every threshold and every falsifier
    clause. Decision record 0008 sets it to 1 for every specification frozen after
    that record. gamma = 1 is the geometric growth rate: the rate at which capital
    actually compounds, with no preference parameter in it and therefore no term
    that can pay a sleeve for reducing risk.
  crra_gamma: 3
  crra_gamma_rationale: >
    UNCHANGED from exp_010, and no longer the deciding number. It remains the
    reported companion on every figure, because the gap between the two bases IS
    the de-risking component and suppressing it would hide how much risk a sleeve
    removes.
  rejudgement:
    supersedes: exp_010_marginal_sleeve_value
    superseded_specification_hash: d46d0f95243826dfc99457e87148a76b41eb86aa3da1e980f22b84527215594a
    data_already_examined: true
    adds_no_new_trial: true
    what_changed: >
      One thing: the gamma at which the deciding metric is computed, from 3 to 1.
      The inputs, pinned vintages, base portfolios, sleeves, funding legs, cost
      columns, weight grids, window, eras, block lengths, resample count and seed
      are all byte-identical to exp_010's. The seed is deliberately unchanged so
      that the two runs draw the SAME bootstrap index stream and the difference
      between them is the metric and nothing else.
    when_it_was_decided: >
      AFTER exp_010's numbers were read. That is the dangerous direction and it is
      recorded here rather than glossed. Two things bound the danger. First, the
      change was calibrated on the CASH CONTROL, which carries no hypothesis and
      cannot promote anything: it is a machine check whose correct answer was known
      before the data was seen. Second, the change is strictly HOSTILE to every
      candidate -- it removes a reward, raises the effective bar for every sleeve
      that was clearing it on de-risking, and moves this family's status from
      `unresolved` to a worse one. A metric changed after the fact that makes
      everything look better would be worthless; this one makes everything look
      worse, which is the only direction in which such a change is cheap to trust.
    trial_count: >
      This specification adds ZERO trials to the repository's search. It re-judges
      the same twelve sleeves on the same data that exp_010 already spent. Any
      later deflated-Sharpe or family-wise count must treat exp_010 and this file as
      ONE search of ten sleeves, not two searches of ten, and the Holm family here
      is the same family of ten by the same argument exp_010 gives.
    what_it_may_not_do: >
      It may not promote anything. Re-judging already-examined data is weaker
      evidence than a first look at it, not stronger, so the ceiling of
      `exploratory` that exp_010's rejection_rule imposes is inherited unchanged
      and a status ABOVE it is impossible whatever any sleeve measures.
  reference_weight: 0.10
  weight_cap: 0.20
  weight_cap_half: 0.10
  weight_grid_step: 0.005
  bootstrap_weight_grid_step: 0.02
  weight_cap_rationale: >
    A satellite sleeve inside a diversified portfolio. Twenty per cent is the
    largest weight a single non-core sleeve plausibly takes; ten per cent is the
    hostile arm. Both were chosen before any result and neither is optimised.
  flatness_definition: >
    The growth surface is reported on the whole weight grid. Three
    flatness statistics accompany every optimum: the width of the plateau on which
    the gain is at least 90% of its maximum; the gain at the cap as a fraction of
    the gain at the optimum; and the width of the region on which the gain exceeds
    the materiality threshold. A large optimal weight sitting on a wide plateau is
    not evidence that the weight is large; it is evidence that the data cannot
    locate a weight.
  base_weights:
    us: 0.60
    developed_ex_us: 0.30
    emerging: 0.10
    rationale: >
      A frozen, round approximation of global equity market capitalisation, not an
      optimisation. The exact split is not load-bearing: the credit depends on
      beta to the core, and the three regional markets correlate above 0.7 with
      each other, so a reasonable reweighting moves sigma_p by well under a
      percentage point. That claim is checked as a hostile test rather than
      asserted.
  balanced_equity_share: 0.60
  cash_series: TB3MS
  cash_series_rationale: >
    TB3MS is the monthly average secondary-market three-month Treasury bill rate
    on a discount basis: the conventional monthly cash proxy in the US
    asset-pricing literature and the series exp_004 froze, so cash is the same
    asset in both experiments. DGS3MO and DFF are registered in this repository
    and were NOT used; they are different maturities on different constructions.
    Ken French's own RF column is used to turn Mkt-RF into a total return, because
    that is the only sum that reconstructs the market's total return, and is not
    used as the cash asset.
  power:
    definition: >
      The minimum detectable effect is the smallest true marginal
      geometric-growth gain that a one-sided test of size alpha would reject
      the null for with probability power_target. Two forms are reported for every
      sleeve and neither is allowed to stand alone: MDE_bootstrap =
      (z_{1-alpha} + z_{power}) * sd(bootstrap replicates of the marginal figure),
      which carries the serial dependence and the nonlinearity of the certainty
      equivalent; and MDE_normal = (z_{1-alpha} + z_{power}) * 12 * sigma_d /
      sqrt(T) on the monthly incremental return d_t, which is the form exp_001 and
      exp_005 report and is included so the figures are comparable with theirs.
    alpha_one_sided: 0.05
    power_target: 0.80
    reported_for_every_cell: true
    also_report:
      - the realised marginal figure as a multiple of its own minimum detectable effect
      - the number of months and the effective number of independent 12-month blocks
      - the minimum detectable effect on the diversification credit alone
  decomposition:
    identity: >
      For portfolio p, sleeve i and funding leg f, funding weight w of i out of f:
      dg/dw|_{w=0} = E[(r_i - r_f)/(1 + r_p)] exactly, and to second order in the
      moments = (mu_i - mu_f) - (sigma_ip - sigma_fp). With f = p the second term
      is sigma_p^2 (1 - beta_ip), the diversification credit. For a CRRA investor
      with risk aversion gamma the same expansion gives (mu_i - mu_f) - gamma *
      (sigma_ip - sigma_fp), and gamma = 1 recovers the growth case.
    reported_terms:
      - alpha_term = 12 * (mu_i - mu_f)
      - credit_term = 12 * gamma * (sigma_fp - sigma_ip)
      - moment_total = alpha_term + credit_term
      - exact_derivative = 12 * mean((r_i - r_f) / (1 + r_p))
      - higher_moment_residual = exact_derivative - moment_total at gamma = 1
    why_both: >
      The exact derivative is the true first-order effect on the growth rate and
      needs no distributional assumption. The two-moment decomposition is what
      SPLITS that effect into the standalone term and the credit. Reporting only
      the split would hide how much of it the two moments actually capture;
      reporting only the exact figure would answer the wrong question. The residual
      between them is reported so a reader can see the approximation error rather
      than trust it.
    fixture_policy: >
      The decomposition is a pure function of five scalars and is intended to be
      checked against a closed form derived independently of this implementation.
      If an independently derived closed form disagrees with these numbers, the
      closed form wins until proven otherwise, and the disagreement is a finding
      rather than a tolerance to loosen.
  correlation_sensitivity:
    definition: >
      credit_term = 12 * gamma * (sigma_fp - rho_ip * sigma_i * sigma_p), so
      d(credit)/d(rho_ip) = -12 * gamma * sigma_i * sigma_p. Report the derivative
      per 0.10 of correlation, and the credit re-evaluated at both ends of the
      correlation's own block-bootstrap 95% interval with the volatilities held at
      their point estimates.
    rationale: >
      A credit of a few tens of basis points that moves by more than itself when
      the correlation moves by 0.10 is not a finding. The samples here cannot pin
      a correlation tightly, and that has to be visible in the output rather than
      inferred from it.
  sleeves_not_tested:
    - id: gold
      reason: >
        NOT TESTED. No research-grade gold price or total-return series is
        reachable. Decision record 0002 governs; no gold series is registered in
        portfolio_edge.data.fred and no free price feed may be substituted. Gold
        is one of only two candidate assets with a plausibly low equity beta, so
        its absence biases this experiment toward finding no credit anywhere, and
        that direction is stated rather than left for a reader to notice.
    - id: nport_fund_returns
      reason: >
        NOT TESTED. Public N-PORT filings begin in 2019, giving at most about 78
        months of common history. The minimum-detectable-effect arithmetic in
        parameters.power shows what that buys, and it is not enough to distinguish
        a 0.30 percentage-point marginal effect from zero. exp_002 and exp_008
        already use N-PORT for what it can answer, which is what funds hold and
        what they charge, not whether a sleeve adds growth.
    - id: investable_bond_sleeve
      reason: >
        NOT TESTED as an investable series. Decision record 0002. The modelled
        GS10 duration proxy stands in its place and is forced to `unresolved` by
        falsifier clause (u5).
  source_pin:
    policy: >
      Every French and AQR input is pinned by the sha256 of its raw bytes AND by
