      0.00; vendor most recent 78 months 1.74; vendor post-publication 3.90;
      the corrected like-for-like forward figure 4.07 (central); JST 36-leg
      book 5.32; own 4-asset book 7.18; full-window realisation 10.98.
    equity_premium_over_bonds_grid_pp_yr: [0.0, 1.5, 3.0, 5.0]
    bond_excess_over_cash_pp_yr: 0.8
    bond_excess_source: >
