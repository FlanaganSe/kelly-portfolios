  regret:
    what: >
      The working default's expected gap against the published construction at
      forward premia, arithmetic on the paired difference and no simulation:
      `0.05 x (b - 1.072 x (E + b) - t) + 0.05 x (1.1952 - 0.05)` pp/yr, where
      `t` is the gross trend premium per unit of notional at 12.38% volatility,
      `E` the equity premium over bonds and `b` the bond's excess over cash. The
      log-growth cell adds one constant, half the difference of the two arms'
      realised variances on the primary panel, printed beside the table. A
      positive cell means the working default wins.
    trend_gross_premium_grid_pp_yr: [0.0, 1.74, 3.90, 4.07, 5.32, 7.18, 10.98]
    trend_central_pp_yr: 4.07
    trend_grid_source: >
