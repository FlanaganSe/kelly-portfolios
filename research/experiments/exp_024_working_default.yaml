      docs/research/market-scan-2026.md, as 018 section 3 uses them. The bond
      term enters the pair only as `0.05 x (1 - 1.072) x b`, under 0.01 pp/yr
      per point of term premium, so no sweep is needed.
    wrapper_equity_per_dollar: 1.072
    wrapper_cost_pp_yr: 1.1952
    bond_line_fee_pp_yr: 0.05
    points_moved: 0.05
    reporting: >
      One table, rows the trend grid, columns the equity grid, each cell the
      arithmetic and the log gap; the break-even trend premium at each equity
      premium beside it. The reader sees when each vector wins.

