hostile_tests:
  - Charge financing to every levered control on the same terms as the arms.
  - Sweep the equity-futures basis 62-231 bp and report whether the arm ordering against the reference survives.
  - Report the primary pair on every declared sub-window with its own HAC interval and floor, so a full-window sign cannot be quoted without the windows that made it.
  - Report the flat equity decade and both parts of the bond bull market's complement.
  - Report every crisis episode of both types, including 1973-74, 1977-81 and 2022 where a bond line is expected to hurt, with partial coverage flagged.
  - Report the ten-year leg's excess return and correlation to equity in every era beside the pair's gap, and the largest Shiller-FRED yield difference on the overlap.
  - Reproduce 016f's rec30-against-rec25 log gap on the tournament panel to 0.005 pp/yr before adding the bond line; a shared pair that moves is a defect.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Report the ex-ante volatility-matched control beside the ex-post one.
  - Price the pair at forward premia on one grid for both premia; a forward substitution applied to one leg and not the other is a thumb.

reporting_requirements:
  - The freeze note with every table, including that the TIPS line is a nominal ten-year proxy and what that assumes.
  - The MDE and the control named beside every gap, in the same row; never a figure combining two controls.
  - The HAC interval and the block-bootstrap interval beside every full-window gap.
  - Gross, equity, trend, bond and cash notional beside every arm.
  - Maximum drawdown, months under water, worst-decile offset, both episode-type means, the flat-decade gap and the contribution-weighted terminal-wealth ratio for every arm, labelled descriptive.
  - The regret table with its variance-drag constant and the break-even trend premium per equity premium.
  - The trend-book volatility scalar beside 018's, the 016f specification hash read, and the sha256 of every source file read.
  - The wrapper-cut and bond-line decomposition, as the cash arm's gap and the ten-year-minus-cash pair, beside the primary pair.

notes: >
  Exploratory in the strongest sense: the working default was chosen after
  016f, 018 and 022 were read, and the specification records that. It can rank
  constructions on public series and cannot rank funds. Retain `unresolved`
  wherever the instrument cannot separate an arm from its control, read the
  drawdown and crisis tables as descriptions of one history, and read a
  `rejected` on the primary pair as a sign at realised premia whose forward
  value is the regret table. No sleeve, fund or portfolio is promoted by this
  specification.
