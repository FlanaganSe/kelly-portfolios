hostile_tests:
  - Charge financing to every levered control on the same terms as the arms, and scale sub-unity controls with bills rather than leaving the remainder idle.
  - Sweep the equity-futures basis 62-231 bp and report whether each trend arm's ordering against its plain twin survives.
  - Report every primary pair on every declared sub-window with its own HAC interval and floor, so a full-window sign cannot be quoted without the windows that made it; post_2009 in particular.
  - Print the drawdown table on the full panel AND on from_1934, from_1946, from_1963_07, from_1990_11 and from_2003_02, so a -30% claim cannot be made on the window that flatters it; reproduce setting-the-equity-share §5's -30.6% for plain60_40 and -21.3% for plain40_60 on from_1963_07 within 1 pp, or explain the difference.
  - Report both inflation episodes for every arm with the bond line's own loss beside the arm's, and the check panel's TIPS-versus-nominal difference on 2022.
  - Report the ten-year leg's excess return and correlation to equity in every era beside each plain arm's gap against its volatility-matched control.
  - Reproduce 016f's rec30-against-rec25 log gap on the tournament panel to 0.005 pp/yr before scoring any cautious arm, and 024's working-default-minus-published pair if the arm set is extended to include it.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Report the ex-ante volatility-matched control beside the ex-post one.
  - Price every pair at forward premia on one grid for both premia; a forward substitution applied to one leg and not the other is a thumb.
  - Print the 5 bp bond-fee sensitivity (3 bp and 18 bp) on the largest bond line.

reporting_requirements:
  - The freeze note with every table, including that the bond line is a nominal ten-year proxy for TIPS and what that assumes at 40 to 63 points of capital.
  - The MDE and the control named beside every gap, in the same row; never a figure combining two controls.
  - The HAC interval and the block-bootstrap interval beside every full-window gap.
  - Gross, equity, trend, bond and cash notional beside every arm.
  - The drawdown table per panel and per declared era, with months under water, and the tolerance-row reading of parameters.drawdown_reporting, labelled descriptive.
  - Worst-decile offsets, both episode-type means, the flat-decade gap and the contribution-weighted terminal-wealth ratio for every arm, labelled descriptive.
  - Both regret tables with their variance-drag constants and break-even premia.
  - The check panel's TSY10-versus-TIPS table per arm.
  - The trend-book volatility scalar beside 018's, the 016f specification hash read, and the sha256 of every source file read.

notes: >
  Exploratory in the strongest sense: the arms were chosen after the
  equity-share table, the notional ladder, 018 and 024 were read, and the
  specification records that. It can rank constructions on public series and
  cannot rank funds. Retain `unresolved` wherever the instrument cannot
  separate an arm from its control, read the drawdown and crisis tables as
  descriptions of one history, and read a `rejected` against the cheap control
  as the price of a drawdown constraint and not as a verdict on the reader who
  holds it. No sleeve, fund or portfolio is promoted by this specification.
