    statement: Tests selective carry as an abstract risk exposure. No known retail wrapper is assumed
      to deliver the selective legs. Gross vendor data and every haircut/loading value are distinct from
      observed net fund returns.
    order_of_operations: Specification committed before implementation or new component analysis; previous
