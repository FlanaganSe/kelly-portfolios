  carry_calibration:
    start: 1969-01
    end: 1973-12
    months: 60
    target_volatility_percent: 12.38
    method: For each chosen component divide by its calibration volatility; equal-weight these risk units,
      then rescale the fixed blend to 12.38% calibration volatility. Coefficients stay constant after
      calibration. All Macro Carry is calibrated directly, so its calibration has three classes and its
      evaluation four; disclose the splice. No calibration mean enters weights.
    variants:
      all_macro:
      - All Macro Carry
      bond_commodity:
      - Fixed income Carry
      - Commodities Carry
      commodity_only:
      - Commodities Carry
