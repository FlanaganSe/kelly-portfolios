# Frozen before new empirical analysis. Prior exp019 component findings motivated selection.
# No candidate weights, calibration dates or regimes were chosen using new results.
# Removing equity/FX carry is a new whole-portfolio test, not independent confirmation.
# Carry calibration uses 1969-1973 only; scoring begins 1974-02.
# The vendor reconstructs all history; 2013+ cannot be called untouched out-of-sample.
experiment_family: exp_027_selective_carry
title: Does bond and commodity carry improve the equity-plus-trend portfolio?
entry_point: exp_027_selective_carry
run_kind: exploratory
evidence_class: policy-simulation
consumes_final_holdout: false
seed: 20260905
hypothesis: Removing equity-index and currency carry may retain return while reducing equity-tail dependence
  inside the equity-plus-trend construction. Three fixed carry definitions and three funding rules are
  compared. Previous component correlations and means from Experiment 019 motivated this selection; this
  is not independent confirmation.
mechanism: Bond and commodity carry sell different insurance from directional trend. The existing audit
  rejected long/short commodities for overlap, but Experiment 019 measured commodity carry versus trend
  at +0.04. Test the whole funded portfolio, including arithmetic and log growth, drawdown and equity-tail
  offsets. A low correlation alone is insufficient. A financed 10-point leg contributes 0.10 times its
  excess return minus wrapper costs; selling equity or trend changes the forgone return.
falsifier: 'Reuse Experiment 019 arithmetic-gap clauses per panel and control: nonpositive point estimate
  rejected on sign only; positive below its own 80% power MDE unresolved; above MDE but BH-adjusted p
  above 0.10 unresolved; financing-band sign flip unresolved; otherwise exploratory. All statuses are
  scoped descriptive exploration, never promotion. The experiment status is exploratory because it completes
  a registered exploratory measurement, not because any arm wins. Log-growth, downside and comparison
  across carry definitions are descriptive with paired bootstrap intervals for log gaps; no selective
  headline winner.'
universe:
  description: 'US equity plus trend and a hypothetical carry exposure, not an ETF return. Carry variants:
    vendor All Macro Carry, equal-risk fixed-income plus commodity carry, commodity carry alone. No geographic/factor
    fund basis, taxes, contract-level costs or live wrapper delivery claim.'
  excluded:
  - Weight optimisation
  - Retail delivery inference
  - Independent or point-in-time vendor history claim
sample_policy:
  start: 1926-01
  end: 2026-05
  held_out: 'No untouched holdout. Selection uses Experiment 019 results. Carry coefficients are frozen
    using only 1969-01 through 1973-12 returns. Scored windows begin 1974-02 (all four asset classes present),
    1985-01 (AQR trend), and 2013-09 (after the carry paper circulated). The 2021 vendor reconstruction
    CAN reflect post-2013 data: that window is not independent post-publication evidence.'
  embargo: Carry calibration ends 1973-12, before every scored month. Trend retains 019 full-window risk
    scalar on the own-book panel, common to all arms; AQR trend is unchanged. Source vintage is not point-in-time.
  eras:
  - name: flat_equity_decade
    start: 1999-03
    end: 2009-02
    rationale: The one flat-to-negative equity decade in the modern panel, with the boundaries exp_016e
      froze.
  - name: post_2009
    start: 2009-01
    end: 2025-05
    rationale: "The era in which the trend overlay's gap decayed to an unresolvable size (Experiment 018\
      \ \xA72); declared so that carry's post-2009 behaviour can be read beside trend's on the same months.\n"
  - name: post_publication
    start: 2013-09
    end: 2025-05
    rationale: After 2013 paper circulation, but already used in 2021 vendor reconstruction and inspected
      by exp019. A regime check, not independent evidence.
benchmark:
  primary:
    id: cheap
    definition: 100% equity core at 3 bp, unlevered, rebalanced on the same clock.
    rationale: Decision 0003, charter question 1.
  secondary:
    id: leverage_matched
    definition: 'The equity core levered to the arm''s own gross notional, financed at cash plus the equity-futures
      basis, debt accruing monthly as in exp_016.

      '
  tertiary:
    id: volatility_matched
    definition: 'Equity core plus T-bills scaled so that full-window volatility of monthly total return
      equals the arm''s (ex post, one constant), and separately so that each month''s trailing 36-month
      volatility matches (ex ante, rolling; scored from month 37 on). A scale above one is levered equity
      at the equity-futures basis.

      '
  quaternary:
    id: reference
    definition: The base_trend30 arm, CORE 70 / synthetic equity-plus-trend 30.
    rationale: 'The decision is whether adding carry improves the current recommendation, so the recommendation
      is the comparator that answers it. The paired row against the reference is the only row in which
      the trend leg cancels.

      '
  aggregation_rule: Separate controls and panels; no addition of gaps across benchmarks. BH families per
    control per panel. Cross-variant selection and earlier research attempts are not accounted for by
    within-panel BH, so no confirmatory claim.
primary_metric:
  name: arithmetic mean monthly total-return gap, annualised
  definition: '`1200 * mean(r_arm - r_control)` over monthly funded total returns net of every cost charged
    inside the simulation. Arithmetic rather than log because the question is whether an engine adds expected
    return per unit of capital at the stated leverage; annualised log growth is reported beside it as
    a secondary metric and the two are never mixed.

    '
  units: percentage points per year
  uncertainty: Stationary joint-row bootstrap, mean block 12 months, 2000 resamples, 95% percentile. Arithmetic
    MDE at 80% power from each paired monthly difference. Also paired annualised log-growth gap interval
    and 10-year overlapping-window underperformance frequency.
secondary_metrics:
- name: minimum detectable effect at 80% power
  units: percentage points per year
  note: '`2.801585 * sd(d) * 12 / sqrt(T)`, beside every gap without exception.'
- name: years to distinguish
  units: years
- name: annualised log growth
  units: percentage points per year
- name: maximum drawdown of the funded wealth path
  units: percent
- name: longest run of months below the running peak
  units: months
- name: correlation of carry with trend and with equity, and of trend with equity
  units: correlation
  note: 'Pearson on the panel''s excess-return legs, full sample and on the worst decile of equity months;
    by era; and for each of the four per-asset-class carry columns against the trend book and equity.
    Descriptive.

    '
- name: worst-decile-of-equity-months mean offset against the reference arm
  units: percentage points per month
- name: cumulative return in each predeclared crisis episode
  units: percent
- name: era gaps against each control
  units: percentage points per year
- name: contribution-weighted terminal wealth ratio
  units: ratio
cost_model:
  applied: fully, inside the simulation, every month, before any statistic
  charged_on: '(1) each wrapper''s expense ratio on the capital allocated to it; (2) financing at cash
    plus the equity basis on the equity futures a wrapper holds beyond its physical capital; (3) the equity
    basis on the debt of any control whose capital weights exceed one; (4) a 0.55 bp round-trip US equity
    spread, half-crossed on one-sided monthly rebalancing turnover, on every line; (5) on the sensitivity
    panels, a flat annual haircut on the carry leg. Nothing is a post-hoc haircut on a reported estimate.

    '
  wrapper_expense_ratio_basis_points:
    CORE: 3
    RSST_LIKE: 99
    CARRY_STACK: 99
    CARRY_FUND: 85
    CARRY_SWAP: 99
    CASH: 0
  financing_basis_points_over_cash:
    equity: 62
  financing_sources: "Reuse 019 assumed 62 bp equity-futures basis, sweep 62\u2013231 bp. Internal trading/slippage\
    \ are not observed; fixed 2 pp/yr risk-unit haircut is sensitivity, not calibrated cost. Fees 99 and\
    \ 85 bp are scenario inputs, not evidence a selective carry product exists."
  round_trip_spread_basis_points:
    us_equity: 0.55
  carry_leg_haircut_pp_yr:
    published: 0.0
    cost_1pp: 1.0
    cost_2pp: 2.0
    rationale: 'The vendor series states no trading cost. A rank-weighted cross-sectional carry book rebalanced
      monthly turns over less than a trend book on most legs (currencies and bonds) and more on commodities;
      20 bp one-way on roughly 250-500% one-way turnover is 0.5 to 1.0 pp/yr, and 2.0 pp/yr is the pessimistic
      bound. Both are ASSUMPTIONS and are swept, not estimated.

      '
  not_charged:
  - Trend-book internal trading costs, common to reference and stack but material for trend substitution.
  - Taxes, tax lots, initial bid/ask, contract-level spread, margin and collateral stress.
  - No evidence that 2 pp/yr bounds selective carry trading cost.
rebalance_rule:
  frequency: 'MONTHLY, every month, back to the arm''s capital weights, so that the arms are held to the
    same clock as the leverage-matched and ex-ante volatility- matched controls.

    '
  drift: Weights drift within the month and the drifted weights earn the month's return.
  overlay_legs: 'A wrapper''s internal notional is a property of the wrapper and is never rebalanced by
    the investor. The per-dollar exposures in `parameters.wrappers` are constants.

    '
  debt: 'Positions and debt are carried in absolute terms, exp_016''s `_simulate`, reused by import. Debt
    accrues at cash plus the equity-futures basis.

    '
inference:
  bootstrap: stationary block bootstrap on the joint monthly panel, whole rows resampled
  block_length_policy: 'Mean block length frozen at 12 months, as in exp_016e and exp_018; not tuned on
    the data.

    '
  multiple_testing_correction: 'Benjamini-Hochberg at q = 0.10 within each control family on each scored
    panel, never across. The family omits the sensitivity panels, the era tables, and the eighteen earlier
    specifications that searched this data.

    '
  confidence_level: 0.95
  resamples: 2000
  notes: Intervals and MDE describe one reconstructed history; neither proves future advantage. 2013 onward
    is not an untouched sample.
rejection_rule: The falsifier classifies individual arithmetic gaps only; log growth and tail results
  must accompany them. No fund or construction is promoted.
