hostile_tests:
- Two pp/year assumed internal carry cost, jointly with 0.681 delivered-loading sensitivity.
- 1985 and 2013 onward regimes on AQR trend.
- Financing at 62 and 231 bp in the gross scored panels.
- Identical-month comparison of carry variants; no unequal sample tails.
- 'Explicit funding alternatives: financed stack, equity sale, trend substitution.'
reporting_requirements:
- All source pins and calibration coefficients, sample lengths and missing-data errors.
- Every funding arm with arithmetic and log growth, maximum drawdown and time under water.
- Paired log-growth interval, 10-year overlapping-window underperformance frequency and worst shortfall;
  undefined if fewer than 120 months.
- Equity-tail offsets and fixed episode coverage; partial episodes labelled.
- Carry variant against all_macro on identical months and funding, costs and loading; arithmetic gap interval
  and MDE.
- No ETF, after-tax, point-in-time, independent replication or promotion claim.
notes: 'Exploratory in the strongest sense: the arms were selected after every earlier result was read,
  and the specification records that. This experiment can rank constructions on public series and cannot
  rank funds. The carry leg is the vendor''s gross reconstruction and the haircut panels are the only
  cost evidence. Retain `unresolved` wherever the instrument cannot separate an arm from its control,
  and read the correlation, drawdown and crisis tables as descriptions of one history. No sleeve, fund
  or portfolio is promoted by this specification.

  '
