    alpha: 0.05
    two_sided: true
    multiplier: 2.801585
    computed_before_freezing: At 1.24% tracking error, about 0.49 pp/yr on 51 years, 0.55 on 41 years,
      0.98 on 12.5 years. A 10-point carry stack must earn about 6 pp/yr gross to clear the long-panel
      floor after 11.15 bp/yr certain cost. This is a design calculation, not a data result.
