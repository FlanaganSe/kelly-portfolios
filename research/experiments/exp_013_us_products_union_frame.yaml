hostile_tests:
  - Assert Experiment 002's two screening regexes byte-for-byte before the run, so an edit there fails here loudly instead of making the audits incomparable.
  - Re-estimate with CAPM, FF3 and FF5-plus-UMD and report all three; every p-value enters the correction.
  - Re-estimate on the fixed calendar halves and on rolling 36-month windows, and report where a window is too short to support either.
  - Report Benjamini-Hochberg AND Holm-Bonferroni, labelled optimistic and defensible respectively, and widen the denominator to every screened series padded with p = 1.0.
  - Report the model-misfit pedestal on the full window AND on every distinct fund window, so a short-window alpha is compared against a short-window pedestal.
  - Report the minimum detectable ALPHA and the minimum detectable LOADING at 80% power beside every estimate, and state plainly where the instrument is blunter than the effect.
  - Count separately the funds added because the 2019Q4 census did not carry the series and those added because a moved criterion had excluded them, so "the frame was the problem" is decomposed rather than asserted.
  - Cross-check every N-PORT return against an independent source over the same months and report the disagreement, or report that the check could not run.

reporting_requirements:
  - The complete screened-series table, including every rejection and its reason.
  - Each fund's usable month count beside its loading, its alpha and both minimum detectable effects.
  - Raw and shrunk alpha side by side, never the raw alpha alone, and never without the pedestal for the same window.
  - Statistical alpha and implementation value reported as separate findings.
  - How many funds the corrected frame admits, decomposed by why, and what their statuses are.
  - An explicit statement of whether the corrected frame changes Experiment 002's conclusion.

notes: >
  Promotion requires the intended exposure to be present, stable, economically
  material and cheap. Residual alpha is not a promotion criterion in either
  direction. Nothing in this experiment may be promoted: decision record 0002
  caps all fund-level work at `exploratory` until a source with a documented
  total-return and corporate-action contract is licensed, and the windows here
  are shorter than Experiment 002's rather than longer.
