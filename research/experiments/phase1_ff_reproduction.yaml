  boundary_checks:
    expected_observations_by_era:
      ff2015_jfe_published: 606
      ff2013_working_paper: 594
    strictly_increasing_periods: true
    no_duplicate_periods: true
    no_month_gaps: true
    no_missing_values_in_factor_columns: true
    no_sentinel_leakage: true
    sentinels: [-99.99, -999.0]
    note: >
      Run through portfolio_edge.data.validation.validate_table on the whole
      parsed table, then repeated on the windowed series, because a table that
      validates over 756 rows can still be wrong over the 606 that are used.

data_sources:
  - id: french_us_ff5_monthly
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_CSV.zip
    sha256_raw: cbc3724812132654fbbe8daae3c46e0f90e70008434f94a7986fe49f1db6ad3b
    manifest: data-manifests/french_us_ff5_monthly.json

hostile_tests:
  - Assert the pinned sha256 of the raw bytes before parsing, and fail the run
    rather than reporting a number computed from a different file.
  - Assert the freshly derived table's canonical hash equals the one in the
    committed manifest, which catches a parser change that leaves the raw bytes
    identical.
  - Recompute every statistic on the deliberately wrong risk-free treatment,
    Mkt-RF minus RF and each long-short factor minus RF, and report how far that
    error moves each cell, so the size of the classic mistake is measured rather
    than asserted to be absent.
  - Recompute on the annual table from the same file and confirm it does not
    match the monthly target, so that selecting the wrong one of the two tables
    in the file cannot pass silently.
  - Shift the sample window by plus and minus one month and report the resulting
    differences, so that an off-by-one boundary is visibly excluded rather than
    assumed.
  - Report the same statistics on the full 756-month file so that the effect of
    the window itself is visible.

reporting_requirements:
  - Exact source vintage, URL, sha256 of raw bytes, HTTP Last-Modified, and the
    CRSP vintage quoted from the file's own preamble.
  - Paper, table, panel, block, column and row targeted, with the URL and sha256
    of the PDF the published values were read from.
  - Sample dates and the realised observation count.
  - Monthly arithmetic mean, annualised arithmetic premium, monthly and
    annualised volatility, Sharpe ratio, conventional and HAC standard errors,
    and both t-statistics, per factor.
  - The difference from the published value for every gating cell, with the
    verdict against both the gate and the print-exact diagnostic band.
  - An explicit statement of which series are already excess returns and that RF
    was not subtracted.
  - An explicit statement of what passing does NOT establish.

notes: >
  This gate is an integration test of one data path and of arithmetic. It cannot
  verify portfolio accounting, rebalancing, transaction costs, tax lots,
  corporate actions, insolvency behaviour, missing-data handling, look-ahead
  protection, or optimisation constraints, because it exercises none of them.
  The published factor file already contains the authors' own calculated returns,
  so matching it verifies that we read and summarised their numbers correctly and
  nothing more. It can also match despite compensating errors. It is a necessary
  condition for trusting the ingestion path and nowhere near a sufficient one.
