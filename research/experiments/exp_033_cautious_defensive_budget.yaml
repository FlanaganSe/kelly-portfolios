hostile_tests:
  - Separate longer no-trend diagnostic includes 2022; never splice it into RSST history.
  - Fivefold investor execution cost, with NAV fees not charged again.
  - Require all declared fund months and CPI start/end levels; never fill CPI or returns.
  - Known CPI gap2025-10 means real downside is only an observed-date lower bound on severity.
reporting_requirements:
  - Exact weights, windows, excluded CPI months, source identities and readable artifacts.
  - Distinguish actual Cautious from the longer no-trend diagnostic in every table.
  - Realwealth uses previous-month CPI as initial deflator and month CPI for observed month-end wealth.
  - Report that CPI is a monthly price index, not an exact trading-date consumption deflator.
  - Omit optional indexed-withdrawal scenario because the pinned monthly CPI series is incomplete.
notes: >
  Frozen before any defensive portfolio returns are inspected under this design. SGOV/IEF
  IDs were resolved from the existing SEC ticker-map bytes; STIP from the fixed-income shelf.
  Duration-hedged credit is left for a separate hypothesis rather than broadening this bounded
  first defensive comparison. Actual NAV includes inflation accrual; do not add CPI as a second
  return component. Realwealth is nominal wealth divided by the realised CPI ratio, not a TIPS
  principal-accrual simulation. Both histories contain the same known missing CPI month.
