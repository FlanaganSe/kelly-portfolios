experiment_family: exp_033_cautious_defensive_budget
title: Rebuild Cautious's defensive half using actual fund NAV and observed inflation
entry_point: exp_033_cautious_defensive_budget
run_kind: exploratory
evidence_class: policy-simulation
consumes_final_holdout: false
seed: 2026090533
hypothesis: >
  Short TIPS, Treasury bills, intermediate nominal Treasuries or fixed mixtures can
  improve the complete Cautious portfolio's growth or real-capital downside compared
  with its present 50% SCHP holding. Shorter duration can protect real wealth differently
  from nominal-duration exposure; no defensive fund is presumed optimal.
mechanism: >
  Replace only the defensive 50% while leaving the remaining holdings unchanged.
  A separately labelled no-trend portfolio replaces RSST with VTI in every arm and
  permits a longer history including 2022. Deflate observed wealth by CPI-U for realised
  purchasing power; fund NAV already includes TIPS principal accrual and internal costs.
falsifier: >
  Report paired growth-gap intervals and nominal/real downside for all fixed arms.
  Reversals across the two differently constructed histories expose scope dependence.
  No selected historical winner, retirement claim or long-run shortfall probability.
universe: >
  SCHP, STIP, SGOV, IEF; six defensive choices including equal STIP/bills and equal
  SCHP/bills. STIP selected before returns because its share-class source is already
  audited and its 3bp headline fee matches VTIP; no claim it is the best short-TIPS fund.
sample_policy:
  start: '2021-10'
  end: '2026-03'
  held_out: None; current funds and overlapping returns already examined.
  embargo: No predictive trading signal; realised CPI is used only to report purchasing power.
  eras:
    - {name: actual_cautious, start: '2023-10', end: '2026-03', rationale: First complete RSST month through frozen 030 endpoint.}
    - {name: no_trend_diagnostic, start: '2021-10', end: '2026-03', rationale: Different portfolio; RSST capital becomes VTI to include 2022.}
benchmark: >
  Primary unchanged SCHP version of each construction, separately. Cheap control is
  32.5% VTI,17.5% VXUS,50% SCHP in each window; not beta-, risk- or leverage-matched.
primary_metric: Annual paired log-growth gap after investor execution, percentage points per year.
secondary_metrics:
  - Nominal CAGR, arithmetic return, month-end drawdown and trading cost
  - Relative terminal wealth, tracking error and realised rolling twelve-month underperformance
  - Real terminal wealth and annualised real growth from CPI endpoints
  - Drawdown and maximum real-principal shortfall on dates with observed CPI only
cost_model: >
  Reuse 030 exact self-financing execution. NAV includes fund fees and internal trading;
  add only 5/25bp roundtrip investor execution, half per dollar on each side, paid at
  initial purchase and annual rebalance. No investor taxes, withdrawals or exit sale.
rebalance_rule: >
  Each construction invests at its own first month, drifts and resets targets on each
  twelve-month anniversary. Non-defensive weights stay identical across its six arms.
inference:
  bootstrap: Joint stationary bootstrap of fund rows, rerunning every complete execution path.
  block_length_policy: Fixed six-month mean blocks.
  multiple_testing_correction: None; fixed descriptive family without selection or promotion.
  confidence_level: 0.95
  resamples: 2000
  notes: >
    Paired log-gap percentile intervals use the same fund rows for each arm/control.
    Common endpoint inflation cancels from paired nominal versus real log-growth gaps.
    CPI is not resampled; real downside is descriptive on observed dates, not an inflation-risk model.
rejection_rule: Always exploratory; short histories cannot validate long-horizon defensive adequacy.
