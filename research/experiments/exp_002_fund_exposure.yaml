# Frozen before any return series was read. The screening rule below is
# predeclared and mechanical; no fund may be added or removed after returns have
# been looked at. Every change made while turning the placeholder fields into
# concrete ones is recorded in parameters.concretisation_log, with the date and
# the reason, and every one of them was made BEFORE any return was examined.
experiment_family: exp_002_fund_exposure
title: Investable factor product exposure and implementation audit
entry_point: exp_002_fund_exposure
run_kind: exploratory
evidence_class: fund-implementation-audit
consumes_final_holdout: false
seed: 20260812

hypothesis: >
  Among funds that pass the predeclared screen below, at least one delivers its
  intended factor exposure with a loading that is materially different from a
  cheap broad-market fund, stable across subperiods, and at a total cost that
  leaves the exposure worth buying. This is a hypothesis about EXPOSURE DELIVERY,
  not about alpha. A fund with zero alpha passes if it delivers the intended
  exposure cheaply and reliably; a fund with positive estimated alpha over a
  short history fails if its exposure is absent or unstable.

mechanism: >
  A factor product is a manufacturing problem, not a forecasting one. The index
  methodology, rebalance frequency, breakpoint choice, capacity, securities
  lending policy and fee together determine how much of a published long-short
  premium reaches a shareholder. Since the published premium is gross and
  long-short, and the product is net and long-only, the delivered exposure is the
  only thing that can be audited directly. Any residual return is a small
  difference between large numbers: Fama and French (2010) estimate the average
  standard error on a single fund's alpha at about 3.36% per year against a
  cross-sectional standard deviation of true gross alpha of about 1.25% per year,
  so the noise is roughly 2.7 times the signal and any observed alpha must be
  shrunk hard before it is believed.

falsifier: >
  A fund is rejected as an implementation candidate when ANY of: (a) the
  point estimate of its loading on its intended factor is below 0.15 over the
  common period; (b) the intended loading's sign flips between the first and
  second half of the fund's common-period history; (c) its tracking difference
  versus a cheap broad-market fund plus the same combination of broad funds that
  approximates its exposures is worse than its stated expense ratio advantage by
  more than 0.50 percentage points per year; or (d) its total realised cost of
  ownership, including expense ratio, tracking difference and realised taxable
  distributions, exceeds the materiality threshold of 1.0 percentage point per
  year above the broad-market comparator without a corresponding exposure. A
  t-statistic on residual alpha below 2 is NOT a falsifier: it usually means the
  sample cannot identify a small residual return, not that the fund is useless.

universe:
  screening_rule:
    description: >
      Predeclared and mechanical. The screen is applied to a regulatory census,
      not to a vendor list, and it is applied BEFORE any return series is
      downloaded. The full screened list including every rejection and its reason
      is committed as an artifact. There is no "and peers" clause and no
      discretionary addition. A fund that fails the screen has its returns left
      undownloaded, so no screen decision can be revised after seeing them.
    frame:
      source: >
        Every fund series that filed a Form NPORT-P in the SEC's structured N-PORT
        data set for 2019Q4. This is a regulatory census of US registered
        investment companies, so membership is not curated by any vendor and does
        not depend on a fund still existing today.
      frame_date_rationale: >
        The frame is taken at the START of the observation window, not the end.
        Screening the 2025Q4 census would select on survival: a fund that
        liquidated in 2022 would simply be absent. Screening the 2019Q4 census
        and then following each fund forward is what makes attrition measurable
        instead of invisible.
      known_frame_limitation: >
        SURVIVORSHIP IS BOUNDED, NOT REMOVED. Any fund that closed before
        2019Q4 is invisible to this frame, and public N-PORT filings do not exist
        before 2019 at all. The measured attrition below is therefore a LOWER
        BOUND on the true rate for the factor shelf as a whole.
    criteria:
      - id: mandate_regex
        rule: >
          The official series name matches the predeclared factor-mandate pattern
          (value, growth, momentum, quality, profitability, minimum or low
          volatility, multifactor, factor, small-cap, mid-cap) case-insensitively.
      - id: exclusion_regex
        rule: >
          The official series name does not match the predeclared exclusion
          pattern, which removes leveraged and inverse funds, sector and thematic
          funds, single-country and non-US funds, ESG-primary funds, bond, income,
          dividend, allocation, target-date, buffer and option funds.
      - id: exchange_traded
        rule: >
          At least one share class of the series carries a ticker flagged ETF=Y in
          the Nasdaq consolidated symbol directory, which is an exchange record
          rather than a sponsor claim.
      - id: minimum_net_assets
        rule: Net assets of at least 1,000 million USD at the 2019Q4 frame date.
      - id: maximum_expense_ratio
        rule: >
          Net expense ratio at or below 0.60% per year, read from the sponsor's
          own published fund page or prospectus, with the URL and the date read
          recorded per fund.
      - id: inception_cutoff
        rule: >
          Inception on or before 2016-12-31, so that the fund had at least three
          full years of operating history before the observation window opens and
          the audit is not measuring a launch.
      - id: complete_return_coverage
        rule: >
          A filed Item B.5 monthly total return exists for every month of the
          frozen common period, with no gap. A fund with a gap is recorded and
          excluded rather than interpolated.
    ordering: >
      Funds are presented by net assets at the frame date, descending; ties broken
      by ticker alphabetically. Ordering is for presentation only and selects
      nothing.
    recorded_for_every_screened_fund:
      - ticker, series id, class id, official series name
      - screen outcome and the FIRST criterion that failed, in the fixed order above
      - net assets at the 2019Q4 frame date and at the 2025Q4 frame date
      - whether the series is still filing in 2025Q4, and its final-filing flag
      - net and gross expense ratio, the source URL, and the date each was read
      - inception date
      - index tracked and index provider
      - stated mandate and the predeclared intended factor it maps to
      - current exchange listing status from the consolidated symbol directory
      - data availability start and end, and any gap
      - securities-lending revenue split disclosed by the sponsor
  intended_factor_map:
    description: >
      Which factor each mandate is supposed to deliver, declared BEFORE any
      regression is run so that a fund cannot be graded against whichever loading
      turned out to be largest. Sign is part of the declaration.
    mapping:
      value: {factor: HML, sign: 1}
      growth: {factor: HML, sign: -1}
      momentum: {factor: UMD, sign: 1}
      quality: {factor: RMW, sign: 1}
      small_cap: {factor: SMB, sign: 1}
      mid_cap: {factor: SMB, sign: 1}
      small_cap_value: {factor: HML, sign: 1}
      small_cap_growth: {factor: HML, sign: -1}
      mid_cap_value: {factor: HML, sign: 1}
      mid_cap_growth: {factor: HML, sign: -1}
      multifactor: {factor: HML, sign: 1}
    note: >
      A growth mandate is graded on a NEGATIVE HML loading of the same magnitude,
      because growth is the short leg of value and not an independent factor. A
      size-and-style mandate is graded on its STYLE leg, because the plain size
      index is separately present in this universe and the style tilt is the only
      thing that distinguishes the two; the size loading is reported for every
      fund but does not decide a size-and-style fund's outcome. A multifactor
      mandate is graded on HML because every multifactor product in this universe
      names value first in its own objective.
    reserved_mandate: >
      The value `mandate_changed` is deliberately ABSENT from this map, so a fund
      whose stated objective changed inside the window fails the screen instead of
      being graded against a mandate it no longer has. Such a fund is recorded
      with its change date, never silently dropped. Index and methodology changes
      that leave the stated mandate intact do NOT exclude a fund; they are
      recorded in the product facts and reported beside the stability results,
      because excluding them would remove most of the shelf and would hide exactly
      what the rolling-loading test exists to find.
  comparators:
    broad_market:
      ticker: VTI
      rationale: >
        A cap-weighted total US market fund at a published 0.03% expense ratio,
        frozen before the audit. It is the cheapest broad thing an investor could
        hold instead of any fund in this universe.
    synthetic_combination:
      basis: [VTI, VUG, VTV, VB]
      construction: >
        Non-negative weights summing to one, fitted by constrained least squares
        on the SAME window as the exposure regression, so the combination is the
        best in-sample replication of the product from cheap broad building
        blocks. This is a LOOK-AHEAD construction and is reported as such: an
        investor could not have known these weights in advance, so the tracking
        difference against it is a BEST CASE for the replication and therefore a
        HARD test for the product.
      rationale: >
        The comparison that decides implementation value. A fund can be worth
        holding with zero alpha if it delivers a wanted exposure that cheap broad
        funds cannot, and worthless with positive alpha if they can.

sample_policy:
  start: "2020-01"
  end: "2025-12"
  held_out: >
    Observations after 2025-12 are not read. Returns are never downloaded for a
    fund that failed the screen, so a screen decision cannot be revised after
    seeing performance.
  embargo: >
    None; no forecast is made across a boundary. Subperiod splits are calendar
    halves fixed in advance.
  eras:
    - name: common_period
      start: "2020-01"
      end: "2025-12"
      rationale: >
        The only window in which every screened surviving fund has a filed monthly
        return. All cross-fund comparison happens here. Comparing funds over
        incompatible eras is the error this era exists to prevent.
    - name: first_half
      start: "2020-01"
      end: "2022-12"
      rationale: Fixed calendar split for the stability test, chosen before estimation.
    - name: second_half
      start: "2023-01"
      end: "2025-12"
      rationale: Second half of the same fixed split.
    - name: covid_drawdown
      start: "2020-01"
      end: "2020-06"
      rationale: >
        Conditional exposure check. Reported as a diagnostic, never as an
        independent observation.
    - name: value_reversal
      start: "2022-01"
      end: "2022-12"
      rationale: >
        A period in which value and momentum exposures diverged sharply. Included
        because it is hostile to the hypothesis, not because it is favourable.

benchmark:
  primary: >
    VTI total return as reported by the fund on Form N-PORT, net of its own fee
  secondary: >
    A constrained-least-squares combination of VTI, VUG, VTV and VB approximating
    the product's exposures, so that the question is what the product adds over
    what is already cheaply available.
  factor_model: FF5 plus UMD, US, monthly, from the same French vintage as exp_001
  note: >
    The benchmark is frozen here because the choice decides the answer. A factor
    fund compared against the market alone will look like alpha whenever its
    factor is in favour.

primary_metric:
  name: intended factor loading over the common period
  definition: >
    OLS coefficient on the intended factor in a regression of the fund's monthly
    excess return on Mkt-RF, SMB, HML, RMW, CMA and UMD, with Newey-West HAC
    standard errors at 6 lags.
  units: loading (dimensionless)
  uncertainty: HAC 95% interval, and a stationary block-bootstrap 95% interval

secondary_metrics:
  - name: residual (Jensen) alpha
    units: percentage points per year
    note: >
      Reported with its interval and shrunk toward zero using the
      Fama-French (2010) dispersion. Never reported as a point estimate alone and
      never used to rank funds. An annual alpha is TWELVE times a monthly
      intercept, so its standard error annualises by x12, never by sqrt(12).
  - name: residual volatility
    units: percentage points per year
  - name: tracking difference versus each comparator
    units: percentage points per year
  - name: total cost of ownership
    units: percentage points per year
  - name: maximum drawdown, common period
    units: percent
  - name: rolling 36-month loadings on the intended factor
    units: loading
  - name: minimum detectable alpha at 80% power
    units: percentage points per year

cost_model:
  applied: true
  fund_level: >
    Total return is constructed as actually experienced by a shareholder: the
    fund's own Item B.5 monthly total return, which is already net of the
    published expense ratio and already assumes reinvestment of distributions.
    The expense ratio is NOT subtracted a second time. Subtracting it again is
    the most common error available here and would double-count the whole fee.
  trading_level: >
    Not applicable to a buy-and-hold shareholder of the fund itself. The fund's
    internal trading cost is unobservable and is NOT estimated; its effect is
    inside the tracking difference and is reported as such rather than modelled.
  cash_rate: >
    One consistently defined cash series for every excess return in this
    experiment, declared in parameters and never swapped. TB3MS, DGS3MO and DFF
    are not interchangeable.
  reporting_columns: [gross, net-optimistic, net-pessimistic]
  net_optimistic: >
    The fund's reported total return as filed. Already net of the expense ratio
    and of any securities-lending revenue the fund kept, because both are inside
    net asset value before the return is computed.
  net_pessimistic: >
    The same return less the tax on realised distributions at the declared
    hypothetical rates. Default reported column WHERE IT CAN BE COMPUTED.
  unobservable_in_the_primary_source: >
    Form N-PORT carries neither the split of a fund's return between income and
    capital gain distributions nor portfolio turnover. Item B.5 reports a single
    total return; the turnover ratio and the distribution history live in the
    annual report on Form N-CSR, which is unstructured HTML. So realised taxable
    distributions and reported turnover are recorded as GAPS for every fund
    rather than estimated. Where the secondary source supplies dividend events
    for a fund, an indicative distribution yield is reported beside the gap and
    is labelled as coming from the non-research-grade source. No constant tax
    haircut is applied to any return under any circumstances.

rebalance_rule:
  shareholder: buy and hold the fund; no rebalancing within this experiment
  comparator_combination: >
    Monthly rebalance to the fitted approximating weights, so the comparator is
    not flattered by drift.

inference:
  bootstrap: stationary block bootstrap on returns
  block_length_policy: >
    Mean block length frozen at 6 months for monthly fund data, with 3 and 12
    reported as predeclared neighbours. Not tuned on the statistic tested.
  multiple_testing_correction: >
    Benjamini-Hochberg FDR at 0.10 across ALL screened funds and ALL model
    specifications, not only the funds that survive and not only the
    specification that was reported. The denominator is the number of funds with
    usable data times the number of specifications estimated, which is why every
    screened fund and every specification is recorded.
  confidence_level: 0.95
  resamples: 10000
  notes: >
    Fund histories here are 72 months. The regression is the estimand of interest;
    the alpha is a by-product with a standard error large enough that most funds
    will be `unresolved` on alpha and decidable only on exposure. The minimum
    detectable alpha at 80% power is reported for every fund, because a wide
    interval that is read as evidence of absence is the specific error this
    experiment is most exposed to.

rejection_rule: >
  Per fund: mark `rejected` when a falsifier clause fires. Mark `unresolved` when
  no clause fires but the intended loading's 95% interval contains 0.15, which is
  expected for short histories. Mark `exploratory` when the intended exposure is
  present, stable across the fixed split, economically material, and delivered at
  a total cost below the materiality threshold; that permits the fund to be used
  as an implementation proxy in a later experiment and permits nothing else. No
  fund is promoted on residual alpha, and no fund is rejected solely because its
  alpha t-statistic is below two.

parameters:
  minimum_intended_loading: 0.15
  materiality_threshold_annual_percent: 1.0
  hac_lags: 6
  minimum_monthly_observations: 72
  minimum_net_assets_usd: 1000000000
  maximum_net_expense_ratio_percent: 0.60
  inception_on_or_before: "2016-12-31"
  power_target: 0.80
  rolling_window_months: 36
  cash_series: french_rf_one_month_bill
  cash_series_rationale: >
    The one-month Treasury bill rate distributed in the SAME French file as the
    factors, used to build every excess return in this experiment. The reason is
    not convenience: Mkt-RF is defined as the market return LESS THIS RATE, so a
    regression intercept is only interpretable as alpha when the dependent
    variable's excess return is taken over the same rate. Using a different cash
    series would push the difference between the two rates straight into every
    alpha. It is frozen here so it cannot be swapped for whichever series
    improves a result.
  cash_series_alternatives_tested: [TB3MS, DGS3MO, DFF]
  cash_series_alternatives_rationale: >
    All three are substituted in a hostile test and the effect on every excess
    return is reported, so that the choice above is shown not to have made the
    answer. They are NOT interchangeable with each other or with the one-month
    bill: different maturities, frequencies and constructions.

  alpha_shrinkage:
    description: >
      Every alpha is shrunk before it means anything. Taking true gross alpha as
      normal with mean zero and cross-sectional standard deviation
      sigma_true = 1.25%/yr (Fama and French 2010), against a single-fund standard
      error SE, the posterior mean is
      shrinkage_factor * observed_alpha with
      shrinkage_factor = sigma_true^2 / (sigma_true^2 + SE^2).
    sigma_true_annual_percent: 1.25
    reference_standard_error_annual_percent: 3.36
    reference_shrinkage_factor: 0.121
    worked_example: >
      At the reference standard error the factor is
      1.25^2 / (1.25^2 + 3.36^2) = 0.121, so an observed 5%/yr alpha implies a
      posterior near 0.6%/yr. The factor is recomputed from each fund's OWN HAC
      standard error rather than reused, because a fund with a tighter standard
      error is shrunk less and hardcoding 0.121 would be wrong for every fund.
    annualisation_trap: >
      An annual alpha is TWELVE times a monthly intercept, so its standard error
      annualises by x12 and never by sqrt(12). Using sqrt(12) would understate the
      standard error by a factor of 3.46 and shrink far too little.

  screening_patterns:
    mandate_regex: >-
      \b(value|growth|momentum|quality|profitab\w*|min(?:imum)?\s+volatility|low\s+volatility|multi-?factor|factor|small[- ]?cap|mid[- ]?cap)\b
    exclusion_regex: >-
      \b(bond|municipal|treasury|credit|corporate|high yield|target|lifecycle|retirement|esg|sustainab\w*|social|climate|clean|carbon|health|technolog\w*|financial|energy|utilit\w*|real estate|reit|gold|commodit\w*|ultra|2x|3x|inverse|bear|leveraged|emerging|international|intl|global|world|ex-?u\.?s|developed|japan|china|europe|eafe|acwi|currency|hedged|balanced|allocation|money market|convertible|preferred|option|buffer|covered call|dividend|income)\b

  return_source:
    primary:
      id: sec_form_nport_item_b5
      what: >
        The fund's own monthly total return for each month of the reporting
        period, filed on Form NPORT-P per share class, in percent.
      why_this_and_not_a_price_feed: >
        Decision 0002 found that no free PRICE feed documents a total-return
        contract, a corporate-action policy, delisting coverage or a revision
        history. Form N-PORT is not a price feed. It is a signed regulatory
        disclosure of a defined statistic, permanently archived by the SEC, in
        which a correction is a separate document and the original stays
        readable. That is a materially stronger contract than any price feed
        tested, and it is why this experiment can be run at all.
      why_it_is_still_exploratory: >
        Public N-PORT filings begin in 2019, the figures are fund-reported and
        unaudited, and a frame taken in 2019Q4 cannot see a fund that died
        before it. Decision 0002 is NOT overturned: this remains exploratory and
        may not promote a sleeve.
    secondary:
      id: yahoo_chart_monthly
      used_for: >
        An independent cross-check of the primary source over the same months,
        and nothing else. No result is estimated on it alone.
      why: >
        Two independent measurements of the same quantity make a silent
        adjustment error visible. Agreement is evidence about the data, not about
        the strategy.
      status: >
        EXPLORATORY and not research-grade, per decision 0002. Adjusted closes
        are recomputed on every request and no methodology is published.

  validation_gates:
    month_alignment: >
      Item B.5 reports rtn1 as the FIRST month of the reporting period and rtn3
      as the month ending on repPdDate. A reversed reading would shift every
      history by two months and destroy every regression while leaving the
      numbers looking plausible. The alignment is therefore CHECKED, not assumed:
      the broad-market comparator's reconstructed series must correlate at least
      0.99 with the French market factor and must show its largest single-month
      loss in 2020-03.
    market_beta_gate: >
      The broad-market comparator's regression on Mkt-RF must produce a beta
      within 0.05 of 1.00 and an R-squared of at least 0.98. A cheap total-market
      fund that does not reproduce the market factor means the data path is
      wrong, not that the fund is interesting.
    cross_source_gate: >
      Where both sources have a month, the median absolute difference between the
      N-PORT and Yahoo monthly returns is reported per fund. A large disagreement
      is a finding about the data and is reported rather than reconciled.

  tax_rates:
    qualified_dividend: 0.15
    ordinary_income: 0.32
    long_term_capital_gain: 0.15
    note: >
      Used ONLY to convert observed distributions into a net-pessimistic cost
      column for a stated hypothetical account. This is not an after-tax
      experiment: there are no tax lots, holding periods, harvesting rules or
      account modelling here, and no constant haircut is applied to returns.

  concretisation_log:
    - date: "2026-08-12"
      change: >
        Return source fixed as SEC Form N-PORT Item B.5, with the Yahoo chart
        endpoint demoted to an independent cross-check.
      reason: >
        The original specification required "a source with documented
        total-return and corporate-action treatment" without naming one, and
        decision 0002 found no free PRICE feed qualifies. Form N-PORT is a
        regulatory disclosure rather than a price feed and carries a defined
        statistic, a permanent archive and a visible amendment trail.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        Sample policy moved from 2017-01..2025-12 with a 108-month minimum to
        2020-01..2025-12 with a 72-month minimum.
      reason: >
        Public N-PORT filings begin in 2019Q4. 2020-01 is the first calendar
        month covered by every screened fund's filings whatever its fiscal
        quarter alignment, and it splits into two whole three-year halves. This
        is a data-availability constraint, not a choice about which window looked
        better; no return had been read when it was made.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        Minimum net assets raised from 100 million to 1,000 million USD at the
        frame date.
      reason: >
        At 100 million the mechanical screen returned more than a hundred
        products, which would make the audit shallow and the multiple-testing
        family unwieldy. The threshold was chosen from the COUNT of funds at each
        level, which was visible before any return was downloaded, and never from
        performance.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        The exclusion pattern was extended to match the abbreviation "Intl"
        alongside "International".
      reason: >
        The criterion was always "no non-US mandate"; one fund named
        "iShares Edge MSCI Multifactor Intl ETF" escaped the pattern on spelling
        alone. Fixing the pattern enforces the criterion that was already
        written rather than changing it.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        The frame was fixed as the 2019Q4 N-PORT census rather than a current
        fund list, and the 2025Q4 census was added purely to measure attrition.
      reason: >
        A universe assembled from currently listed funds is survivorship
        contaminated by construction. Screening the census at the START of the
        window and following each fund forward makes the attrition a measurement
        instead of an omission.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        The intended-factor map, including the negative sign for growth mandates,
        was written into the specification.
      reason: >
        Without it a fund could be graded against whichever loading turned out
        largest, which is the exposure-audit equivalent of choosing the benchmark
        after the result.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        The cash rate was changed from TB3MS to the one-month bill distributed in
        the same French file as the factors. TB3MS, DGS3MO and DFF were moved to
        the hostile tests.
      reason: >
        Mkt-RF is the market return less the one-month bill. Taking the fund's
        excess return over a THREE-month bill instead would push the spread
        between the two maturities into every regression intercept and
        contaminate exactly the quantity the experiment is most careful about.
        The change makes the estimate correct rather than convenient, and every
        alternative is still reported.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        Realised taxable distributions and portfolio turnover were reclassified
        from reported metrics to recorded gaps.
      reason: >
        Neither is in Form N-PORT. Both are in the annual report on Form N-CSR as
        unstructured HTML. Estimating them would be manufacturing a number the
        source does not contain, so they are recorded as missing instead.
      made_before_any_result: true
    - date: "2026-08-12"
      change: >
        The alpha-shrinkage factor is recomputed from each fund's own standard
        error instead of using the framework's reference 0.121.
      reason: >
        0.121 is the factor at the reference standard error of 3.36%/yr. A fund
        whose own standard error differs must be shrunk by its own factor, and
        reusing the reference would be wrong for every fund in both directions.
      made_before_any_result: true

