    url: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqtraded.txt
    manifest: data-manifests/nasdaq_traded_symbols.json
  - id: exp_002_product_universe
    url: >
      committed at data-manifests/exp_002/product_universe.json, built by
