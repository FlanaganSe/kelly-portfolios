hostile_tests:
  - Re-estimate with CAPM, FF3 and FF5-plus-UMD, and report all three; a loading
    that only appears in one specification is not an exposure.
  - Re-estimate on the fixed calendar halves and on rolling 36-month windows.
  - Substitute DGS3MO and DFF for TB3MS and show the effect on every excess
    return, to demonstrate that the choice was not made for the result.
  - Include every screened fund and every specification in the multiple-testing
    denominator and re-report corrected significance.
  - Compare each fund against the fitted combination of cheap broad funds, not
    only against the market, and state that the combination had look-ahead.
  - Cross-check every N-PORT return against an independent source over the same
    months and report the disagreement per fund.
  - Report the minimum detectable alpha at 80% power beside every alpha, so a
    wide interval cannot be read as evidence of absence.
  - Measure attrition between the 2019Q4 and 2025Q4 censuses, and report how many
    funds a universe assembled today would have contained that this one does not.

reporting_requirements:
  - The complete screened-fund table, including every rejection and its reason.
  - Common-period results for every cross-fund comparison.
  - Gross, net-optimistic and net-pessimistic in separate columns.
  - Raw and shrunk alpha side by side, never the raw alpha alone.
  - The minimum detectable alpha at 80% power beside every alpha estimate.
  - Statistical alpha and implementation value reported as separate findings.
  - An explicit statement that a positive alpha over a short inception history is
    not evidence of future manager skill.
  - An explicit statement that the binding constraint on this experiment is the
    data contract and the length of the available window, not the evidence.

notes: >
  Promotion requires the intended exposure to be present, stable, economically
  material and cheap. Residual alpha is not a promotion criterion in either
  direction.
