  funding_rule: Direct alternatives replace entire RSST weight with standalone fund(s), sacrificing
    intended stock capital. Bond alternatives first RSST to VTI then move min(original RSST, original
    SCHP) from SCHP into DBMF, KMLM or equal mix. Matching SGOV control removes the same SCHP allocation
    without trend. Standalone derivatives duration and risk are not matched.
  expected_arm_count: 9
  intended_exposure_reporting: Record explicit equity ETF plus RSST target stock capital; direct
    SCHP capital; RSST capital; standalone trend fund capital and SGOV capital. Do not add derivatives
    notional or treat equal capital as equal volatility.
hostile_tests:
- Same fixed constructions at five times the execution cost.
- Compare each construction separately with the cheap non-leverage-matched control.
- Require every declared month for every needed share class; no shortening or filling.
- Independently test fully funded drift, funding substitutions and exact execution costs.
reporting_requirements:
- Include exact weights, windows, source URLs, exact share classes and SHA256 byte identities in
  result.json.
- Commit readable comparison tables backed by hashed diagnostics.
- State few regimes, monthly drawdown resolution and absence of taxes/forward evidence.
- Keep initial purchase in full wealth and flag its inclusion in first rolling window.
- Record intended stock capital and direct SCHP changes separately; show feasible bond-funded amount.
- Commit complete result.json including source identities, weights and paths.
notes: Frozen before first execution. Only PlusTrend and Cautious 030 snapshots are evaluated; unchanged
  non-US and value holdings. Actual NAV includes internal costs and financing; investor trades only
  additionally charged. No predictive signals or portfolio selection. Equal mixture means equal capital
  with annual rebalancing, not equal trend risk. Source hashes identify bytes, not contemporaneous
  selection or availability.
