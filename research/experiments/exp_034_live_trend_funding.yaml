experiment_family: exp_034_live_trend_funding
title: Actual trend wrappers with explicit equity and TIPS funding
entry_point: exp_034_live_trend_funding
run_kind: exploratory
evidence_class: policy-simulation
consumes_final_holdout: false
seed: 2026090534
hypothesis: Standalone trend wrappers may improve full portfolio outcomes differently when replacing
  stacked equity capital or funded from TIPS. Compare fixed alternatives without assuming equal trend
  risk delivery.
mechanism: RSST targets one dollar of large-cap US equity and one dollar of managed futures per dollar
  with financing. DBMF replicates multiasset managed futures managers; KMLM uses commodity, currency
  and bond futures without equity futures. Actual NAV captures implementation and financing. Capital
  funding determines stock or TIPS exposure forgone.
falsifier: Nonpositive paired growth gaps contradict improvement on this fixed window. Intervals
  spanning zero leave it unresolved. No wrapper, trend style or funding source is permanently rejected
  or promoted.
universe: VTI VXUS VTV AVDV IDMO AVES RSST SCHP DBMF KMLM SGOV. Named share class SEC N-PORT Item
  B.5 NAV total returns; no backfill or missing-month shortening.
sample_policy:
  start: 2023-10
  end: 2026-03
  held_out: None. Overlapping historical data were inspected in earlier studies.
  embargo: No predictive fitting; fixed allocations and anniversary rebalancing only.
  eras:
  - name: both_portfolios
    start: 2023-10
    end: 2026-03
    rationale: Complete fixed RSST common window inherited from 030.
benchmark: Primary unchanged portfolio; cheap 65/35 VTI/VXUS equity with original SCHP weight is
  separate and not risk matched. Additionally alternatives compare with RSST replaced by VTI; SCHP-funded
  trend compares with matching SGOV funding control. No fitted beta match. VTI preserves intended
  stock capital, not exact large-cap mandate or realised beta.
primary_metric: Annualised paired log-growth difference in percentage points per year.
secondary_metrics:
- CAGR and arithmetic return, percentage points per year
- Month-end maximum drawdown including initial wealth, percent
- Relative terminal wealth and annualised tracking error
- Realised rolling twelve-month underperformance fraction and worst wealth ratio
- Initial and annual execution cost and realised turnover
cost_model: 'Filed NAV returns already incorporate internal management and trading costs; no expense
  ratio, turnover haircut or fitted alpha is subtracted again. Investor execution is 5 bp roundtrip
  baseline and 25 bp sensitivity, half on each dollar bought or sold. Initial cash purchase and annual
  rebalancing pay costs. Trades solve q + c sum(abs(q target - drifted_weights)) = 1 exactly; initial
  q=1/(1+c). Sheltered/no investor tax; no terminal liquidation. No bid/ask source is estimated.

  '
rebalance_rule: 'Invest before the first monthly return, restore fixed target weights before month
  13,25,37,49 (October anniversary), otherwise drift. Self-financing fully invested long-only weights.
  Initial cost is in first monthly return and initial wealth=1.

  '
inference:
  bootstrap: stationary-block on whole joint fund rows, rerun every execution path
  block_length_policy: Fixed mean block length 6 months, not tuned.
  multiple_testing_correction: None; descriptive exploratory family, no promoted winner.
  confidence_level: 0.95
  resamples: 2000
  notes: 'Paired percentile intervals for growth gaps. Joint resampling preserves fund dependence
    and reexecutes drift/rebalancing/costs. Short and overlapping histories give few independent
    regimes. Bootstrap frequencies are not forecast probabilities.

    '
rejection_rule: Always exploratory. No weight search, selection, or promotion.
