data_sources:
  - id: french_us_ff3
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_CSV.zip
    manifest: data-manifests/french_us_ff3_monthly.json
    construction: Mkt-RF and RF, used as published
  - id: goyal_welch_predictors
    url: https://docs.google.com/spreadsheets/d/1qwpl2R_DNujpU5YUkk8lacP1tTeMb9iJ/export?format=xlsx
    manifest: data-manifests/goyal_welch_predictors_monthly.json
    construction: ltr less French RF as the bond leg; ltr, corpr less Rfree inside the trend book
  - id: aqr_commodities_long_run
    url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Commodities-for-the-Long-Run-Index-Level-Data-Monthly.xlsx
    manifest: data-manifests/aqr_commodities_long_run_monthly.json
    construction: equal-weight commodity excess return, the fourth trend-book instrument; its 2025-05 end sets the primary panel's end
  - id: aqr_time_series_momentum
    url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Time-Series-Momentum-Factors-Monthly.xlsx
    manifest: data-manifests/aqr_tsmom_factors_monthly.json
    construction: TSMOM, used as published; secondary and check panels only
  - id: lbma_gold_pm
    url: https://prices.lbma.org.uk/json/gold_pm.json
    manifest: data-manifests/lbma_gold_pm.json
    construction: last USD PM fix of each month; price return less RF
  - id: fred_gs10
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS10
    manifest: data-manifests/fred_gs10.json
    construction: 10-year par bond total return, modelled; sensitivity only
  - id: fred_fii10
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=FII10
    manifest: data-manifests/fred_fii10.json
    construction: 10-year real par bond, modelled, grossed up by CPI-U; check window only
  - id: fred_cpiaucns
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCNS
    manifest: data-manifests/fred_cpiaucns.json
    construction: reference-CPI gross-up for the TIPS leg, three-month lag

hostile_tests:
  - Charge financing to every levered control on the same terms as the arms; not charging it is the error this test exists to catch.
  - Sweep the equity-futures basis 62-231 bp, the Treasury basis 0-50 bp and the gold basis 0-60 bp, and report whether the ordering against the reference arm survives.
  - Replace the ~20-year `ltr` with a modelled 10-year par bond on one window and report the change in every bond arm's gap.
  - Report the bond leg's realised excess return and its correlation to equity in every era beside every bond arm's gap.
  - Report every crisis episode of both types, including 1973-74, 1977-81 and 2022 where a bond leg is expected to hurt, with partial coverage flagged.
  - Report the flat equity decade and both eras of the bond bull market's complement, so that no conditional result is quoted without its complement.
  - Report the minimum detectable effect and years-to-distinguish beside every gap and mark any gap inside its floor unresolved rather than positive.
  - Report the gold arm with 1971-08..1974-12 inside its window and say so.
  - Report the ex-ante volatility-matched control beside the ex-post one, because the ex-post match uses the arm's realised volatility.

reporting_requirements:
  - The freeze note with every table, including that wrappers are assumed exposure vectors.
  - The MDE and the control named beside every gap, in the same row; never a figure combining two controls.
  - Gross, equity, trend, bond, gold and cash notional beside every arm.
  - Maximum drawdown, months under water, worst-decile offset, both episode-type means, the flat-decade gap and the contribution-weighted terminal-wealth ratio for every arm, labelled descriptive.
  - The bond-equity correlation regime and the bond leg's excess return in every era.
  - The trend-book volatility scalar, and the sha256 of every source file read.
  - A statement that the gold sub-window includes 1971-74 and that the bond history includes the 1981-2020 bull market.

notes: >
  Exploratory in the strongest sense: the arms were selected after every earlier
  result was read, and the specification records that. This experiment can rank
  constructions on public series and cannot rank funds. Retain `unresolved`
  wherever the instrument cannot separate an arm from its control, and read the
  drawdown and crisis tables as descriptions of one history, which is what they
  are. No sleeve, fund or portfolio is promoted by this specification.
