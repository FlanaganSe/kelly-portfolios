        committed_manifest: data-manifests/goyal_welch_predictors_monthly.json
      - id: aqr_commodities_long_run
        source: aqr
        dataset_id: aqr_commodities_long_run
        table_id: monthly
        columns: ["Excess return of equal-weight commodities portfolio"]
        expected_sha256_raw: eeb89c65fa7dca2bfbbebb7af2cbecade7b470d6a4da52883e9413a162b5fe75
