data_sources:
  - id: french_us_market_excess_return
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_CSV.zip
    manifest: data-manifests/french_us_ff3_monthly.json
    construction: Mkt-RF, used as published, not re-based onto another cash rate
  - id: goyal_welch_predictors
    url: https://docs.google.com/spreadsheets/d/1qwpl2R_DNujpU5YUkk8lacP1tTeMb9iJ/export?format=xlsx
    manifest: data-manifests/goyal_welch_predictors_monthly.json
    construction: ltr - Rfree, corpr - Rfree, and Rfree itself
    note: >
      The Google Drive endpoint returns NO Last-Modified header, so the retrieval
      timestamp is the only observable bound on when any row became available.
      That is weaker provenance than every other source used here.
  - id: aqr_commodities_long_run
    url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Commodities-for-the-Long-Run-Index-Level-Data-Monthly.xlsx
    sheet: Commodities for the Long Run
    manifest: data-manifests/aqr_commodities_long_run_monthly.json
    construction: excess return of the equal-weight portfolio, used as published
  - id: aqr_time_series_momentum
    url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Time-Series-Momentum-Factors-Monthly.xlsx
    sheet: TSMOM Factors
    manifest: data-manifests/aqr_tsmom_factors_monthly.json
    construction: TSMOM, used as published and not re-scaled

hostile_tests:
  - >
    Charge the borrow spread to the leverage-matched controls on the same terms
    as to the overlay portfolios, and report how much of the headline gap
    survives. Not charging it is the error this test exists to catch.
  - >
    Sweep a 0 to 12 pp/yr haircut on the trend leg's arithmetic mean and report
    where the 50% overlay stops paying against each benchmark separately.
  - >
    Split every sleeve at 2011/2012 and report the post-publication moments, so
    that a full-window Sharpe ratio driven entirely by the first two thirds of
    the sample is visible.
  - >
    Report the treasury leg on the 1926-07 window, where the trend leg does not
    exist. A bond Sharpe ratio measured only over 1985-2025 is a measurement of
    one bond bull market.
  - >
    Report the admission test for the commodity leg even though it carries zero
    weight, so that the reader can see a sleeve failing the same bar the others
    pass.
  - Repeat the bootstrap at mean block lengths of 6 and 24 months.
  - >
    Report the minimum detectable effect beside every gap and mark any gap below
    it `unresolved` rather than positive.

reporting_requirements:
  - The freeze note and the vendor disclosure, printed with every table.
  - >
    The benchmark named beside every gap, and NEVER a figure combining the
    unlevered and the leverage-matched control.
  - Geometric growth as the deciding figure, with the gamma-3 certainty
    equivalent beside it and never instead of it.
  - The minimum detectable effect beside every gap.
  - >
    Gross notional beside every portfolio, so that a reader can see which figures
    require borrowing and how much.
  - The sha256 of every source file, the sheet or table read, and the observed
    first and last observation.
  - >
    An explicit statement that both AQR series are gross of the vendor's own
    trading costs by omission, and that the commodity series is excess of cash
    rather than a collateralised total return.
  - The full correlation matrix, not only the correlations with equity.

notes: >
  Retain `unresolved` rather than `rejected` when the instrument cannot separate
  the overlay from its leverage-matched control. The two findings are different
  and collapsing them would destroy the distinction this layer exists to keep.
  The result of this experiment cannot promote a sleeve; decision 0004 stands
  until a confirmatory specification exists, and none can be written against
  these files.
