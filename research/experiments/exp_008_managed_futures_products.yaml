    role: >
      Expense ratio, inception date, index, stated mandate and the prospectus
      after-tax return table, per fund, each with the SEC accession or sponsor URL
      it was read from and the date it was read. None of it is in Form N-PORT.
  - id: fred_tb3ms
    url: https://fred.stlouisfed.org/series/TB3MS
    manifest: data-manifests/fred_tb3ms.json
    role: cash leg of the marginal-contribution arm, matching Experiment 004

hostile_tests:
  - >
    Estimate every fund under all three attribution specifications and let the
    multiple-testing family be every fund times every specification, not the one
    reported.
  - >
    Pad the multiple-testing denominator with p = 1.0 to every screened series times
    three specifications, which cannot create a rejection and strictly tightens both
    corrections.
  - >
    Report the minimum detectable alpha at 80% power beside every intercept, and
    refuse to conclude on any fund whose window cannot support the test.
  - >
    Run the model-misfit pedestal on VTI, a fund that IS the market portfolio, so
    the attribution's own offset is measured rather than assumed to be zero.
  - >
    Run the identical attribution on the AQR TSMOM index itself over the SAME short
    window, so each fund's static-exposure loadings are read as distances from what
    a definitionally-trend series shows on these months.
  - Fixed calendar halves and rolling 36-month windows on every loading.
  - >
    Report the tracking difference against the AQR index on BOTH a raw
    difference-of-means basis and a beta-adjusted intercept basis, since a fund that
    delivers less exposure is not the same as a fund that loses money against it.
  - >
    Compute each fund's marginal certainty-equivalent contribution using Experiment
    004's five-way portfolio structure, and report the number of whole calendar
    years it rests on beside it.
  - >
    Report reinvested distributions from the filings and the prospectus after-tax
    drag, and state that the first is a lower bound and the second is not applied to
    any return.
  - >
    Report every screened series with the first criterion it failed, including the
    funds the project owner named if the screen excludes them.

reporting_requirements:
  - >
    Every product result is `exploratory`. The binding constraint is the data
    contract of decision record 0002 and the length of the window, not the evidence.
  - >
    Exposure delivery and alpha are distinguished in every sentence that reports a
    number. A 45-to-78-month window can answer the first and cannot answer the
    second.
  - The effective sample and the minimum detectable alpha at 80% power, per fund.
  - >
    The realised shrinkage factor per fund, measured from its own standard error and
    never the framework's reference value.
  - The screened universe with every exclusion and the criterion that caused it.
  - >
    Experiment 004's clause (d) verdict under BOTH the absolute and the relative
    reading, with the numbers that drive each, and a stated judgement of which
    reading is better justified on grounds of what the clause was for.
  - >
    An explicit statement that the hedge-fund CTA fee evidence does not transfer to
    these products, and that Experiment 004's verdict was about a vendor index and
    not about any product.

notes: >
  Experiment 004's specification, its ledger entries and its recorded status are
  not modified by this experiment. This is a second, differently-specified look; the
  ledger shows both, and the two must never be described as one run.
