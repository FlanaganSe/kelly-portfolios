hostile_tests:
  - Re-estimate with CAPM, FF3 and FF5-plus-UMD per region, and report all three;
    a loading that appears in only one specification is not an exposure.
  - Re-estimate every developed-ex-US fund on the EMERGING panel and every
    emerging fund on the DEVELOPED panel, and report what the wrong panel does to
    the intended loading. If a loading survives the wrong regional panel intact,
    the panel is not doing the work the specification claims it is.
  - Re-estimate every fund on the US panel, which is the panel Experiment 002
    would have used had it not excluded these funds, and report the difference.
  - Re-estimate on the fixed calendar halves and on rolling 36-month windows
    wherever the fund's history covers them.
  - Report the minimum detectable loading and the minimum detectable alpha at 80%
    power beside every estimate, so a wide interval cannot be read as evidence of
    absence.
  - Include every fund and every specification in the multiple-testing
    denominator, then widen it to every fund that passed the screen and to every
    mandate-matching series screened, padding with p = 1.0.
  - Compare each fund against the fitted combination of cheap broad ex-US funds,
    not only against the regional market, and state that the combination had
    look-ahead.
  - Measure the ex-US structural drag as the difference between VEA's pedestal on
    the ex-US panel and VTI's on the US panel over the same months, and state
    that it is an upper bound on withholding because it also contains every
    index-construction difference.
  - Separate renames from deaths in the attrition measurement, and recompute
    Experiment 002's own published attrition figure the same way.
  - Check every fund's first filed month against its prospectus inception date
    and flag any fund whose N-PORT history begins materially earlier, which means
    the series existed as a mutual fund before the ETF and its early months are
    not the product being audited.
  - Report the shelf depth per exposure per region, because an exposure available
    from exactly one product at any price is a concentration risk and not a
    choice.

reporting_requirements:
  - The complete screened-fund table, including every rejection and its reason.
  - Sample length in filed months and minimum detectable effect for EVERY fund,
    beside every estimate, never in a footnote.
  - Loadings under all three specifications and under the wrong regional panel.
  - Tracking difference against the regional comparator, against the fitted cheap
    combination, and against the region's French market total return, in separate
    columns with the withholding caveat attached to the third.
  - Raw and shrunk alpha side by side, never the raw alpha alone.
  - An explicit statement of which exposures are purchasable ex-US, at what fee,
    and from how many distinct products.
  - An explicit statement that a fund with a short history is `unresolved` and
    not `rejected`, and that this is a statement about the window.
  - An explicit statement that the binding constraint is the data contract and
    the length of the available windows, not the evidence.
  - An explicit statement of whether any previously published US result changed.

notes: >
  Promotion requires the intended exposure to be present, stable, economically
  material and cheap. Residual alpha is not a promotion criterion in either
  direction. Nothing here may raise a sleeve above `exploratory`.
