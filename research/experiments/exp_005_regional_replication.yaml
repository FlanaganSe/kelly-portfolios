  power:
    definition: >
      The minimum detectable effect is the smallest true annualised premium that a
      test of the given size would reject the null for with probability
      power_target, given the realised volatility and length:
      MDE_monthly = (z_{1-alpha} + z_{power}) * sigma / sqrt(T), annualised by 12.
      Identical to exp_001, so the figures are directly comparable to its grid.
    alpha_one_sided: 0.05
    alpha_two_sided: 0.05
    reported_for_every_cell: true
    also_report:
      - the realised power to detect the 2.0 percentage-point materiality
        threshold, per region and pooled
      - the realised power to detect 0.55% per month gross, Harvey, Liu and Zhu's
        (2016) structural estimate of the mean return of a genuinely true factor,
        which is 6.6 percentage points per year
      - the same MDE recomputed from the HAC standard error rather than
        sigma/sqrt(T)
      - the pooled MDE and the pooled effective sample size, which are the
        decisive outputs of the whole experiment

