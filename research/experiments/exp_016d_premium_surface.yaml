hostile_tests:
  - >
    Charge the equity-futures financing basis to the leverage-matched control on
    exactly the terms it is charged to every levered arm, and report how much of
    each headline gap survives. Not charging it is the error this test exists to
    catch.
  - >
    Charge every tilt fund its measured `alpha - pedestal` and report the whole
    ranking again. DFIV's -3.80 is the number most capable of reversing the
    proposal, and the headline arms do not charge it.
  - >
    Price MATE at its prospectus contractual floor of 100% equity rather than at
    the 115.87% its filing shows, and report both arms side by side, because the
    filed index future is not separable by sleeve.
  - >
    Sweep a 0-to-12 pp/yr haircut on the trend leg's arithmetic mean and report
    where every trend-bearing arm stops paying, against each benchmark
    separately.
  - >
    Sweep a 0-to-5 pp/yr haircut on the value premium and report where every
    tilted arm stops paying.
  - >
    Perturb every mapped loading by +/-0.15, the trend beta by +/-20% and the
    VXUS regional split by +/-5 points, and mark any arm whose gap changes sign
    anywhere on that grid as unresolved.
  - >
    Report all five eras for every arm, including the post-GFC sub-period which
    is declared in advance as the one least favourable to every candidate.
  - >
    Report the in-sample minimum-variance result beside the walk-forward one, so
    that the reader can see what an optimiser gains from knowing the answer.
  - Repeat the bootstrap at mean block lengths of 6 and 24 months.
  - >
    Report the minimum detectable effect beside every gap and mark any gap below
    it unresolved rather than positive.
  - >
    Sweep the equity premium and the trend premium in the SAME grid and report the
    required gross trend premium at each equity premium. A forward substitution
    applied to one input and not the other is not a sensitivity, it is a thumb.
  - >
    Report the overlay arms over the flat equity decade AND over both halves of
    its complement, so that a conditional result cannot be quoted without the
    window it is conditional on.
  - >
    Sweep the equity-index-futures basis across the 0.98%-2.31% break-even band
    and report whether the wrapper arms keep their order inside it.
  - >
    Reproduce every arm Experiment 016 also carries to its published point
    estimate. A shared arm that moves is a defect in this file.
  - >
    Report the growth-maximising trend notional implied by the four overlay arms
    beside the variance-minimising one derived elsewhere, and say plainly whether
    the two arguments agree, rather than reporting only the one that is larger.
  - >
    Report the years required to distinguish each arm from its benchmark at 80%
    power, and treat a figure beyond a human investing horizon as a finding.
  - >
    Report the growth wedge between `fund_overlay_30` and `fund_prorata_30`,
    which hold the same trend notional and differ only in whether the base was
    sold to pay for it. Under substitution the portfolio's edge is a weighted
    AVERAGE of its sleeves and under a financed overlay it is a SUM; this pair is
    that distinction realised on growth rather than asserted.
  - >
    Report the identical-portfolio pair `fund_prorata_30` and `fund_cash_30` with
    their two different benchmarks, so that a reader can see a funding rule
    changing an answer without changing a holding.

reporting_requirements:
  - The freeze note, printed with every table, including that funds are basis-mapped.
  - The minimum detectable effect beside every gap, in the same row.
  - >
    The benchmark named beside every gap, and NEVER a figure combining two
    benchmarks.
  - >
    Gross notional beside every arm, so that a reader can see which figures
    require borrowing and how much.
  - >
    The four charter common-core outcomes for every arm: after-cost relative
    growth, maximum drawdown, probability and magnitude of underperformance, and
    implementation burden.
  - The maximum regret across the perturbation grid beside every arm's point estimate.
  - >
    An explicit `not measured` in every after-tax cell where no fund-published
    drag exists, and no substituted default.
  - The sha256 of every source file, the table read, and the observed first and last observation.
  - >
    A statement that AQR's TSMOM is gross of the vendor's own trading costs by
    omission, and that MATE's and JPFP's structures are prospectus prose rather
    than filed numbers.

notes: >
  The four new arms here were selected after Experiment 016's results were
  inspected and are exploratory in the strongest sense: post-hoc arm selection is
  the failure mode the ledger exists to record, and it is recorded. Their
  Benjamini-Hochberg family is larger than 016's by four, which is the only
  legitimate reason a shared arm's adjusted p-value may differ.
  This experiment can rank constructions and it cannot rank funds. It can say
  which differences this data is capable of resolving and which it is not, and on
  a 427-month joint sample the second list is longer than the first. Retain
  `unresolved` rather than `rejected` wherever the instrument cannot separate an
  arm from its benchmark; decision 0009 clause 1 requires it and this
  repository's failure mode has never been excessive optimism. No sleeve, fund or
  portfolio is promoted by this specification, and decision 0004's non-promotion
  stands.
