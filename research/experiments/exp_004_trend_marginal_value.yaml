# Frozen before any result is examined.
#
# THIS IS A VENDOR-SERIES EVALUATION, NOT AN INDEPENDENT REPLICATION.
# See evidence_class below and parameters.evaluation_disclosure. No result from
# this specification may be described as a replication of time-series momentum.
experiment_family: exp_004_trend_marginal_value
title: AQR trend series as marginal crisis diversification, vendor-series evaluation
entry_point: exp_004_trend_marginal_value
run_kind: exploratory
evidence_class: vendor-series-evaluation
consumes_final_holdout: false
seed: 20260814

hypothesis: >
  Adding a diversified time-series trend sleeve to an unlevered passive
  equity/bond portfolio improves the portfolio's crisis-conditional outcome by a
  materially larger amount than a risk-matched increase in cash, and that
  improvement is not explained by a simpler static exposure or by volatility
  scaling alone. The claim under test is MARGINAL utility inside a portfolio, not
  standalone significance of the trend series.

mechanism: >
  The proposed mechanism is that a slow, diversified, volatility-scaled futures
  strategy tends to be short risk assets by the time a drawdown is well
  developed, supplying convexity that a static allocation cannot. The mechanism
  is disputed at its root. Huang et al. (2020) find the original pooled t of 4.34
  sits BELOW its own bootstrap 5% critical values of 12.53 (wild) and 4.83
  (pairs), with mean out-of-sample R-squared negative at -0.67%, and cannot
  distinguish the portfolio return from a static rule that buys assets with
  positive historical sample means and requires no predictability at all. Kim,
  Tse and Wald (2016) show removing volatility scaling collapses the pooled
  statistic from 4.34 to 1.68, and Goyal and Jegadeesh (2018) show the strategy
  carries a large embedded net-long market position. The defensible prior is
  therefore that the series may be profitable while returns are not predictable,
  which is a different and weaker claim.

falsifier: >
  Trend is rejected as a portfolio sleeve when ANY of: (a) its marginal net
  benefit over the risk-matched cash comparator is below the materiality
  threshold of 0.30 percentage points per year of certainty-equivalent return
  under the net-pessimistic cost column; (b) more than 60% of its full-period
  marginal benefit disappears when the single best crisis is removed; (c) more
  than 40% disappears when the single best month is removed; (d) an attribution
  on static asset exposures plus a volatility-scaled market position leaves a
  marginal benefit below the materiality threshold, i.e. a simpler static
  exposure explains it; or (e) the post-publication era marginal benefit is
  negative while the pre-publication era's is positive and the difference's 90%
  interval excludes zero. Where the public series cannot answer investability at
  all, the outcome is `unresolved`, NOT `rejected`.

universe:
  description: >
    Published vendor time-series-momentum return series plus one unlevered
    passive equity/bond portfolio and a cash series. No futures contracts, no
    rolls, no contract-level data. This experiment therefore cannot and does not
    reimplement the strategy.
  comparison_set:
    - id: passive_benchmark
      description: Unlevered 60/40 equity/bond from investable total-return histories.
    - id: volatility_scaled_passive
      description: >
        The same passive benchmark scaled by the SAME lagged volatility estimator
        and the SAME exposure cap applied to the trend sleeve, so the comparison
        is not a scaled strategy against an unscaled benchmark.
    - id: trend_alone
      description: The vendor trend series on its own, as published.
    - id: passive_plus_trend
      description: >
        Passive benchmark with the trend sleeve funded proportionally from both
        legs at the frozen sleeve weight.
    - id: passive_plus_cash
      description: >
        Passive benchmark plus cash at a MATCHED ex-ante risk budget, which is the
        comparator that decides the experiment.
  excluded:
    - Any claim of independent replication.
    - Any CTA index or peer-group average, which carry survivorship and backfill
      distortions of the order of the entire gross premium.

sample_policy:
  start: "1990-01"
  end: "2025-12"
  held_out: >
    Observations after 2025-12 are not read. The pre-2000 reconstructed portion
    of the vendor history is additionally treated as a separate, weaker era and
    is never pooled with the live-era results without the split being shown.
  embargo: >
    The volatility estimator uses only data through t-1 and the exposure applies
    at t+1, so no observation is used before its availability timestamp.
  eras:
    - name: reconstructed_history
      start: "1990-01"
      end: "2000-12"
      rationale: >
        Vendor-reconstructed or early history. Reported separately because a
        reconstruction is not live evidence and pooling it hides that.
    - name: pre_publication
      start: "2001-01"
      end: "2011-12"
      rationale: >
        Before Moskowitz, Ooi and Pedersen (2012). The publication boundary is
        approximate, and that approximation is part of the result.
    - name: post_publication
      start: "2012-01"
      end: "2025-12"
      rationale: >
        After publication and after the strategy became widely marketed. McLean
        and Pontiff (2016) predict decay here.
    - name: full_period
      start: "1990-01"
      end: "2025-12"
      rationale: Full available window, reported alongside the splits, never instead of them.
    - name: crisis_conditional
      start: "1990-01"
      end: "2025-12"
      rationale: >
        Not a calendar window: the union of the predeclared crisis windows in
        parameters.crisis_windows, evaluated over the full period. Frozen here so
        that crises cannot be selected after seeing which ones the sleeve helped.

benchmark:
  primary: passive benchmark plus cash at a matched ex-ante risk budget
  rationale: >
    The benchmark choice decides the answer. Comparing a trend-diversified
    portfolio against the fully invested passive portfolio flatters it, exactly as
    comparing a protected portfolio against a fully invested index does. The
    risk-matched cash comparator is the honest control.
  secondary: volatility-scaled passive benchmark, same estimator and caps

primary_metric:
  name: marginal certainty-equivalent return over the risk-matched cash comparator
  definition: >
    CRRA gamma = 3 certainty-equivalent return of passive_plus_trend minus that of
    passive_plus_cash, on identical cash flows and identical risk budgets.
  units: percentage points per year
  uncertainty: >
    Stationary block-bootstrap 95% interval on the paired difference, plus a
    crisis-conditional interval computed on the crisis windows only, where the
    effective sample is small and the interval will be wide.

secondary_metrics:
  - name: crisis-conditional marginal drawdown reduction
    units: percentage points
  - name: full-period net geometric return
    units: percentage points per year
  - name: maximum drawdown
    units: percent
  - name: expected shortfall at 5%
    units: percent per month
  - name: downside beta to the passive benchmark
    units: beta
  - name: correlation to the passive benchmark, full period and crisis windows separately
    units: correlation
  - name: attribution to static asset exposures and a time-varying market position
    units: percentage points per year
  - name: realised sleeve volatility versus its ex-ante target
    units: percentage points per year

cost_model:
  applied: partially
  vendor_series_basis: >
    The published series is reported by its vendor on a stated fee and cost
    basis, which is recorded verbatim in the manifest. It is NOT re-costed from
    the inside, because the underlying trades are not observable here.
  investor_level_costs:
    net_optimistic:
      management_fee_annual_percent: 0.65
      assumption: a cheap accessible implementation exists at this fee
    net_pessimistic:
      management_fee_annual_percent: 1.50
      performance_fee_percent_of_gains: 10.0
      assumption: >
        Typical accessible fee for a liquid alternative, plus the historical
        finding that CTA investors did not capture the gross edge: excess returns
        net of fees were insignificantly different from zero over 1994-2012 while
        gross excess returns were 6.1%, with fee income around 4% of assets.
  reporting_columns: [gross, net-optimistic, net-pessimistic]
  default_reported_column: net-pessimistic
  rebalancing_costs_of_the_sleeve: >
    Charged on the portfolio-level trades that fund and rebalance the sleeve, at
    the same spread assumptions as exp_003.

rebalance_rule:
  sleeve_weight: frozen at 0.15 of portfolio value, funded pro rata from equity and bonds
  frequency: monthly, at the same lag and execution convention as exp_003
  volatility_targeting: >
    The same lagged volatility estimator and the same exposure cap are applied to
    the trend sleeve and to the volatility-scaled passive comparator wherever
    logically possible, so that scaling cannot be the source of a measured
    advantage.

inference:
  bootstrap: stationary block bootstrap on the joint panel of portfolio and sleeve returns
  block_length_policy: >
    Mean block length frozen at 12 months, with 6 and 24 as predeclared
    neighbours. Crisis-conditional statistics use the same blocks resampled
    within crisis windows, and the resulting effective sample size is reported
    beside every crisis figure.
  multiple_testing_correction: >
    Holm family-wise error rate at 0.05 across the five comparison portfolios and
    the two era splits. The hostile tests below are not additional hypotheses;
    they are conditions the single hypothesis must survive, and each is reported
    whether or not it is favourable.
  confidence_level: 0.95
  resamples: 20000
  notes: >
    Crisis windows contain few months. Wide intervals are the expected and honest
    outcome, and a wide interval is reported as `unresolved`, not narrowed by
    changing the estimator.

rejection_rule: >
  Mark `rejected` when a falsifier clause fires, i.e. when the marginal net
  benefit is economically negligible, concentrated in one selected crisis, or
  explained by a simpler static exposure. Mark `unresolved` when the public
  series cannot answer investability -- when the marginal benefit is positive but
  its interval is too wide to distinguish from the risk-matched cash comparator,
  or when the vendor series' fee, cost and construction basis cannot be
  established from the archived workbook. `unresolved` is the expected outcome and
  is not a failure of the experiment. Under no outcome may this specification
  produce a status above `exploratory`, because a vendor-series evaluation cannot
  support one.

parameters:
  evaluation_disclosure:
    is_vendor_series_evaluation: true
    is_independent_replication: false
    statement: >
      This experiment evaluates a published, author-maintained vendor series. It
      is NOT an independent replication of time-series momentum. An independent
      reimplementation would require contract-level futures histories, roll
      conventions, collateral returns, execution assumptions and point-in-time
      market availability, none of which are inputs here. Any write-up that
      describes this as a replication is wrong, and the archived workbook,
      sheet, and revision date must accompany every figure because vendor URLs,
      workbooks and revisions change.
    author_interest: >
      The series is maintained by a firm that sells the strategy. This is not an
      accusation; it is a recorded conflict that raises the required evidential
      standard.
  materiality_threshold_annual_percent: 0.30
  crra_gamma: 3
  sleeve_weight: 0.15
  volatility_lookback_days: 60
  volatility_lookback_alternatives_days: [20, 120]
  exposure_cap: 1.5
  crisis_windows:
    - name: dotcom
      start: "2000-09"
      end: "2002-09"
    - name: gfc
      start: "2007-11"
      end: "2009-02"
    - name: covid
      start: "2020-02"
      end: "2020-03"
    - name: inflation_2022
      start: "2022-01"
      end: "2022-10"
  crisis_window_note: >
    Frozen before any result is examined and defined by peak-to-trough equity
    drawdown dates, not by when the sleeve performed well.
  cash_series: TB3MS

data_sources:
  - id: aqr_time_series_momentum
    url: recorded in the data manifest, with workbook name, sheet name and
      retrieval time, because the vendor's URLs and workbooks change
  - id: total_return_indexes
    url: recorded per sleeve in the data manifest at retrieval time
  - id: fred_tb3ms
    url: https://fred.stlouisfed.org/series/TB3MS

hostile_tests:
  - Remove the best trend month and re-report every statistic.
  - Remove the best crisis entirely and re-report every statistic.
  - Delay execution by one and by five additional trading days.
  - Double every cost and fee assumption.
  - Cap leverage at the frozen exposure cap and at half of it.
  - Stress overnight gaps and sharp reversals, since slow signals miss gaps and
    whipsaw on reversals.
  - Change the volatility lookback to 20 and 120 days WITHOUT retuning anything
    else, since volatility scaling is the effect and not an implementation detail.
  - Compare pre-publication and post-publication performance explicitly.
  - Attribute returns to static asset exposures and to a time-varying market
    position, and report how much marginal benefit survives the attribution.
  - Replace the trend sleeve with a static long position sized to the same
    ex-ante risk and report whether the marginal benefit disappears.

reporting_requirements:
  - The vendor disclosure above, printed with every table.
  - Full-period AND crisis-conditional marginal utility, never standalone
    significance alone.
  - Gross, net-optimistic and net-pessimistic in separate columns.
  - Effective sample size beside every crisis-conditional figure.
  - The result of every hostile test, favourable or not.
  - An explicit statement of which of the five comparison portfolios each figure
    refers to.

notes: >
  Retain `unresolved` rather than `rejected` when the available public series
  cannot answer investability. The two are different findings and collapsing them
  would destroy the distinction this layer exists to preserve.
