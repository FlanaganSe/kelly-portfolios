    manifest: data-manifests/french_developed_ex_us_momentum_monthly.json
  - id: french_emerging_momentum_monthly
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/Emerging_MOM_Factor_CSV.zip
    manifest: data-manifests/french_emerging_momentum_monthly.json

hostile_tests:
  - >
    Resample the three regions INDEPENDENTLY rather than jointly and report how
    much narrower the interval becomes. This is the error the design exists to
    avoid and its size must be shown, not asserted.
  - Drop the best calendar year of every regional and pooled cell and re-report.
  - >
    Test whether the best calendar year is the same across regions, which decides
    whether the regions share an upside episode.
  - >
    Test whether the WORST calendar year is the same across regions, and evaluate
    2009 by name in every region, which decides whether the regions crash
    together.
  - >
    Compute the mean pairwise cross-region correlation on the worst decile of
    pooled composite months and compare it with the all-month correlation.
  - >
    Pool developed-ex-US and emerging only, excluding the US entirely, which is
    the genuinely independent look at the US result.
  - Re-pool with inverse-variance weights instead of equal weights.
  - >
    Re-run on the 6 and 24 month bootstrap block lengths without retuning, and
    report the corrected Politis-White automatic length for every cell.
  - >
    Run the identical pooled procedure on a synthetic zero-mean Gaussian panel of
    matched length and matched cross-region covariance, to show what the machinery
    produces from noise that is correlated the same way.
  - >
    Report the US cells against Experiment 001's published UMD figures for the
    same windows; a disagreement is a defect in this experiment.
  - >
    Re-run the pooled full post-publication cell on exp_001's alternative Carhart
    (1997) publication date, 1998-01, reported beside the primary era and never
    substituted for it.

reporting_requirements:
  - Source file URL, SHA-256 and retrieval time for all three files.
  - >
    The frequency, row count and date range of each regional momentum file, stated
    explicitly, because the claim that no such monthly file exists is what this
    experiment corrects.
  - >
    Number of monthly observations per region per era, and the count of months
    dropped by the cross-region intersection.
  - >
    Both uncorrected and FDR-corrected inference over the frozen 9-cell family,
    with Holm-Bonferroni beside it, and the 3 pooled cells corrected separately.
  - The 80%-power minimum detectable effect for every cell, regional and pooled.
  - >
    The MEASURED pooled effective sample size, in all four declared forms, beside
    the naive 3T that independence would have claimed.
  - >
    The joint and the independent cross-region bootstrap intervals side by side,
    with the independent one labelled invalid.
  - The mean pairwise cross-region correlation for every era.
  - Whether the regions share the same best calendar year, stated as a yes or no.
  - >
    Whether the regions crash together, stated as a yes or no, with the worst-year
    agreement, the named year 2009 and the tail correlation behind it.
  - >
    An explicit statement that NO momentum file in ANY region was ever gated
    against a printed table, so every second moment here is UNMEASURED.
  - >
    Cost as a function of stated one-sided monthly turnover, with an explicit
    statement of which turnover assumption belongs to the academic long-short
    factor and an explicit refusal to assert one for a long-only implementation.
  - >
    An explicit statement that all figures are gross, long-short and not
    investable, and that shorting in emerging markets is harder than in the US.
  - >
    A closed status from the result taxonomy for UMD, and for a status of
    `unresolved` an explicit statement of exactly what would fire.

notes: >
  A before-and-after comparison across a publication date is descriptive and
  confounds publication with changing composition, valuation regimes, crowding and
  chance. Adding regions does not change that: it adds sample, not identification.
  This specification does not claim to identify a publication effect. It asks only
  whether three regions together can sign a premium that one region could not,
  measures - rather than assumes - how much sample three correlated regions
  actually supply, and tests separately whether those regions crash together,
  which is the question that decides how much of that measured sample survives in
  the tail.
