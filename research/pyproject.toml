[project]
name = "portfolio-edge"
version = "0.1.0"
description = "Reproducible research workspace for portfolio-edge experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.15",
    "pyarrow>=17,<22",
    "requests>=2.32,<3",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "mypy>=1.11,<2",
    "ruff>=0.6",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in, as research/README.md and AGENTS.md both promise.
# Run them with `uv run pytest -m network` or `-m ""` for everything.
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: test requires live network access to a primary data source",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
