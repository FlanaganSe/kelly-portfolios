# Publish the static bundle to the S3 bucket already behind kellyportfolios.com.
#
# Why S3 and CloudFront rather than a Pages host: the domain is registered at Amazon
# Registrar, its DNS is Route 53, and the apex already points at a CloudFront
# distribution. Deploying into that distribution changes no DNS record at all, so there
# is no propagation window and no cutover. `AWS_ACCESS_KEY_ID` and
# `AWS_SECRET_ACCESS_KEY` are already repository secrets.
#
# The pick stays reversible. `pnpm build` emits a plain static bundle in `dist/`, so
# moving to any other host later means changing the last two steps.
#
# ---------------------------------------------------------------------------
# What the first runs found, on 2026-08-24.
#
# There is one distribution, `E2UXACC7VKS53Z`, and Route 53 points the domain at it. It
# had a single origin, `placeholder.sst.dev`, which answers nothing, and no custom error
# responses. None of that was broken: SST's design decides the origin per request inside a
# viewer-request CloudFront Function, so the function was the entire routing behaviour of
# the site and the origin list was a formality. It is also why a miss came back 502 — a
# custom error response is fetched with the behaviour's own origin, and the function does
# not run for it — so `Configure distribution` gives the distribution a real S3 origin.
#
# The function SST installed looks every path up in a CloudFront key-value store, one key
# per file in the bucket — the store holds five — and rewrites anything it cannot find to
# `/index.html`. That is correct for the client-routed bundle it was built for and wrong
# for a build of thirty-odd pages: every wrong URL answers with the home page and a 200,
# which is what `https://kellyportfolios.com/no-such-page/` still does.
#
# So `Configure distribution` replaces that function with `scripts/cloudfront/directory-index.js`,
# which derives `<route>/index.html` from the URL instead of consulting a store, and adds
# the error responses that turn a genuine miss into `/404.html` with a 404. `publish`
# refuses to upload until that has happened. `docs/deploying.md` is the long version, and
# `scripts/cloudfront/dump.sh` prints the whole arrangement on demand.
#
# Two traps this workflow used to fall into are worth keeping in mind if it is rewritten:
# `Origins.Items[0]` is the placeholder, so a deploy that derives the bucket from it syncs
# a whole site into a bucket named `placeholder.sst.dev`; and the bucket is named nowhere
# in the distribution, only inside the function, which is where `state.sh` reads it from.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen, upload nothing"
        type: boolean
        default: true

# One deploy at a time, and never cancel one halfway: a half-synced bucket serves a
# mixture of two builds, and the hashed asset names make that look like a cache bug.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SITE_DOMAIN: kellyportfolios.com

jobs:
  # Reports; changes nothing. Safe to run at any time, and worth running before a
  # release: the distribution is edited by hand, so nothing else notices when it drifts.
  discover:
    runs-on: ubuntu-latest
    outputs:
      distribution_id: ${{ steps.find.outputs.distribution_id }}
      bucket: ${{ steps.find.outputs.bucket }}
      origin_domain: ${{ steps.find.outputs.origin_domain }}
      origin_is_site: ${{ steps.find.outputs.origin_is_site }}
      attached_function: ${{ steps.find.outputs.attached_function }}
      function_is_ours: ${{ steps.find.outputs.function_is_ours }}
      honest_404: ${{ steps.find.outputs.honest_404 }}
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: What is in front of the domain
        id: find
        run: scripts/cloudfront/state.sh | jq .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `astro build` is the real gate on content collections: `astro check` does not
      # validate them, so a figure citing a heading that no longer exists fails here
      # and nowhere earlier.
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  publish:
    needs: [discover, build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # A half-published site is worse than an unpublished one, so the state of the
      # distribution is checked before a single object moves.
      - name: Refuse to publish into a distribution that cannot serve the pages
        if: needs.discover.outputs.ready != 'true'
        run: |
          if [ '${{ needs.discover.outputs.origin_is_site }}' != 'true' ]; then
            echo "::error::The behaviour serves from '${{ needs.discover.outputs.origin_domain }}', not the bucket in site.env."
            echo "Uploading would put the build somewhere no reader is served from."
          elif [ '${{ needs.discover.outputs.function_is_ours }}' != 'true' ]; then
            echo "::error::The viewer-request function is '${{ needs.discover.outputs.attached_function }}', not ours."
            echo "It resolves paths through a key-value store this deploy does not maintain."
          else
            echo "::error::A miss does not answer 404. The custom error responses are not in place."
          fi
          echo "Run the Configure distribution workflow. See docs/deploying.md."
          exit 1

      # And again against the live site, because a configuration read is a claim about
      # behaviour and this is the behaviour. A URL that cannot exist must not answer 200.
      - name: Confirm a miss is still a miss
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/deploy-probe-does-not-exist/")
          echo "a URL that cannot exist   $code"
          if [ "$code" = "200" ]; then
            echo "::error::It answered 200. The single-page fallback is still live; not publishing."
            exit 1
          fi

      # Hashed filenames are immutable and cached for a year. HTML, the sitemap and
      # the search index are re-read every time, so the only thing a deploy has to
      # invalidate is the small set of documents.
      - name: Upload the fingerprinted assets first
        run: |
          aws s3 sync dist/ "s3://${{ needs.discover.outputs.bucket }}/" \
            --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML last, so a reader never gets a new document referencing an asset that has
      # not landed yet.
      - name: Upload the documents
        run: |
          aws s3 sync dist/ "s3://${{ needs.discover.outputs.bucket }}/" \
            --delete \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ needs.discover.outputs.distribution_id }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ needs.discover.outputs.distribution_id }}" --id "$id"

      - name: Check the live site
        run: |
          set -euo pipefail
          fail=0
          # One path from each family that has its own route generator, so a broken
          # collection shows up here rather than in a search console six weeks later.
          for path in / /portfolios/ /portfolios/one-fund/ \
                      /portfolios/value-lean/ /portfolios/with-trend/ \
                      /strategies/ /strategies/trend-following/ /strategies/market-timing/ \
                      /strategies/gold-and-bitcoin/ /strategies/crash-insurance/ \
                      /strategies/value-and-momentum/ /strategies/international/ \
                      /strategies/fees-and-taxes/ \
                      /funds/ /tools/which-account/ /search/ \
                      /about/ /corrections/ /disclosures/ /disclaimer/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}${path}")
            printf '%-32s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # The retired routes are meta-refresh pages, not 404s. An old bookmark, an old
          # search result and an old inbound link all have to keep working, so this
          # checks the document actually carries the refresh rather than merely
          # answering 200 — a 200 alone would also be true of a stale copy of the page.
          for path in /start/ /portfolio/ /stacking/ /how-sure/ /methodology/ \
                      /doesnt-work/ /research/ /research/long-only-capture/ \
                      /research/decisions/0004-no-sleeve-promoted/ /tools/ \
                      /tools/placement/ /evidence/ /evidence/trend-following/ \
                      /evidence/market-timing/ /portfolios/whole-market/ \
                      /portfolios/held-well/ /tools/placement/; do
            body=$(curl -s "https://${SITE_DOMAIN}${path}")
            if printf '%s' "$body" | grep -qi 'http-equiv="refresh"'; then
              printf '%-48s redirect\n' "$path"
            else
              printf '%-48s NOT A REDIRECT\n' "$path"
              fail=1
            fi
          done

          # A missing page must 404. If it returns 200 the SPA error mapping is still
          # in place and every wrong URL is serving the home page.
          missing=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/this-page-does-not-exist/")
          echo "404 check     $missing"
          if [ "$missing" = "200" ]; then
            echo "::error::A nonexistent URL returned 200. Remove the CloudFront custom error response mapping 404 to /index.html."
            fail=1
          fi
          exit $fail
