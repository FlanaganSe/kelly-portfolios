# Publish the static bundle to the S3 bucket already behind kellyportfolios.com.
#
# Why S3 and CloudFront rather than a Pages host: the domain is registered at Amazon
# Registrar, its DNS is Route 53, and the apex already points at a CloudFront
# distribution. Deploying into that distribution changes no DNS record at all, so there
# is no propagation window and no cutover. `AWS_ACCESS_KEY_ID` and
# `AWS_SECRET_ACCESS_KEY` are already repository secrets.
#
# The pick stays reversible. `pnpm build` emits a plain static bundle in `dist/`, so
# moving to any other host later means changing the last two steps.
#
# ---------------------------------------------------------------------------
# What the first run found, on 2026-08-24.
#
# The distribution is SST's, built for the single-page client, and it is configured
# for one in three ways that all fail quietly rather than loudly:
#
#   1. `placeholder.sst.dev` sits first in the origin list. A deploy that reads
#      `Origins.Items[0]` — this one did — derives the bucket name
#      `placeholder.sst.dev` and syncs the whole site into a bucket that does not
#      exist. `scripts/cloudfront/state.sh` reads the origin that the default cache
#      behaviour targets instead, which is the one that answers a request.
#
#   2. A REST origin (`bucket.s3.region.amazonaws.com`) rather than the website
#      endpoint. Only the website endpoint resolves `/start/` to `start/index.html`;
#      a REST origin misses on every page but the root, because CloudFront's default
#      root object applies to `/` alone and to no other directory.
#
#   3. `errorPage: "index.html"` in `sst.config.ts`, which is a custom error response
#      mapping 403 and 404 to `/index.html` with a 200. Against a directory-format
#      build that answers every wrong URL with the *home page* and a success status,
#      so a typo looks like a working page and a crawler indexes a copy of the home
#      page under each one.
#
# Points 2 and 3 are what the `Configure distribution` workflow fixes, and `publish`
# refuses to upload until they are fixed. `docs/deploying.md` is the long version.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen, upload nothing"
        type: boolean
        default: true

# One deploy at a time, and never cancel one halfway: a half-synced bucket serves a
# mixture of two builds, and the hashed asset names make that look like a cache bug.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SITE_DOMAIN: kellyportfolios.com

jobs:
  # Reports; changes nothing. Safe to run at any time, and worth running before a
  # release: the distribution is edited by hand, so nothing else notices when it drifts.
  discover:
    runs-on: ubuntu-latest
    outputs:
      distribution_id: ${{ steps.find.outputs.distribution_id }}
      bucket: ${{ steps.find.outputs.bucket }}
      origin_domain: ${{ steps.find.outputs.origin_domain }}
      origin_kind: ${{ steps.find.outputs.origin_kind }}
      rewrites_directories: ${{ steps.find.outputs.rewrites_directories }}
      spa_fallback: ${{ steps.find.outputs.spa_fallback }}
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: What is in front of the domain
        id: find
        run: scripts/cloudfront/state.sh | jq .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `astro build` is the real gate on content collections: `astro check` does not
      # validate them, so a figure citing a heading that no longer exists fails here
      # and nowhere earlier.
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  publish:
    needs: [discover, build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # A half-published site is worse than an unpublished one, so the state of the
      # distribution is checked before a single object moves.
      - name: Refuse to publish into a distribution that cannot serve the pages
        if: needs.discover.outputs.ready != 'true'
        run: |
          origin='${{ needs.discover.outputs.origin_domain }}'
          if [ '${{ needs.discover.outputs.origin_kind }}' = 'foreign' ]; then
            echo "::error::The behaviour serving the site points at ${origin}, not at a bucket."
          elif [ '${{ needs.discover.outputs.rewrites_directories }}' != 'true' ]; then
            echo "::error::${origin} is a REST origin with nothing rewriting the URI."
            echo "Every page except the root would 404."
          else
            echo "::error::A custom error response still maps a miss to /index.html."
            echo "Every wrong URL would answer with the home page and a 200."
          fi
          echo "Run the Configure distribution workflow. See docs/deploying.md."
          exit 1

      # And again against the live site, because a configuration read is a claim about
      # behaviour and this is the behaviour. A URL that cannot exist must not answer 200.
      - name: Confirm a miss is still a miss
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/deploy-probe-does-not-exist/")
          echo "a URL that cannot exist   $code"
          if [ "$code" = "200" ]; then
            echo "::error::It answered 200. The single-page fallback is still live; not publishing."
            exit 1
          fi

      # Hashed filenames are immutable and cached for a year. HTML, the sitemap and
      # the search index are re-read every time, so the only thing a deploy has to
      # invalidate is the small set of documents.
      - name: Upload the fingerprinted assets first
        run: |
          aws s3 sync dist/ "s3://${{ needs.discover.outputs.bucket }}/" \
            --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML last, so a reader never gets a new document referencing an asset that has
      # not landed yet.
      - name: Upload the documents
        run: |
          aws s3 sync dist/ "s3://${{ needs.discover.outputs.bucket }}/" \
            --delete \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ needs.discover.outputs.distribution_id }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ needs.discover.outputs.distribution_id }}" --id "$id"

      - name: Check the live site
        run: |
          set -euo pipefail
          fail=0
          # One path from each family that has its own route generator, so a broken
          # collection shows up here rather than in a search console six weeks later.
          for path in / /start/ /stacking/ /portfolio/ /doesnt-work/ /how-sure/ \
                      /funds/ /tools/ /tools/placement/ /tools/how-long/ \
                      /research/ /research/long-only-capture/ \
                      /research/decisions/0004-no-sleeve-promoted/ \
                      /about/ /methodology/ /corrections/ /disclosures/ /disclaimer/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}${path}")
            printf '%-16s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # A missing page must 404. If it returns 200 the SPA error mapping is still
          # in place and every wrong URL is serving the home page.
          missing=$(curl -s -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/this-page-does-not-exist/")
          echo "404 check     $missing"
          if [ "$missing" = "200" ]; then
            echo "::error::A nonexistent URL returned 200. Remove the CloudFront custom error response mapping 404 to /index.html."
            fail=1
          fi
          exit $fail
